{{- $ver := .AnsysVersion }}
{{- $ansys_version_number := printf "v%s%s" (substr 2 4 $ver) (substr 5 6 $ver) }}
{{- $ansys_root := printf "%s/%s" .AnsysInstallDir $ansys_version_number }}
{{- $datamount := "/data" }}
{{- $novnc_port := 6080 }}
version: v4

volumes:
  data:
    reference: {{.Volume}}

services:
  xfce4:
    persist: true
    image:
      uri: {{.AnsysFluentDesktopContainerURI}}
      secret: {{.AnsysFluentDesktopContainerOciSecret}}
    network:
      ports:
        - name: novnc
          protocol: tcp
          port: {{ $novnc_port }}
      endpoints:
        # Access the desktop straight from a browser at the generated subdomain
        # URL. No `fuzzball workflow port-forward` needed.
        - name: vnc
          port-name: novnc
          protocol: http
          type: subdomain
          scope: {{.EndpointScope}}
    readiness-probe:
      # Service only reports RUNNING once noVNC is answering, so the endpoint
      # isn't a dead link while the desktop is still coming up.
      http-get:
        path: /
        port: {{ $novnc_port }}
        scheme: HTTP
      initial-delay-seconds: 15
    env:
      - HOME=/tmp/home
      - ANSYSLMD_LICENSE_FILE={{.AnsyslmdLicenseFile}}
    mounts:
      {{ $datamount }}: data
    script: |
      #!/bin/sh
      export PATH={{$ansys_root}}/fluent/bin:{{$ansys_root}}/Framework/bin/Linux64:$PATH
      echo "Starting Fluent virtual desktop (noVNC on :{{ $novnc_port }})..."
      /usr/local/bin/start-vncserver.sh
    resource:
      cpu:
        cores: {{.FluentDesktopCores}}
        affinity: NUMA
      memory:
        size: {{.FluentDesktopMemory}}
    policy:
      timeout:
        execute: {{.Timeout}}