version: v4
jobs:
  printer:
    image:
      uri: {{.Container}}
    policy:
      timeout:
        execute: 1m{{.Seconds}}s
    script: |
      #!/bin/sh
      for i in $(seq 1 {{.Seconds}}); do echo $i; sleep 1; done
    resource:
      cpu:
        cores: 1
      memory:
        size: 1GB
