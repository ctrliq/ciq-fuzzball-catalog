        "memory" "256GiB"
        "dtype" ""
        "kv_cache_dtype" "fp8"
        "max_model_len" 262144
        "max_num_seqs" 0
        "max_num_batched_tokens" 0
        "gpu_memory_utilization" ""
        "mamba_ssm_cache_dtype" ""
        "reasoning_parser" "nemotron_v3"
        "reasoning_parser_plugin_repo" ""
        "tool_call_parser" "qwen3_coder"
        "spec_method" ""
        "spec_style" ""
        "spec_tokens" 0
        "env" (list)
        "extra" (list)
      )
      "super-120b-bf16" (dict
        "repo" "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
        "image" "docker://vllm/vllm-openai:v0.17.1"
        "gpu_model" "NVIDIA L40S"
        "gpus" 4
        "cores" 32
        "memory" "256GiB"
        "dtype" ""
        "kv_cache_dtype" "fp8"
        "max_model_len" 262144
        "max_num_seqs" 0
        "max_num_batched_tokens" 0
        "gpu_memory_utilization" ""
        "mamba_ssm_cache_dtype" ""
        "reasoning_parser" "nemotron_v3"
        "reasoning_parser_plugin_repo" ""
        "tool_call_parser" "qwen3_coder"
        "spec_method" ""
        "spec_style" ""
        "spec_tokens" 0
        "env" (list)
        "extra" (list)
      )
      "super-120b-nvfp4" (dict
        "repo" "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
        "image" "docker://vllm/vllm-openai:v0.24.0-ubuntu2404"
        "gpu_model" "NVIDIA B200"
        "gpus" 2
        "cores" 16
