      "nano-30b-fp8" (dict
        "repo" "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8"
        "image" "docker://vllm/vllm-openai:v0.12.0"
        "gpu_model" "NVIDIA L40S"
        "gpus" 1
        "cores" 8
        "memory" "64GiB"
        "dtype" ""
        "kv_cache_dtype" "fp8"
        "max_model_len" 262144
        "max_num_seqs" 0
        "max_num_batched_tokens" 0
        "gpu_memory_utilization" ""
        "mamba_ssm_cache_dtype" ""
        "reasoning_parser" "nano_v3"
        "reasoning_parser_plugin_repo" "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
        "tool_call_parser" "qwen3_coder"
        "spec_method" ""
        "spec_style" ""
        "spec_tokens" 0
        "env" (list "VLLM_USE_FLASHINFER_MOE_FP8=0")
        "extra" (list "--async-scheduling")
      )
      "nano-30b-bf16" (dict
        "repo" "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
        "image" "docker://vllm/vllm-openai:v0.12.0"
        "gpu_model" "NVIDIA L40S"
        "gpus" 1
        "cores" 8
        "memory" "64GiB"
        "dtype" ""
        "kv_cache_dtype" "auto"
        "max_model_len" 262144
        "max_num_seqs" 8
        "max_num_batched_tokens" 0
        "gpu_memory_utilization" ""
        "mamba_ssm_cache_dtype" ""
        "reasoning_parser" "nano_v3"
        "reasoning_parser_plugin_repo" "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
        "tool_call_parser" "qwen3_coder"
        "spec_method" ""
        "spec_style" ""
        "spec_tokens" 0
        "env" (list "VLLM_USE_FLASHINFER_MOE_FP8=0")
        "extra" (list)
      )
      "super-120b-fp8" (dict
        "repo" "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8"
