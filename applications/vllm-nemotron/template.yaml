{{- $model := trim .Model }}
{{- if not (hasKey $recipes $model) }}
  {{- fail (printf "unknown Model %q; expected one of: %s" $model (join ", " (keys $recipes | sortAlpha))) }}
{{- end }}
{{- $recipe := index $recipes $model }}

{{- $data_mount := "/data" }}
{{- $api_port := randInt 10000 24000 }}
{{- $plugin_file := "nano_v3_reasoning_parser.py" }}
{{- $plugin_path := printf "%s/%s" $data_mount $plugin_file }}

{{- /* Resolve every knob: the recipe value unless the user overrode it. */}}
{{- $image := index $recipe "image" }}
{{- if trim .VllmImage }}{{- $image = trim .VllmImage }}{{- end }}

{{- $gpus := index $recipe "gpus" | int }}
{{- if gt (.GPUDevices | int) 0 }}{{- $gpus = .GPUDevices | int }}{{- end }}

{{- $gpu_model := index $recipe "gpu_model" }}
{{- if eq .GPUModel "any" }}{{- $gpu_model = "" }}{{- else if ne .GPUModel "recipe-default" }}{{- $gpu_model = trim .GPUModel }}{{- end }}

{{- $cores := index $recipe "cores" | int }}
{{- if gt (.Cores | int) 0 }}{{- $cores = .Cores | int }}{{- end }}

{{- $memory := index $recipe "memory" }}
{{- if trim .Memory }}{{- $memory = trim .Memory }}{{- end }}

{{- $kv_cache_dtype := index $recipe "kv_cache_dtype" }}
{{- if ne .KVCacheDtype "recipe-default" }}{{- $kv_cache_dtype = .KVCacheDtype }}{{- end }}

{{- $max_model_len := index $recipe "max_model_len" | int }}
{{- if gt (.MaxModelLen | int) 0 }}{{- $max_model_len = .MaxModelLen | int }}{{- end }}

{{- $max_num_seqs := index $recipe "max_num_seqs" | int }}
{{- if gt (.MaxNumSeqs | int) 0 }}{{- $max_num_seqs = .MaxNumSeqs | int }}{{- end }}

{{- $max_num_batched_tokens := index $recipe "max_num_batched_tokens" | int }}
{{- if gt (.MaxNumBatchedTokens | int) 0 }}{{- $max_num_batched_tokens = .MaxNumBatchedTokens | int }}{{- end }}

{{- $gpu_memory_utilization := index $recipe "gpu_memory_utilization" }}
{{- if trim .GPUMemoryUtilization }}{{- $gpu_memory_utilization = trim .GPUMemoryUtilization }}{{- end }}

{{- $mamba_ssm_cache_dtype := index $recipe "mamba_ssm_cache_dtype" }}
{{- if ne .MambaSsmCacheDtype "recipe-default" }}{{- $mamba_ssm_cache_dtype = .MambaSsmCacheDtype }}{{- end }}

{{- $spec_tokens := index $recipe "spec_tokens" | int }}
{{- if gt (.SpeculativeTokens | int) 0 }}{{- $spec_tokens = .SpeculativeTokens | int }}{{- end }}
{{- $spec_method := index $recipe "spec_method" }}
{{- if not .EnableSpeculativeDecoding }}{{- $spec_method = "" }}{{- end }}

{{- $plugin_repo := index $recipe "reasoning_parser_plugin_repo" }}
{{- $hf_token := trim .HuggingFaceTokenSecret }}
{{- $api_key := trim .ApiKeySecret }}
{{- $served_name := trim .ServedModelName }}

version: v4

volumes:
  data:
    reference: {{ .DataVolume }}

services:
  vllm:
    image:
      uri: {{ $image }}
    persist: true
    mounts:
      {{ $data_mount }}:
        volume: data
    network:
      ports:
        - name: openai-api
          port: {{ $api_port }}
          protocol: tcp
      endpoints:
        - name: openai-api
          port-name: openai-api
          protocol: http
          type: subdomain
          scope: {{ .ServiceScope }}
    resource:
      cpu:
        cores: {{ $cores }}
      memory:
        size: {{ $memory }}
      devices:
        nvidia.com/gpu: {{ $gpus }}
      {{- if $gpu_model }}
      annotations:
        nvidia.com/gpu.model: "{{ $gpu_model }}"
      {{- end }}
    env:
      - HF_HOME={{ trim .HuggingFaceHome }}
      {{- if $hf_token }}
      - HF_TOKEN={{ $hf_token }}
      {{- end }}
      {{- if $api_key }}
      - VLLM_API_KEY={{ $api_key }}
      {{- end }}
      {{- if gt $max_model_len 262144 }}
      {{- /* The HF configs cap max_model_len at 262144; going to 1M needs this. */}}
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      {{- end }}
      {{- range index $recipe "env" }}
      - {{ . }}
      {{- end }}
    script: |
      #!/bin/sh
      set -e
      mkdir -p "$HF_HOME"
      nvidia-smi
      {{- if $plugin_repo }}
      # The nano_v3 reasoning parser ships as a plugin file in the model repo
      # rather than built into vLLM, so fetch it before starting the server.
      python3 -c "import shutil; from huggingface_hub import hf_hub_download; \
        shutil.copyfile(hf_hub_download(repo_id='{{ $plugin_repo }}', filename='{{ $plugin_file }}'), '{{ $plugin_path }}')"
      {{- end }}
      exec vllm serve "{{ index $recipe "repo" }}" \
        --trust-remote-code \
        --tensor-parallel-size {{ $gpus }} \
        --max-model-len {{ $max_model_len }} \
        {{- if $served_name }}
        --served-model-name "{{ $served_name }}" \
        {{- end }}
        {{- if index $recipe "dtype" }}
        --dtype {{ index $recipe "dtype" }} \
        {{- end }}
        {{- if $kv_cache_dtype }}
        --kv-cache-dtype {{ $kv_cache_dtype }} \
        {{- end }}
        {{- if gt $max_num_seqs 0 }}
        --max-num-seqs {{ $max_num_seqs }} \
        {{- end }}
        {{- if gt $max_num_batched_tokens 0 }}
        --max-num-batched-tokens {{ $max_num_batched_tokens }} \
        {{- end }}
        {{- if $gpu_memory_utilization }}
        --gpu-memory-utilization {{ $gpu_memory_utilization }} \
        {{- end }}
        {{- if $mamba_ssm_cache_dtype }}
        --mamba-ssm-cache-dtype {{ $mamba_ssm_cache_dtype }} \
        {{- end }}
        {{- if and $spec_method (eq (index $recipe "spec_style") "dotted") }}
        --speculative_config.method {{ $spec_method }} \
        --speculative_config.num_speculative_tokens {{ $spec_tokens }} \
        {{- else if $spec_method }}
        --speculative-config '{"method": "{{ $spec_method }}", "num_speculative_tokens": {{ $spec_tokens }}}' \
        {{- end }}
        --reasoning-parser {{ index $recipe "reasoning_parser" }} \
        {{- if $plugin_repo }}
        --reasoning-parser-plugin {{ $plugin_path }} \
        {{- end }}
        --enable-auto-tool-choice \
        --tool-call-parser {{ index $recipe "tool_call_parser" }} \
        {{- range index $recipe "extra" }}
        {{ . }} \
        {{- end }}
        {{- if trim .ExtraServeArgs }}
        {{ trim .ExtraServeArgs }} \
        {{- end }}
        --host 0.0.0.0 \
        --port {{ $api_port }}
    readiness-probe:
      http-get:
        path: /health
        port: {{ $api_port }}
        scheme: http
      {{- /* Weights are 35 GB (Nano FP8) to 1.3 TB (Ultra BF16) and are pulled on
             first run, so allow a long window before declaring failure. */}}
      initial-delay-seconds: 120
      period-seconds: 30
      timeout-seconds: 10
      failure-threshold: 240
      success-threshold: 1
