values:
  - name: Volumes
    display_name: |
      Comma separated list of volumes to serve. Give each persistent volume by its
      name, such as `my-data`, or use `ephemeral` for a scratch volume that is
      discarded when the workflow ends. A volume is shown as `<name>` in the file browser
      unless you give it a path, like this: `my-data:/custom/path`. The leading
      slash is optional. The default serves an empty scratch volume as `data`.
    string_value: "ephemeral:data"

  - name: Container
    display_name: CloudCommander container
    string_value: "docker://coderaiser/cloudcmd:19.19.0"
    display_category: Container

  - name: "ServiceScope"
    display_name: |
      Who can access this CloudCommander instance. Defaults to 'user'.
    string_value: user
    options_input:
      options: [user, group, organization]
    display_category: "Access"
