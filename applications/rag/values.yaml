values:
  - name: Endpoint
    display_name: >-
      Base URL of an OpenAI-compatible endpoint serving the embedding model (and the
      generation model, if set) -- e.g. the vllm catalog entry's endpoint URL. Required;
      a trailing /v1 or / is accepted and normalized. At startup each service verifies
      the endpoint actually embeds before serving (a bad credential or wrong dimension
      fails fast; a still-warming pool is retried for up to ~15 min).
    string_value: ""
    display_category: Models
  - name: EmbeddingModel
    display_name: >-
      Embedding model name, exactly as the endpoint serves it. Required, with no working
      default: no catalog entry serves embeddings yet, so set this to a model your Endpoint
      lists. The corpus is permanently bound to this model: changing it against an existing
      corpus fails at startup (rebuild with 'haiku-rag rebuild --set-embedder' to migrate).
    string_value: ""
    display_category: Models
  - name: EmbeddingDim
    display_name: >-
      Vector dimension of the embedding model. Must match the model exactly (the
      default is only a common placeholder); the startup check embeds a probe and
      fails fast, naming the correct value, if the endpoint's vectors are a
      different length.
    uint_value: 768
    display_category: Models
  - name: GenerationModel
    display_name: >-
      Generation model name for the ask_question tool. Optional; when empty,
      ask_question is not usable and retrieval tools are unaffected.
    string_value: ""
    display_category: Models
  - name: EndpointTokenSecret
    display_name: >-
      Fuzzball secret (secret://user/<name>) holding the model endpoint's API key,
      injected at runtime and never stored in the rendered definition. Preferred over
      EndpointToken. Needed only for a 'public' endpoint, a third-party/external API, or
      a cluster that does not sign caller identity; otherwise a Fuzzball endpoint in your
      scope identifies this workflow to the proxy and no key is used (the services mint
      their own endpoint access token at startup).
    secret_value:
      reference: ""
    display_category: Models
  - name: EndpointToken
    display_name: >-
      Model endpoint API key in plain text, stored in the rendered definition (prefer
      EndpointTokenSecret). Same purpose and precedence as EndpointTokenSecret: a key
      that is sent decides the request, and the signed caller identity is used only when
      no key is sent. Needed only for a 'public' endpoint, an external API, or a cluster
      that does not sign caller identity.
    string_value: ""
    display_category: Models

  - name: ReadOnly
    display_name: >-
      When true (default), the MCP surface exposes retrieval only and ingestion runs
      through a separate ingester service (async jobs API + watched inbox directory on
      the volume). When false, no ingester runs and the MCP surface also exposes
      document management tools.
    bool_value: true
    display_category: Access
  - name: Scope
    display_name: >-
      Authorization scope of the mcp (retrieval) endpoint -- the access control on it,
      the same as any Fuzzball endpoint: at non-public scopes a caller in scope reaches
      it with a Fuzzball credential, at 'public' anyone with the URL does, so use public
      only for a non-sensitive corpus. Note the endpoint cannot tell one in-scope caller
      from another, so with ReadOnly=false the document add/delete tools are open to
      everyone in scope. The ingester's job API is not published at any scope (reach it
      in-cluster via port-forward).
    string_value: group
    options_input:
      options: [user, group, organization, public]
    display_category: Access

  - name: Volume
    display_name: >-
      Volume holding the corpus and index: 'ephemeral' (default; evaluation only --
      cancelling the workflow destroys the corpus) or the name of an existing
      persistent volume. Mounted at /data.
    string_value: ephemeral
    display_category: Storage

  - name: ChunkSize
    display_name: >-
      Chunk size (tokens) for document splitting. Corpus-specific: raise for long-form
      context, lower for precise fact retrieval. Changing it affects newly ingested
      documents only.
    uint_value: 256
    display_category: Ingestion

  - name: McpCores
    display_name: CPU cores for the MCP service.
    uint_value: 2
    display_category: Resources
  - name: McpMemory
    display_name: Memory for the MCP service.
    string_value: 4GiB
    display_category: Resources
  - name: IngesterCores
    display_name: CPU cores for the ingester service (document parsing is CPU-heavy).
    uint_value: 4
    display_category: Resources
  - name: IngesterMemory
    display_name: Memory for the ingester service.
    string_value: 8GiB
    display_category: Resources

  - name: Arch
    display_name: >-
      CPU architecture of the compute nodes: amd64 or arm64 (for example DGX Spark).
      Selects Image or ImageArm64.
    string_value: amd64
    options_input:
      options: ["amd64", "arm64"]
    display_category: Versions
  - name: Image
    display_name: >-
      haiku.rag container image for amd64 nodes, built from this entry's
      definition_files/haiku-rag.def by the catalog's container CI; must bundle the full
      package, the ingester extra, and pre-downloaded parsing models for air-gapped
      operation.
    string_value: oras://ghcr.io/ctrliq/ciq-fuzzball-catalog/rag-haiku-rag:0.78.0-0-amd64
    display_category: Versions
  - name: ImageArm64
    display_name: >-
      haiku.rag container image for arm64 nodes, the same build as Image for that
      architecture. Used when Arch is arm64.
    string_value: oras://ghcr.io/ctrliq/ciq-fuzzball-catalog/rag-haiku-rag:0.78.0-0-arm64
    display_category: Versions
  - name: ImageSecret
    display_name: >-
      Fuzzball image secret (secret://user/<name>, type image with username/password
      and trusted-domains) for pulling the haiku.rag image from a private registry.
      Leave empty for public registries.
    secret_value:
      reference: ""
    display_category: Versions
