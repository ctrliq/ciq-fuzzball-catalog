{{- $ver := .AnsysVersion }}
{{- $ansys_version_number := printf "v%s%s" (substr 2 4 $ver) (substr 5 6 $ver) }}
{{- $fluent_version := printf "fluent%s.%s.0" (substr 2 4 $ver) (substr 5 6 $ver) }}
{{- $ansys_root := printf "%s/%s" .AnsysInstallDir $ansys_version_number }}
{{- /* The MPI runtime that LS-DYNA links against is bundled inside the Fluent tree in the image. */}}
{{- $mpi_root := printf "%s/SystemCoupling/runTime/linx64/cnlauncher/fluent/%s/multiport/mpi/lnamd64/%s" $ansys_root $fluent_version .IntelMpiDir }}
{{- $datamount := "/data" }}
version: v4

volumes:
  data:
    reference: {{.Volume}}
    ingress:
      - source:
          uri: https://ftp.lstc.com/anonymous/outgoing/inaki/tutorial/ICFD_example_3dinternalflow.zip
        destination:
          uri: file://ICFD_example_3dinternalflow.zip

defaults:
  job:
    mounts:
      {{ $datamount }}: data

jobs:
  ls-dyna-3d-internal-flow:
    image:
      uri: {{.AnsysLsDynaContainerURI}}
      secret: {{.AnsysLsDynaContainerOciSecret}}
    env:
      - ANSYSLMD_LICENSE_FILE={{.AnsyslmdLicenseFile}}
      - LS_DYNA_PRECISION={{.LsDynaPrecision}}
      - LSTC_LICENSE=ansys
      - LD_LIBRARY_PATH=/.singularity.d/libs:{{$mpi_root}}/lib:{{$mpi_root}}/lib/release:{{$mpi_root}}/opt/mpi/libfabric/lib
      - I_MPI_FABRICS=shm
      - FI_PROVIDER=tcp
    cwd: {{ $datamount }}
    script: |
      #!/bin/sh
      set -e

      # Environment setup
      export PATH={{$ansys_root}}/ansys/bin/linx64:$PATH

      # Data staging
      WORKDIR="{{ $datamount }}/ansys-ls-dyna-3d-internal-flow-$FB_WORKFLOW_ID"
      mkdir -p "$WORKDIR"
      cd "$WORKDIR"
      mv {{ $datamount }}/ICFD_example_3dinternalflow.zip .
      unzip ICFD_example_3dinternalflow.zip

      # Determine binary to be used
      if [ "${LS_DYNA_PRECISION}" = "double" ]; then
        LS_DYNA_EXE="lsdyna_dp_mpp.e"
      elif [ "${LS_DYNA_PRECISION}" = "single" ]; then
        LS_DYNA_EXE="lsdyna_sp_mpp.e"
      else
        echo "No binary for LS-DYNA precision ${LS_DYNA_PRECISION}!"
        exit 1
      fi

      ${LS_DYNA_EXE} i=i.k ncpu={{.LsDynaCores}}
    resource:
      cpu:
        cores: {{.LsDynaCores}}
        affinity: NUMA
      memory:
        size: {{.LsDynaMemory}}
    policy:
      timeout:
        execute: {{.Timeout}}