{{- $volume := trim .Volume }}
{{- if hasPrefix "volume://" (lower $volume) }}
  {{- fail "Volume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" $volume)) (contains ".." $volume) (eq $volume ".") (gt (len $volume) 255) }}
  {{- fail "Volume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
{{- $ver := .AnsysVersion }}
{{- $ansys_version_number := printf "v%s%s" (substr 2 4 $ver) (substr 5 6 $ver) }}
{{- $datamount := "/data" }}
version: v4

volumes:
  data:
    {{- if eq (lower $volume) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $volume }}"
    {{- end }}
    ingress:
      - source:
          uri: https://ftp.lstc.com/anonymous/outgoing/inaki/tutorial/ICFD_example_3dinternalflow.zip
        destination:
          uri: file://ICFD_example_3dinternalflow.zip

defaults:
  job:
    mounts:
      {{ $datamount }}: data

jobs:
  ls-dyna-3d-internal-flow:
    image:
      uri: {{.AnsysLsDynaContainerURI}}
      secret: {{.AnsysLsDynaContainerOciSecret}}
    env:
      - ANSYSLMD_LICENSE_FILE={{.AnsyslmdLicenseFile}}
      - LS_DYNA_PRECISION={{.LsDynaPrecision}}
      - LSTC_LICENSE=ansys
      - LD_LIBRARY_PATH=/.singularity.d/libs:/usr/lib64/mpich/lib
    cwd: {{ $datamount }}
    script: |
      #!/bin/sh
      set -e

      # Environment setup
      export PATH={{.AnsysInstallDir}}/{{$ansys_version_number}}/ansys/bin/linx64:$PATH

      # Data staging
      WORKDIR="{{ $datamount }}/ansys-ls-dyna-3d-internal-flow-$FB_WORKFLOW_ID"
      mkdir -p "$WORKDIR"
      cd "$WORKDIR"
      mv {{ $datamount }}/ICFD_example_3dinternalflow.zip .
      unzip ICFD_example_3dinternalflow.zip

      # Determine binary to be used
      if [ "${LS_DYNA_PRECISION}" = "double" ]; then
        LS_DYNA_EXE="lsdyna_dp_mpp.e"
      elif [ "${LS_DYNA_PRECISION}" = "single" ]; then
        LS_DYNA_EXE="lsdyna_sp_mpp.e"
      else
        echo "No binary for LS-DYNA precision ${LS_DYNA_PRECISION}!"
        exit 1
      fi

      ${LS_DYNA_EXE} i=i.k ncpu={{.LsDynaCores}}
    resource:
      cpu:
        cores: {{.LsDynaCores}}
        affinity: NUMA
      memory:
        size: {{.LsDynaMemory}}
    policy:
      timeout:
        execute: {{.Timeout}}
