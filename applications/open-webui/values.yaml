values:
  - name: "DocumentSource"
    display_name: "Document Source URL (optional)"
    string_value: ""
    display_category: "Basic Configuration"

  - name: "KnowledgeBaseName"
    display_name: "Knowledge Base Name"
    string_value: "Documents"
    display_category: "Basic Configuration"

  - name: "LLMModel"
    display_name: "Language Model"
    string_value: "llama3.1:8b-instruct-q4_K_M"
    display_category: "Basic Configuration"

  - name: "TestPrompt"
    display_name: "Test Prompt (leave empty to skip verification)"
    string_value: "Say Hello, world!"
    display_category: "Basic Configuration"

  - name: "DataVolume"
    display_name: >-
      Optional name of a persistent volume for Ollama models (can be 50-150GB for large models), mounted at /data. Use a
      persistent volume to preserve downloaded models between runs. Leave blank for an ephemeral volume.
    string_value: ""
    display_category: "Storage"

  - name: "OllamaModelsDir"
    display_name: >-
      Absolute path to the directory on the data volume to store models. For a persistent volume this would usually be something like
      /data/<datadir>/.ollama/models.
    string_value: "/data/.ollama/models"
    display_category: "Storage"

  - name: "OpenWebuiVolume"
    display_name: >-
      Optional name of a persistent volume for Open WebUI data (chats, uploads, vector DB). This is the only way to keep
      that data between runs. It must not be NFS-backed: Open WebUI's SQLite databases stall on NFS locking and requests
      time out. Leave blank to keep the data in the container, where it is lost when the workflow ends.
    string_value: ""
    display_category: "Storage"

  - name: "OpenWebuiVolumeProvisioner"
    display_name: >-
      Optional storage provisioner for the Open WebUI data volume. With OpenWebuiVolume, it selects the provisioner holding
      that persistent volume. On its own, it creates a temporary volume on that provisioner (e.g. node-local storage) whose
      data is lost when the workflow ends; set OpenWebuiVolume to keep Open WebUI data.
    string_value: ""
    display_category: "Storage"

  - name: "ServiceScope"
    display_name: |
      Who can access the Open WebUI service endpoint. Defaults to 'user'.
    string_value: user
    options_input:
      options: [user, group, organization]
    display_category: "Access"

  - name: "OllamaVersion"
    display_name: "Ollama Container Version"
    string_value: "0.40.4"
    display_category: "Container Versions"

  - name: "OpenWebUIVersion"
    display_name: "Open WebUI Container Version"
    string_value: "v0.12.2"
    display_category: "Container Versions"
