values:
  - name: "DocumentSource"
    display_name: "Document Source URL (optional)"
    string_value: ""
    display_category: "Basic Configuration"

  - name: "KnowledgeBaseName"
    display_name: "Knowledge Base Name"
    string_value: "Documents"
    display_category: "Basic Configuration"

  - name: "LLMModel"
    display_name: "Language Model"
    string_value: "llama3.1:8b-instruct-q4_K_M"
    display_category: "Basic Configuration"

  - name: "TestPrompt"
    display_name: "Test Prompt (leave empty to skip verification)"
    string_value: "Say Hello, world!"
    display_category: ""

  - name: "DataVolume"
    display_name: >-
      Storage for Ollama models (can be 50-150GB for large models) and Open WebUI data (vector DB, documents, configs). Mounted
      at /data. Use a persistent volume to preserve downloaded models between runs.
    string_value: "volume://group/persistent/data"
    display_category: "Storage"

  - name: "OllamaModelsDir"
    display_name: >-
      Absolute path to the directory on the data volume to store models. For a persistent volume this would usually be something like
      /data/<datadir>/.ollama/models.
    string_value: "/data/.ollama/models"
    display_category: "Storage"

  - name: "OpenWebuiDir"
    display_name: >-
      Absolute path to the directory on the data volume to OpenWebUI data. For a persistent volume this would usually be something like
      /data/<datadir>/openwebui.
    string_value: "/data/open_webui"
    display_category: "Storage"

  - name: "ServiceScope"
    display_name: |
      Who can access the Open WebUI service endpoint. Defaults to 'user'.
    string_value: user
    options_input:
      options: [user, group, organization]
    display_category: "Access"

  - name: "OllamaVersion"
    display_name: "Ollama Container Version"
    string_value: "0.24.0"
    display_category: "Container Versions"

  - name: "OpenWebUIVersion"
    display_name: "Open WebUI Container Version"
    string_value: "v0.9.5"
    display_category: "Container Versions"
