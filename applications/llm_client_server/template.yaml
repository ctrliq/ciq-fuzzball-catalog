{{- $vllm_api_key := (randInt 0 10000000 | printf "%8d" | b64enc ) }}
{{- $vllm_api_port := randInt 10000 24000 }}
{{- $ui_port := randInt 24001 32000 }}

{{- $data_mount := "/data" }}
{{- /* Each image reference needs an explicit tag or digest, and a tag
       cannot be empty: a reference ending in ':' renders a uri YAML reads as a
       mapping. Fuzzball parses references with go-containerregistry, which
       wants a lowercase repository path of 2 to 255 characters after any
       registry host, and a tag of at most 128. A first path segment names a registry host only when
       it holds a dot or a port or is localhost; otherwise the image is on
       Docker Hub. */}}
{{- $vllmImage := trim .VllmImage }}
{{- $uiImage := trim .UIImage }}
{{- range $img := list (list "VllmImage" $vllmImage "docker://registry:5000/vllm/vllm-openai:v0.13.0") (list "UIImage" $uiImage "docker://registry:5000/yoziru/nextjs-vllm-ui:latest") }}
  {{- $name := index $img 0 }}
  {{- $ref := index $img 1 }}
  {{- $example := index $img 2 }}
  {{- if not (regexMatch "^(docker|oras)://((\\[[0-9A-Fa-f:]+\\]|[A-Za-z0-9._-]+)(:[0-9]+)?/)?[a-z0-9._-]*(/[a-z0-9._-]*)*(:[A-Za-z0-9._-]{1,128}|@sha256:[a-f0-9]{64})$" $ref) }}
    {{- fail (printf "%s needs an explicit tag or digest and a lowercase repository path, and may name a ported registry, e.g. %s" $name $example) }}
  {{- end }}
  {{- $path := regexReplaceAll "^[a-z]+://" $ref "" }}
  {{- $first := regexReplaceAll "/.*$" $path "" }}
  {{- $repository := regexReplaceAll "(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$" $path "" }}
  {{- if contains "/" $path }}
    {{- if or (contains "." $first) (contains ":" $first) (eq $first "localhost") }}
      {{- $repository = regexReplaceAll "^[^/]*/" $repository "" }}
    {{- else if not (regexMatch "^[a-z0-9._-]*$" $first) }}
      {{- fail (printf "%s needs a lowercase repository path, e.g. %s" $name $example) }}
    {{- end }}
  {{- end }}
  {{- if or (lt (len $repository) 2) (gt (len $repository) 255) }}
    {{- fail (printf "%s needs a repository name of 2 to 255 characters, e.g. %s" $name $example) }}
  {{- end }}
{{- end }}
{{- $imageSecret := trim .ImageSecret }}
{{- if and $imageSecret (not (regexMatch "^secret://(user|group|account|organization|cluster)/[A-Za-z0-9._-]+$" $imageSecret)) }}
  {{- fail "ImageSecret must be a secret reference, e.g. secret://organization/registry-mirror" }}
{{- end }}
{{- /* Fuzzball checks an image secret's trusted domains against the host of
       one image's URI, exactly as written with any port removed, yet sends
       its credentials with every pull that uses the secret. So with a secret
       set, every image it goes with must name its registry host, and all of
       them the same one. */}}
{{- if $imageSecret }}
  {{- $pulled := list (list "VllmImage" $vllmImage) (list "UIImage" $uiImage) }}
  {{- $hosts := list }}
  {{- range $img := $pulled }}
    {{- $path := regexReplaceAll "^[a-z]+://" (index $img 1) "" }}
    {{- $first := regexReplaceAll "/.*$" $path "" }}
    {{- if not (and (contains "/" $path) (or (contains "." $first) (contains ":" $first) (eq $first "localhost"))) }}
      {{- fail (printf "ImageSecret is set, so %s must name its registry host, e.g. docker://docker.io/<namespace>/<name>:<tag> for Docker Hub, where official images use the namespace library (got %s)" (index $img 0) (index $img 1)) }}
    {{- end }}
    {{- $hosts = append $hosts (regexReplaceAll ":[0-9]+$" $first "") }}
  {{- end }}
  {{- if gt (len (uniq $hosts)) 1 }}
    {{- fail (printf "ImageSecret is sent with both VllmImage and UIImage, so they must name one registry host (got %s); the host is compared exactly as written, so docker.io and index.docker.io differ" (join ", " (uniq $hosts))) }}
  {{- end }}
{{- end }}

{{- if and (trim .HuggingfaceCache) (not (or (eq (trim .HuggingfaceCache) $data_mount) (hasPrefix (printf "%s/" $data_mount) (trim .HuggingfaceCache)))) }}
  {{- fail (printf "HuggingfaceCache must be an absolute path under the mounted volume %s so the cache persists" $data_mount) }}
{{- end }}

version: v4
volumes:
  data:
    reference: {{ .ModelVolume }}

services:
  vllm:
    network:
      host: true
      ports:
        - name: openai-api
          port: {{ $vllm_api_port }}
          protocol: tcp
    image:
      uri: {{ $vllmImage }}
      {{- if $imageSecret }}
      secret: {{ $imageSecret }}
      {{- end }}
    mounts:
      {{ $data_mount }}:
        volume: data
    resource:
      cpu:
        cores: {{ .ServerCores }}
      memory:
        size: {{ .ServerMemory }}
      devices:
        nvidia.com/gpu: 1
      annotations:
        nvidia.com/gpu.model: "{{ .ServerGPUModel }}"
    script: |
      #!/bin/sh
      HF_HUB_CACHE="{{ .HuggingfaceCache }}"
      export HF_HUB_CACHE
      mkdir -p "$HF_HUB_CACHE" || exit 1
      vllm serve --port={{ $vllm_api_port }} --api-key="{{ $vllm_api_key }}" --max-model-len {{ .MaxContextSize }} "{{ .ModelName }}"
    readiness-probe:
      http-get:
        path: /v1/models
        port: {{ $vllm_api_port }}
        scheme: http
        http-headers:
          - name: Authorization
            value: "{{ printf "Bearer %s" $vllm_api_key }}"
      initial-delay-seconds: 60
      period-seconds: 30
      failure-threshold: 10
      success-threshold: 1

  chat-interface:
    depends-on:
      - name: vllm
        status: running
    persist: true
    network:
      ports:
        - name: web-port
          port: {{ $ui_port }}
          protocol: tcp
      endpoints:
        - name: web
          type: subdomain
          port-name: web-port
          protocol: http
          scope: {{ .ServiceScope }}
    image:
      uri: {{ $uiImage }}
      {{- if $imageSecret }}
      secret: {{ $imageSecret }}
      {{- end }}
    resource:
      cpu:
        cores: 2
      memory:
        size: 4GiB
    script: |
      #!/bin/sh
      VLLM_URL="http://vllm.svc:{{ $vllm_api_port }}"
      VLLM_API_KEY="{{ $vllm_api_key }}"
      VLLM_TOKEN_LIMIT={{ .MaxContextSize }}
      PORT={{ $ui_port }}
      HOSTNAME="0.0.0.0"
      export VLLM_URL VLLM_API_KEY VLLM_TOKEN_LIMIT PORT HOSTNAME
      cd /opt/app
      node server.js
