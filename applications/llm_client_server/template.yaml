{{- $vllm_api_key := (randInt 0 10000000 | printf "%8d" | b64enc ) }}
{{- $vllm_api_port := randInt 10000 24000 }}
{{- $ui_port := randInt 24001 32000 }}

{{- $data_mount := "/data" }}
{{- /* A tag or digest is required, and a tag cannot be empty: a reference
       ending in ':' renders a uri YAML reads as a mapping. */}}
{{- $vllmImage := trim .VllmImage }}
{{- if not (regexMatch "^(docker|oras)://[A-Za-z0-9._-]+(:[0-9]+)?(/[A-Za-z0-9._-]+)*(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$" $vllmImage) }}
  {{- fail "VllmImage needs an explicit tag or digest, and may name a ported registry, e.g. docker://registry:5000/vllm/vllm-openai:v0.13.0" }}
{{- end }}
{{- $uiImage := trim .UIImage }}
{{- if not (regexMatch "^(docker|oras)://[A-Za-z0-9._-]+(:[0-9]+)?(/[A-Za-z0-9._-]+)*(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$" $uiImage) }}
  {{- fail "UIImage needs an explicit tag or digest, and may name a ported registry, e.g. docker://registry:5000/yoziru/nextjs-vllm-ui:latest" }}
{{- end }}
{{- $imageSecret := trim .ImageSecret }}
{{- if and $imageSecret (not (regexMatch "^secret://(user|group|account|organization|cluster)/[A-Za-z0-9._-]+$" $imageSecret)) }}
  {{- fail "ImageSecret must be a secret reference, e.g. secret://organization/registry-mirror" }}
{{- end }}
{{- /* Fuzzball checks an image secret's trusted domains only on the first
       image that uses it, yet sends its credentials with every pull. One
       registry for both images makes that one check cover them. A first path
       segment names a registry only when it holds a dot or a port or is
       localhost; otherwise the image is on Docker Hub. */}}
{{- if $imageSecret }}
  {{- $registries := list }}
  {{- range $ref := list $vllmImage $uiImage }}
    {{- $path := regexReplaceAll "^[a-z]+://" $ref "" }}
    {{- $first := regexReplaceAll "/.*$" $path "" }}
    {{- $registry := "docker.io" }}
    {{- if and (contains "/" $path) (or (contains "." $first) (contains ":" $first) (eq $first "localhost")) }}
      {{- $registry = $first }}
    {{- end }}
    {{- $registries = append $registries $registry }}
  {{- end }}
  {{- if gt (len (uniq $registries)) 1 }}
    {{- fail (printf "ImageSecret is sent with both VllmImage and UIImage, so they must come from one registry (got %s)" (join ", " (uniq $registries))) }}
  {{- end }}
{{- end }}

{{- if and (trim .HuggingfaceCache) (not (or (eq (trim .HuggingfaceCache) $data_mount) (hasPrefix (printf "%s/" $data_mount) (trim .HuggingfaceCache)))) }}
  {{- fail (printf "HuggingfaceCache must be an absolute path under the mounted volume %s so the cache persists" $data_mount) }}
{{- end }}

version: v4
volumes:
  data:
    reference: {{ .ModelVolume }}

services:
  vllm:
    network:
      host: true
      ports:
        - name: openai-api
          port: {{ $vllm_api_port }}
          protocol: tcp
    image:
      uri: {{ $vllmImage }}
      {{- if $imageSecret }}
      secret: {{ $imageSecret }}
      {{- end }}
    mounts:
      {{ $data_mount }}:
        volume: data
    resource:
      cpu:
        cores: {{ .ServerCores }}
      memory:
        size: {{ .ServerMemory }}
      devices:
        nvidia.com/gpu: 1
      annotations:
        nvidia.com/gpu.model: "{{ .ServerGPUModel }}"
    script: |
      #!/bin/sh
      HF_HUB_CACHE="{{ .HuggingfaceCache }}"
      export HF_HUB_CACHE
      mkdir -p "$HF_HUB_CACHE" || exit 1
      vllm serve --port={{ $vllm_api_port }} --api-key="{{ $vllm_api_key }}" --max-model-len {{ .MaxContextSize }} "{{ .ModelName }}"
    readiness-probe:
      http-get:
        path: /v1/models
        port: {{ $vllm_api_port }}
        scheme: http
        http-headers:
          - name: Authorization
            value: "{{ printf "Bearer %s" $vllm_api_key }}"
      initial-delay-seconds: 60
      period-seconds: 30
      failure-threshold: 10
      success-threshold: 1

  chat-interface:
    depends-on:
      - name: vllm
        status: running
    persist: true
    network:
      ports:
        - name: web-port
          port: {{ $ui_port }}
          protocol: tcp
      endpoints:
        - name: web
          type: subdomain
          port-name: web-port
          protocol: http
          scope: {{ .ServiceScope }}
    image:
      uri: {{ $uiImage }}
      {{- if $imageSecret }}
      secret: {{ $imageSecret }}
      {{- end }}
    resource:
      cpu:
        cores: 2
      memory:
        size: 4GiB
    script: |
      #!/bin/sh
      VLLM_URL="http://vllm.svc:{{ $vllm_api_port }}"
      VLLM_API_KEY="{{ $vllm_api_key }}"
      VLLM_TOKEN_LIMIT={{ .MaxContextSize }}
      PORT={{ $ui_port }}
      HOSTNAME="0.0.0.0"
      export VLLM_URL VLLM_API_KEY VLLM_TOKEN_LIMIT PORT HOSTNAME
      cd /opt/app
      node server.js
