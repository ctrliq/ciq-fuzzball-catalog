{{- $scratchmount := "/scratch" }}
{{- $datamount := "/data" }}
{{- if not (trim .ScratchVolume) }}
  {{- fail "ScratchVolume is required" }}
{{- end }}

{{- $s3 := false }}
{{- if (hasPrefix "s3://" (trim .ResultPath)) }}
  {{- $s3 = true }}
{{- end }}

{{- $container := list .OpenFoamContainerUri .OpenFoamVersion | join ":" }}
{{- $wmdir := list .WmProjectDir .OpenFoamVersion | join "" }}
{{- $rc := list $wmdir "etc/bashrc" | join "/" }}
{{- $ts := now | unixEpoch }}
{{- $name := list (trim .ResultName) $ts | join "-" }}

version: v4
volumes:
  scratch:
    reference: {{ .ScratchVolume }}
{{- if $s3 }}
    egress:
      - source:
          uri: file://{{ $name }}.tar.gz
        destination:
          uri: {{ trim .ResultPath }}/{{ $name }}.tar.gz
          secret: {{- if .S3Secret }} {{ .S3Secret }}{{- else }}{{ fail "Please provide S3Secret to save results to S3"}}{{- end }}
{{- end }}
{{- if .DataVolume }}
  data:
    reference: {{ .DataVolume }}
{{- end }}

defaults:
  job:
    mounts:
      {{ $scratchmount }}:
        volume: scratch

jobs:
  preprocess-model:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      cp -r {{$wmdir}}/tutorials/incompressible/simpleFoam/motorBike {{ $name }};
      cp {{ $name }}/system/decomposeParDict.6 {{ $name }}/system/decomposeParDict;

      cd {{ $name }}

      SUBDOMAINS=$(( {{.SimulationOrMeshJobCores}} * {{.SimulationOrMeshJobNodes}} ))
      sed -i "s/numberOfSubdomains\ 6/numberOfSubdomains\ ${SUBDOMAINS}/g" system/decomposeParDict;
      sed -i 's/\(3 2 1\)/{{.Coefficients}}/g' system/decomposeParDict;
      cat system/decomposeParDict;

      source {{$rc}};
      mkdir -p constant/triSurface;
      cp -f $FOAM_TUTORIALS/resources/geometry/motorBike.obj.gz constant/triSurface/;
      surfaceFeatureExtract;
      blockMesh;
      decomposePar;
    resource:
      cpu:
        cores: {{.UtilityJobCores}}
        affinity: NUMA
      memory:
        size: {{.UtilityJobMemory}}
    cwd: {{ $scratchmount }}

  snappy-hex-mesh:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      snappyHexMesh -overwrite -parallel
    multinode:
      nodes: {{.SimulationOrMeshJobNodes}}
      implementation: openmpi
    resource:
      cpu:
        cores: {{.SimulationOrMeshJobCores}}
        affinity: NUMA
      memory:
        size: {{.SimulationOrMeshJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: preprocess-model
        status: FINISHED

  toposet:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      topoSet -parallel
    multinode:
      nodes: {{.SimulationOrMeshJobNodes}}
      implementation: openmpi
    resource:
      cpu:
        cores: {{.SimulationOrMeshJobCores}}
        affinity: NUMA
      memory:
        size: {{.SimulationOrMeshJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: snappy-hex-mesh
        status: FINISHED

  set-initial-conditions:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      source {{$wmdir}}/bin/tools/RunFunctions
      restore0Dir -processor
    resource:
      cpu:
        cores: {{.UtilityJobCores}}
        affinity: NUMA
      memory:
        size: {{.UtilityJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: toposet
        status: FINISHED

  patch-summary:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      patchSummary -parallel
    multinode:
      nodes: {{.SimulationOrMeshJobNodes}}
      implementation: openmpi
    resource:
      cpu:
        cores: {{.SimulationOrMeshJobCores}}
        affinity: NUMA
      memory:
        size: {{.SimulationOrMeshJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: set-initial-conditions
        status: FINISHED

  potential-foam:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      potentialFoam -writephi -parallel
    multinode:
      nodes: {{.SimulationOrMeshJobNodes}}
      implementation: openmpi
    resource:
      cpu:
        cores: {{.SimulationOrMeshJobCores}}
        affinity: NUMA
      memory:
        size: {{.SimulationOrMeshJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: patch-summary
        status: FINISHED

  check-mesh:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      checkMesh -parallel -writeFields '(nonOrthoAngle)' -constant
    multinode:
      nodes: {{.SimulationOrMeshJobNodes}}
      implementation: openmpi
    resource:
      cpu:
        cores: {{.SimulationOrMeshJobCores}}
        affinity: NUMA
      memory:
        size: {{.SimulationOrMeshJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: potential-foam
        status: FINISHED

  simple-foam:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      simpleFoam -parallel
    multinode:
      nodes: {{.SimulationOrMeshJobNodes}}
      implementation: openmpi
    resource:
      cpu:
        cores: {{.SimulationOrMeshJobCores}}
        affinity: NUMA
      memory:
        size: {{.SimulationOrMeshJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: check-mesh
        status: FINISHED

  reconstruct-mesh:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      reconstructParMesh -constant
      reconstructPar -latestTime
    resource:
      cpu:
        cores: {{.UtilityJobCores}}
        affinity: NUMA
      memory:
        size: {{.UtilityJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: simple-foam
        status: FINISHED

  to-vtk:
    image:
      uri: {{ $container }}
    script: |
      #!/bin/bash
      source {{$rc}}
      foamToVTK -parallel
    multinode:
      nodes: {{.SimulationOrMeshJobNodes}}
      implementation: openmpi
    resource:
      cpu:
        cores: {{.SimulationOrMeshJobCores}}
        affinity: NUMA
      memory:
        size: {{.SimulationOrMeshJobMemory}}
    cwd: {{ $scratchmount }}/{{ $name }}
    depends-on:
      - name: reconstruct-mesh
        status: FINISHED

  tar-results:
    image:
      uri: docker://alpine:latest
    script: |
      #!/bin/sh
      echo "${FB_WORKFLOW_ID}" > {{ $name }}/FB_WORKFLOW_ID
      if {{ $s3 }} ; then
        tar -zcvf {{ $name }}.tar.gz {{ $name }}
      elif [ -n "{{ trim .DataVolume }}" ] ; then
        mkdir -p {{ trim .ResultPath }}
        cp -r {{ $name }} {{ trim .ResultPath }}
      fi
    resource:
      cpu:
        cores: {{.UtilityJobCores}}
        affinity: NUMA
      memory:
        size: {{.UtilityJobMemory}}
    cwd: {{ $scratchmount }}
    mounts:
      {{ $scratchmount }}:
        volume:
          scratch
{{- if .DataVolume }}
      {{ $datamount }}:
        volume: data
{{- end }}
    depends-on:
      - name: to-vtk
        status: FINISHED
