{{- $root := "/fuzzball" }}
{{- $port := (randInt 10000 30000) }}

{{- /* Each Volumes entry is <name>[:/path]: the name of a persistent volume, or
       the word ephemeral (in any case) for a scratch volume that ends with the
       workflow. It is served at <root>/<path>, or <root>/<name> without
       one. */}}
{{- $volumes := list }}
{{- $paths := dict }}
{{- $names := dict }}
{{- range $raw := splitList "," .Volumes }}
  {{- $volume := trim $raw }}
  {{- if hasPrefix "volume://" (lower $volume) }}
    {{- fail (printf "Volumes entry %q uses the old volume:// form; give the volume's name instead, e.g. my-data or my-data:/custom/path (or ephemeral for a scratch volume)" $volume) }}
  {{- end }}
  {{- if ne $volume "" }}
    {{- $parts := splitList ":" $volume }}
    {{- if gt (len $parts) 2 }}
      {{- fail (printf "Volumes entry %q must be <name> or <name>:/path" $volume) }}
    {{- end }}
    {{- $name := trim (index $parts 0) }}
    {{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" $name)) (contains ".." $name) (eq $name ".") (gt (len $name) 255) }}
      {{- fail (printf "Volumes entry %q must start with a volume name (up to 255 letters, digits, '.', '_' or '-', and not '.' or containing '..') or ephemeral" $volume) }}
    {{- end }}
    {{- $path := $name }}
    {{- if eq (len $parts) 2 }}
      {{- $path = trim (index $parts 1) | trimPrefix "/" | trimSuffix "/" }}
      {{- if not (regexMatch "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$" $path) }}
        {{- fail (printf "Volumes entry %q needs a path of letters, digits, '.', '_' or '-' segments after the colon, e.g. my-data:/projects" $volume) }}
      {{- end }}
      {{- range $segment := splitList "/" $path }}
        {{- if or (eq $segment ".") (eq $segment "..") }}
          {{- fail (printf "Volumes entry %q must not use '.' or '..' in its path" $volume) }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if hasKey $paths $path }}
      {{- fail (printf "Volumes entries %q and %q are both served at /%s" (get $paths $path) $volume $path) }}
    {{- end }}
    {{- range $other, $otherEntry := $paths }}
      {{- if or (hasPrefix (printf "%s/" $other) $path) (hasPrefix (printf "%s/" $path) $other) }}
        {{- fail (printf "Volumes entries %q and %q are served at nested paths /%s and /%s" $otherEntry $volume $other $path) }}
      {{- end }}
    {{- end }}
    {{- if ne (lower $name) "ephemeral" }}
      {{- if hasKey $names $name }}
        {{- fail (printf "Volumes entries %q and %q both serve the volume %q; list it once" (get $names $name) $volume $name) }}
      {{- end }}
      {{- $_ := set $names $name $volume }}
    {{- end }}
    {{- $_ := set $paths $path $volume }}
    {{- $volumes = append $volumes (dict "name" $name "path" $path) }}
  {{- end }}
{{- end }}
{{- if eq (len $volumes) 0 }}
  {{-  fail "At least one volume has to be specified in the Volumes field." }}
{{- end }}

version: v4
volumes:
{{- range $i, $v := $volumes }}
  vol-{{ $i }}:
  {{- if eq (lower $v.name) "ephemeral" }}
    use: ephemeral
  {{- else }}
    name: "{{ $v.name }}"
  {{- end }}
{{- end }}

services:
  filebrowser:
    image:
      uri: {{ .Container }}
    resource:
      cpu:
        cores: 1
      memory:
        size: 1GiB
    persist: true
    network:
      ports:
        - name: web
          port: {{ $port }}
          protocol: tcp
      endpoints:
        - name: filebrowser
          port-name: web
          type: subdomain
          protocol: http
          scope: user
    mounts:
{{- range $i, $v := $volumes }}
      {{ $root }}/{{ $v.path }}:
        volume: vol-{{ $i }}
{{- end }}
    script: |
      #!/bin/sh
      # the go net library resolves 0.0.0.0 to ipv6 which won't work. getting the v4 ip address of the container
      BIND_ADDR=$(ip -4 route get 1.0.0.1 | awk '{for(i=1;i<NF;i++) if($i=="src") {print $(i+1); exit}}')
      DB="$(mktemp)"

      /bin/filebrowser config init \
        --auth.method=proxy \
        --auth.header=X-Fuzzball-Account-ID \
        --database "${DB}" \
        --address ${BIND_ADDR} \
        --port {{ $port }} \
        --root {{ $root }} \
        --branding.disableUsedPercentage
      /bin/filebrowser users add --database "${DB}" --lockPassword "${FB_ACCOUNT_ID}" {{ randInt 1 1000000000000 | toString | b64enc }}

      /bin/filebrowser --database "${DB}"
