{{- $root := "/fuzzball" }}
{{- $port := (randInt 10000 30000) }}

{{- if not (trim .Volumes | hasPrefix "volume://") }}
  {{-  fail "At least one volume has to be specified in the Volumes field." }}
{{- end }}
{{- $volumes := splitList "," .Volumes }}

version: v1
volumes:
{{- range $i, $v := $volumes }}
  vol-{{ $i }}:
  {{- $parts := (splitList ":" $v) }}
  {{- if eq (len $parts) 2 }}
    reference: {{ $v }}
  {{- else if eq (len $parts) 3 }}
    reference: {{ index $parts 0 }}:{{ index $parts 1 }}
  {{- else }}
    {{- fail (printf "Invalid volume reference: %s" $v) }}
  {{- end }}
{{- end }}

services:
  filebrowser:
    image:
      uri: {{ .Container }}
    resource:
      cpu:
        cores: 1
      memory:
        size: 1GiB
    persist: true
    network:
      ports:
        - name: web
          port: {{ $port }}
          protocol: tcp
      endpoints:
        - name: filebrowser
          port-name: web
          type: subdomain
          protocol: http
          scope: {{ .ServiceScope }}
    mounts:
{{- range $i, $v := $volumes }}
  {{- $parts := splitList ":" $v }}
  {{- if eq (len $parts) 2 }}
      vol-{{ $i }}:
        location: {{ $root }}/{{ trimPrefix "volume://" $v }}
  {{- else }}
      vol-{{ $i }}:
        location: {{ $root }}/{{ index $parts 2 | trimPrefix "/" }}
  {{- end }}
{{- end }}
    script: |
      #!/bin/sh
      # the go net library resolves 0.0.0.0 to ipv6 which won't work. getting the v4 ip address of the container
      BIND_ADDR=$(ip -4 route get 1.0.0.1 | awk '{for(i=1;i<NF;i++) if($i=="src") {print $(i+1); exit}}')
      DB="$(mktemp)"

      /bin/filebrowser config init \
        --auth.method=noauth \
        --database "${DB}" \
        --branding.color "#12A66F" \
        --address ${BIND_ADDR} \
        --port {{ $port }} \
        --root {{ $root }} \
        --branding.disableUsedPercentage

      /bin/filebrowser --database "${DB}"
