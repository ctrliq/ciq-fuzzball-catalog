values:
  - name: Model
    display_name: >-
      HuggingFace model to serve, as an hf:// URI. Query parameters are passed
      through to the download, so a revision can be pinned (?revision=<rev>)
      and files the server does not read can be skipped
      (?exclude=original/** — repositories that ship extra checkpoints can be
      several times larger than the weights alone).
    string_value: hf://openai/gpt-oss-20b
    display_category: Model
  - name: Gpu
    display_name: "GPU platform: nvidia or amd."
    string_value: nvidia
    options_input:
      options: ["nvidia", "amd"]
    display_category: Model
  - name: HfTokenSecret
    display_name: >-
      Fuzzball secret holding a HuggingFace token (secret://user/<name>), used only
      during model download. Required only for gated or private models.
    secret_value:
      reference: ""
    display_category: Model

  - name: Proxy
    display_name: Front the replica pool with an in-workflow LiteLLM proxy holding the endpoint.
    bool_value: true
    display_category: Access
  - name: Scope
    display_name: "Authorization scope of the service endpoint: user, group, organization, or public."
    string_value: group
    options_input:
      options: ["user", "group", "organization", "public"]
    display_category: Access
  - name: ApiKey
    display_name: >-
      OpenAI API key enforced by the LiteLLM proxy (master key). Must start with sk-.
      Auto-generated when left empty; set an explicit strong key for public endpoints.
      Unused when proxy is disabled; access is then governed by the endpoint scope.
    string_value: ""
    display_category: Access

  - name: MinReplicas
    display_name: Minimum number of vLLM replicas. 0 enables scale-to-zero.
    uint_value: 1
    display_category: Scaling
  - name: MaxReplicas
    display_name: Maximum number of vLLM replicas.
    uint_value: 4
    display_category: Scaling
  - name: ScaleUpRequestsPerMinute
    display_name: >-
      Request rate through the LiteLLM proxy (requests observed within a minute, at or
      above this count) that adds a replica. Must be at least 1. Only used when proxy is
      enabled.
    uint_value: 30
    display_category: Scaling
  - name: ScaleUpCooldown
    display_name: >-
      Minimum seconds between scale-up actions. Replicas released while earlier ones are
      still cold-starting count toward the pool, so during a long model load a low value
      can provision more replicas than the eventual load needs; raise this toward your
      model's cold-start time to limit overshoot. Only used when proxy is enabled.
    uint_value: 120
    display_category: Scaling
  - name: DrainPeriod
    display_name: >-
      Seconds a retiring replica keeps running after leaving rotation, so streaming
      generations in flight can complete (maximum 600).
    uint_value: 300
    display_category: Scaling

  - name: Volume
    display_name: >-
      Volume holding the downloaded model: 'ephemeral' (default), or the name of an
      existing persistent volume to keep the model across workflow restarts.
      Mounted at /data. The download directory is keyed on the repository and,
      when Model pins one with ?revision=, the revision — so several models and
      revisions can share one persistent volume without overwriting each other.
    string_value: ephemeral
    display_category: Storage
  - name: IngressTimeout
    display_name: Timeout for the model download at workflow start.
    string_value: 2h
    display_category: Storage

  - name: MaxContextSize
    display_name: Maximum context size. This will impact GPU memory usage.
    uint_value: 131072
    display_category: Model Configuration
  - name: GpuMemoryUtilization
    display_name: >-
      The fraction of GPU memory to be used for the model. vLLM requires this
      fraction of total VRAM to be free at start, so on small or shared vGPU
      slices, where driver overhead is a large fraction of VRAM, 0.9 can be
      unsatisfiable — lower it (e.g. 0.8) if vLLM aborts with "Free memory on
      device ... is less than desired GPU memory utilization".
    string_value: "0.9"
    display_category: Model Configuration
  - name: Nodes
    display_name: >-
      Nodes per replica. 1 (default) serves each replica on one node. Above 1, each
      replica is a gang-scheduled group of that many nodes serving a single
      OpenAI-compatible endpoint on rank 0, with attention data-parallel and experts
      expert-parallel across the group's GPUs. Use it for a mixture-of-experts model
      too large for one node; a group starts all nodes or none, and the pool scales in
      whole groups. Requires a mixture-of-experts model and GPUs on every node.
    uint_value: 1
    display_category: Resources
  - name: ExtraEnv
    display_name: >-
      Extra environment variables for the vLLM process, as space-separated
      NAME=VALUE pairs, applied to every rank of a replica. Intended for settings
      that have no command-line equivalent -- above all collective-library tuning
      (NCCL_* on nvidia, which RCCL also reads on amd) that a particular cluster's
      interconnect needs. Example: "NCCL_SOCKET_IFNAME=eth0 NCCL_DEBUG=WARN".
    string_value: ""
    display_category: Model Configuration
  - name: ExpertParallelism
    display_name: >-
      Expert parallelism across the replica's GPUs: auto (enabled when the downloaded
      model's config.json indicates a mixture-of-experts model and the replica's
      data-parallel world is at least 2), true (require both; the service fails at
      start otherwise), or false (tensor parallelism only). When enabled, the replica
      serves attention data-parallel and experts expert-parallel across every GPU of
      every node in the replica. That world is Nodes x GpusPerNode, so two
      single-GPU nodes qualify just as one two-GPU node does; below 2 there is nothing
      to shard experts across.
    string_value: auto
    options_input:
      options: ["auto", "true", "false"]
    display_category: Model Configuration
  - name: ExtraArgs
    display_name: >-
      Additional command-line arguments appended to vllm serve, for tuning knobs the
      entry does not expose (e.g. --enforce-eager --max-num-batched-tokens 512).
    string_value: ""
    display_category: Model Configuration

  - name: GpusPerNode
    display_name: >-
      Number of GPU devices on each of the replica's nodes (the tensor-parallel
      size, or the per-node share of the data-parallel size when expert parallelism
      is enabled). A replica's total is this times Nodes. 0 requests no GPU; note
      the default images are GPU builds, so 0 also requires overriding VllmImage
      with a CPU-build image (testing only).
    uint_value: 1
    display_category: Resources
  - name: GpuModel
    display_name: GPU model to request (e.g. NVIDIA L40S). Empty requests any GPU of the selected platform.
    string_value: ""
    display_category: Resources
  - name: CoresPerNode
    display_name: >-
      CPU cores on each of the replica's nodes. A replica of Nodes nodes consumes
      this on every one of them.
    uint_value: 8
    display_category: Resources
  - name: MemoryPerNode
    display_name: >-
      Memory on each of the replica's nodes. A replica of Nodes nodes consumes this
      on every one of them.
    string_value: 32GiB
    display_category: Resources

  - name: VllmImage
    display_name: vLLM container image used on the nvidia platform.
    string_value: docker://vllm/vllm-openai:v0.28.0
    display_category: Versions
  - name: VllmRocmImage
    display_name: >-
      vLLM container image used on the amd platform. Pick a build matching the GPU family
      (this default is an RDNA build; MI-series CDNA GPUs need a CDNA build).
    string_value: docker://rocm/vllm:rocm7.14.0_rdna_ubuntu24.04_py3.14_pytorch_2.11.0_vllm_0.23.0
    display_category: Versions
  - name: LitellmImage
    display_name: LiteLLM container image used when proxy is enabled.
    string_value: docker://ghcr.io/berriai/litellm:v1.97.0
    display_category: Versions
