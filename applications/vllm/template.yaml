{{- $model := trim .Model }}
{{- if not (hasPrefix "hf://" $model) }}
  {{- fail "Model must be an hf:// URI, e.g. hf://openai/gpt-oss-20b" }}
{{- end }}
{{- /* The URI may carry query parameters (a revision, or include/exclude
       filters that keep the download to the files the server actually reads).
       They belong in the ingress source, but not in the served model name. */}}
{{- $model_ref := trim (trimPrefix "hf://" $model) }}
{{- $model_name := trim (index (splitList "?" $model_ref) 0) }}
{{- /* A pinned revision decides which weights the download produces, so it has
       to key the directory as well: without it two revisions of one repository
       would share a directory on a persistent volume. Filters only decide which
       files of that revision are fetched, so they are deliberately not part of
       the key — narrowing a filter should not orphan an existing download. */}}
{{- $revision := "" }}
{{- if gt (len (splitList "?" $model_ref)) 1 }}
  {{- range (splitList "&" (index (splitList "?" $model_ref) 1)) }}
    {{- if hasPrefix "revision=" . }}
      {{- $revision = trimPrefix "revision=" . }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if not $model_name }}
  {{- fail "Model must name a repository, e.g. hf://openai/gpt-oss-20b" }}
{{- end }}
{{- /* The repository name is interpolated into a filesystem path, a shell
       string and a Python string literal, so restrict it to the characters a
       HuggingFace repository id can actually contain. */}}
{{- if not (regexMatch "^[A-Za-z0-9._/-]+$" $model_name) }}
  {{- fail "Model repository may contain only letters, digits, and . _ / -" }}
{{- end }}
{{- if contains ".." $model_name }}
  {{- fail "Model repository must not contain '..'" }}
{{- end }}
{{- $model_dir := $model_name | lower | replace "/" "--" }}
{{- if $revision }}
  {{- if not (regexMatch "[A-Za-z0-9]" $revision) }}
    {{- fail "Model revision must contain at least one letter or digit" }}
  {{- end }}
  {{- $model_dir = printf "%s@%s" $model_dir (trunc 40 (regexReplaceAll "[^a-z0-9._-]" (lower $revision) "-")) }}
{{- end }}

{{- $gpu := lower (trim .Gpu) }}
{{- if and (ne $gpu "nvidia") (ne $gpu "amd") }}
  {{- fail "Gpu must be one of: nvidia, amd" }}
{{- end }}
{{- $gpu_device := "nvidia.com/gpu" }}
{{- if eq $gpu "amd" }}
  {{- $gpu_device = "amd.com/gpu" }}
{{- end }}

{{- $scope := lower (trim .Scope) }}
{{- if not (has $scope (list "user" "group" "organization" "public")) }}
  {{- fail "Scope must be one of: user, group, organization, public" }}
{{- end }}

{{- $volume := trim .Volume }}
{{- if not $volume }}
  {{- fail "Volume must be 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- /* Only structural integrity: name validity is the server's job, but a quote
       or backslash would corrupt the rendered YAML before the server sees it. */}}
{{- if or (contains "\"" $volume) (contains "\\" $volume) }}
  {{- fail "Volume must not contain quotes or backslashes" }}
{{- end }}

{{- $min_replicas := int .MinReplicas }}
{{- $max_replicas := int .MaxReplicas }}
{{- $drain_period := int .DrainPeriod }}
{{- $scale_up_rpm := int .ScaleUpRequestsPerMinute }}
{{- if lt $scale_up_rpm 1 }}
  {{- fail "ScaleUpRequestsPerMinute must be at least 1" }}
{{- end }}
{{- $scale_up_cooldown := int .ScaleUpCooldown }}
{{- if lt $scale_up_cooldown 15 }}
  {{- fail "ScaleUpCooldown must be at least 15 seconds" }}
{{- end }}
{{- $gpus_per_node := int .GpusPerNode }}
{{- $tensor_parallel := max 1 $gpus_per_node }}
{{- $nodes := int .Nodes }}
{{- if lt $nodes 1 }}
  {{- fail "Nodes must be at least 1" }}
{{- end }}
{{- /* A replica's GPUs span every node it has. */}}
{{- $group_gpus := mul $nodes $gpus_per_node }}
{{- $ep := lower (trim .ExpertParallelism) }}
{{- if not (has $ep (list "auto" "true" "false")) }}
  {{- fail "ExpertParallelism must be one of: auto, true, false" }}
{{- end }}
{{- /* Expert parallelism needs at least two GPUs to split the experts across. */}}
{{- if and (eq $ep "true") (lt $group_gpus 2) }}
  {{- fail "ExpertParallelism=true requires Nodes x GpusPerNode >= 2; expert parallelism has no effect on a single GPU" }}
{{- end }}
{{- if and (gt $nodes 1) (lt $gpus_per_node 1) }}
  {{- fail "Nodes > 1 requires GpusPerNode >= 1; every node of a group serves part of the model" }}
{{- end }}
{{- /* Ports the replica's nodes use to reach rank 0: data-parallel RPC for the
       expert-parallel layout, the torch master port for tensor parallelism.
       Multinode services use the host network, so both must be free and
       reachable on every node. */}}
{{- $dp_rpc_port := 13345 }}
{{- $tp_master_port := 29501 }}
{{- $gpu_model := trim .GpuModel }}
{{- $extra_args := trim .ExtraArgs }}
{{- if and $extra_args (not (regexMatch "^[A-Za-z0-9 ._=/-]+$" $extra_args)) }}
  {{- fail "ExtraArgs may contain only letters, digits, spaces, and . _ = / -" }}
{{- end }}
{{- /* Each ExtraEnv entry is checked as NAME=VALUE so it cannot break the
       rendered YAML. */}}
{{- $extra_env := trim .ExtraEnv }}
{{- $env_pairs := list }}
{{- range (splitList " " $extra_env) }}
  {{- $pair := trim . }}
  {{- if $pair }}
    {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*=[A-Za-z0-9_.,:/-]*$" $pair) }}
      {{- fail (printf "ExtraEnv entry %q must be NAME=VALUE, where NAME is a shell identifier and VALUE contains only letters, digits, and . _ , : / -" $pair) }}
    {{- end }}
    {{- $env_pairs = append $env_pairs $pair }}
  {{- end }}
{{- end }}
{{- $hf_token_secret := trim .HfTokenSecret }}

{{- $api_key := trim .ApiKey }}
{{- if .Proxy }}
  {{- if $api_key }}
    {{- if not (regexMatch "^sk-[A-Za-z0-9_-]+$" $api_key) }}
      {{- fail "ApiKey must start with sk- and contain only letters, digits, '-' and '_'" }}
    {{- end }}
  {{- else }}
    {{- $api_key = printf "sk-fb-%d%d%d%d" (randInt 100000000 999999999) (randInt 100000000 999999999) (randInt 100000000 999999999) (randInt 100000000 999999999) }}
  {{- end }}
{{- end }}

{{- $vllm_port := 8000 }}
{{- $litellm_port := randInt 24001 32000 }}
{{- $data_mount := "/data" }}
{{- $model_path := printf "%s/models/%s" $data_mount $model_dir }}

version: v4

volumes:
  data:
    {{- if eq (lower $volume) "ephemeral" }}
    use: ephemeral
    {{- else }}
    use: persistent
    name: "{{ $volume }}"
    {{- end }}
    ingress:
      - source:
          uri: {{ $model }}
          {{- if $hf_token_secret }}
          secret: {{ $hf_token_secret }}
          {{- end }}
        destination:
          uri: file://models/{{ $model_dir }}
        policy:
          timeout:
            execute: {{ .IngressTimeout }}

services:
  vllm:
    persist: true
    image:
      uri: {{ if eq $gpu "amd" }}{{ .VllmRocmImage }}{{ else }}{{ .VllmImage }}{{ end }}
    mounts:
      {{ $data_mount }}:
        volume: data
    env:
      # The model is already local (ingressed); serve fully offline.
      - HF_HUB_OFFLINE=1
      - HF_HOME={{ $data_mount }}/.cache/huggingface
      {{- if eq $gpu "amd" }}
      - PYTORCH_HIP_ALLOC_CONF=expandable_segments:True
      {{- end }}
      {{- range $env_pairs }}
      - {{ . }}
      {{- end }}
    script: |
      #!/bin/sh
      set -u
      # The parallelism layout is decided at runtime: whether the model is
      # MoE is a property of the downloaded snapshot's config.json, which
      # exists only after ingress, never at render time.
      detect=$(python3 - <<'PY'
      import json
      cfg = json.load(open("{{ $model_path }}/config.json"))
      arch = (cfg.get("architectures") or ["unknown"])[0]
      KEYS = ("num_local_experts", "n_routed_experts", "num_experts", "moe_num_experts")
      def moe(c):
          return any(isinstance(c.get(k), int) and c[k] > 1 for k in KEYS)
      # The expert count sits at the top level, or in a nested config block:
      # text_config for multimodal models, ffn_config for DBRX.
      nested = [v for v in cfg.values() if isinstance(v, dict)]
      print(("moe" if moe(cfg) or any(moe(v) for v in nested) else "dense"), arch)
      PY
      ) || { echo "ERROR: cannot read {{ $model_path }}/config.json to detect the model architecture" >&2; exit 1; }
      is_moe=${detect%% *}
      arch=${detect#* }

      use_ep=0
      if [ "{{ $ep }}" = "true" ]; then
        if [ "$is_moe" != "moe" ]; then
          echo "ERROR: ExpertParallelism=true, but model '{{ $model_name }}' (architecture: $arch)" \
               "is not a mixture-of-experts model: config.json has no expert-count field" \
               "(num_local_experts, n_routed_experts, num_experts, moe_num_experts) greater than 1." \
               "Use ExpertParallelism=auto or ExpertParallelism=false." >&2
          exit 1
        fi
        use_ep=1
      elif [ "{{ $ep }}" = "auto" ] && [ "$is_moe" = "moe" ] && [ {{ $group_gpus }} -ge 2 ]; then
        use_ep=1
      fi

      # Expert parallelism: attention runs data-parallel on every GPU and the
      # experts are split across them, so tensor parallelism stays at 1.
      # Otherwise every GPU of the replica holds a slice of every layer.
      if [ "$use_ep" -eq 1 ]; then
        parallel_args="--data-parallel-size {{ $group_gpus }} --enable-expert-parallel"
        echo "vllm: $arch ($is_moe), ExpertParallelism={{ $ep }} -> expert parallelism, data-parallel size {{ $group_gpus }}{{ if gt $nodes 1 }} across {{ $nodes }} nodes{{ end }}"
      else
        parallel_args="--tensor-parallel-size {{ $tensor_parallel }}"
        echo "vllm: $arch ($is_moe), ExpertParallelism={{ $ep }} -> tensor parallelism, size {{ if gt $nodes 1 }}{{ $group_gpus }} across {{ $nodes }} nodes{{ else }}{{ $tensor_parallel }}{{ end }}"
      fi
{{- if gt $nodes 1 }}

      # Extra flags, passed to every node as one argument.
      parallel_extra="{{ $extra_args }}"

      # Fuzzball runs this script on rank 0 only. The helper launches the other
      # nodes through the multinode rsh wrapper, then rank 0 itself. Single
      # quotes leave $RANK for each node to expand itself; the other values
      # arrive as positional arguments.
      . /multinode/generic-helper

      # Every node connects to rank 0, which is this node.
      head_ip="$MULTINODE_NODE_IP"

      if [ "$use_ep" -eq 1 ]; then
        # Each node owns {{ $gpus_per_node }} consecutive data-parallel ranks.
        # The trailing cap keeps every prefill step within the largest CUDA
        # graph vLLM captures: on vLLM 0.28.0 a data-parallel group dies in its
        # all-gather when a rank steps a larger batch (an 8k-token prompt kills
        # it). It comes last so it wins over any value in ExtraArgs.
        ep_extra="$parallel_extra --max-num-batched-tokens 512"
        exec_rankN 'exec vllm serve "$1" \
          --served-model-name "$2" \
          --headless \
          --data-parallel-size "$3" \
          --data-parallel-size-local "$4" \
          --data-parallel-start-rank $(( $RANK * $4 )) \
          --data-parallel-address "$5" \
          --data-parallel-rpc-port "$6" \
          --enable-expert-parallel \
          --tensor-parallel-size 1 \
          --max-model-len "$7" \
          --gpu-memory-utilization "$8" \
          $9' \
          "{{ $model_path }}" "{{ $model_name }}" "{{ $group_gpus }}" "{{ $gpus_per_node }}" \
          "$head_ip" "{{ $dp_rpc_port }}" "{{ .MaxContextSize }}" "{{ .GpuMemoryUtilization }}" \
          "$ep_extra"

        # Rank 0 serves the API, with one API server per local GPU.
        exec_rank0 'exec vllm serve "$1" \
          --served-model-name "$2" \
          --data-parallel-size "$3" \
          --data-parallel-size-local "$4" \
          --data-parallel-address "$5" \
          --data-parallel-rpc-port "$6" \
          --api-server-count "$4" \
          --enable-expert-parallel \
          --tensor-parallel-size 1 \
          --max-model-len "$7" \
          --gpu-memory-utilization "$8" \
          --host 0.0.0.0 \
          --port "$9" \
          ${10}' \
          "{{ $model_path }}" "{{ $model_name }}" "{{ $group_gpus }}" "{{ $gpus_per_node }}" \
          "$head_ip" "{{ $dp_rpc_port }}" "{{ .MaxContextSize }}" "{{ .GpuMemoryUtilization }}" \
          "{{ $vllm_port }}" "$ep_extra"
      else
        # Tensor parallelism across the group: peers join the head's torch
        # process group with their node rank and serve no API of their own.
        exec_rankN 'exec vllm serve "$1" \
          --served-model-name "$2" \
          --headless \
          --tensor-parallel-size "$3" \
          --nnodes "$4" \
          --node-rank "$RANK" \
          --master-addr "$5" \
          --master-port "$6" \
          --max-model-len "$7" \
          --gpu-memory-utilization "$8" \
          $9' \
          "{{ $model_path }}" "{{ $model_name }}" "{{ $group_gpus }}" "{{ $nodes }}" \
          "$head_ip" "{{ $tp_master_port }}" "{{ .MaxContextSize }}" "{{ .GpuMemoryUtilization }}" \
          "$parallel_extra"

        exec_rank0 'exec vllm serve "$1" \
          --served-model-name "$2" \
          --tensor-parallel-size "$3" \
          --nnodes "$4" \
          --node-rank 0 \
          --master-addr "$5" \
          --master-port "$6" \
          --max-model-len "$7" \
          --gpu-memory-utilization "$8" \
          --host 0.0.0.0 \
          --port "$9" \
          ${10}' \
          "{{ $model_path }}" "{{ $model_name }}" "{{ $group_gpus }}" "{{ $nodes }}" \
          "$head_ip" "{{ $tp_master_port }}" "{{ .MaxContextSize }}" "{{ .GpuMemoryUtilization }}" \
          "{{ $vllm_port }}" "$parallel_extra"
      fi

      wait_rank0
{{- else }}

      exec vllm serve "{{ $model_path }}" \
        --served-model-name "{{ $model_name }}" \
        $parallel_args \
        --max-model-len {{ .MaxContextSize }} \
        --gpu-memory-utilization {{ .GpuMemoryUtilization }} \
        --host 0.0.0.0 \
        --port {{ $vllm_port }}{{ if $extra_args }} {{ $extra_args }}{{ end }}
{{- end }}
{{- if gt $nodes 1 }}
    # Each replica spans {{ $nodes }} nodes that start and stop together. The
    # script launches the processes itself, so no MPI launcher is involved.
    multinode:
      nodes: {{ $nodes }}
      implementation: generic
{{- end }}
    resource:
{{- if gt $nodes 1 }}
      # Per node; the replica's total is {{ $nodes }} times this.
{{- end }}
      cpu:
        cores: {{ .CoresPerNode }}
      memory:
        size: {{ .MemoryPerNode }}
      {{- if gt $gpus_per_node 0 }}
      devices:
        {{ $gpu_device }}: {{ $gpus_per_node }}
      {{- if $gpu_model }}
      annotations:
        {{ $gpu_device }}.model: "{{ $gpu_model }}"
      {{- end }}
      {{- end }}
    network:
      {{- if gt $nodes 1 }}
      # Stated rather than left to the platform's implicit default: a group's
      # ranks rendezvous on node addresses over ports they negotiate between
      # themselves, which a bridge namespace cannot carry. Set only here, since
      # a single-node replica wants the substrate-assigned host port that lets
      # two replicas of a pool share a node.
      host: true
      {{- end }}
      ports:
        - name: openai-api
          port: {{ $vllm_port }}
          protocol: tcp
      {{- if not .Proxy }}
      endpoints:
        - name: openai
          port-name: openai-api
          protocol: http
          type: subdomain
          scope: {{ $scope }}
          per-replica: true
          # Discovery contract shared with the litellm gateway entry: it
          # registers endpoints carrying these two annotations.
          annotations:
            ciq.com/api: openai
            ciq.com/model: "{{ $model_name }}"
      {{- end }}
    readiness-probe:
      http-get:
        path: /health
        port: {{ $vllm_port }}
        scheme: HTTP
      initial-delay-seconds: 60
      period-seconds: 15
      timeout-seconds: 5
      failure-threshold: 120
      success-threshold: 1
    autoscaler:
      replicas:
        min: {{ $min_replicas }}
        max: {{ $max_replicas }}
      metrics:
        enabled: true
        path: /metrics
        port: {{ $vllm_port }}
        interval: 15
      {{- if not .Proxy }}
      scale-up:
        triggers:
          # Aggregated because data-parallel serving (expert parallelism)
          # exposes one series per engine rank; a bare vector query would
          # feed the trigger N elements instead of one.
          - metrics-query: sum(vllm:num_requests_waiting) >= bool 2
            cooldown-period: 60
      {{- end }}
      scale-down:
        # Sustained idleness, not an instantaneous sample: a replica between
        # two requests reports 0 running at a scrape instant, which would
        # retire busy replicas every cooldown. max() over engines for the
        # same per-engine-series reason as the scale-up query.
        metrics-query: max(max_over_time(vllm:num_requests_running[5m])) == bool 0
        cooldown-period: 300
        drain-period: {{ $drain_period }}

  {{- if .Proxy }}

  litellm:
    persist: true
    image:
      uri: {{ .LitellmImage }}
    resource:
      cpu:
        cores: 2
      memory:
        size: 4GiB
    network:
      ports:
        - name: openai-api
          port: {{ $litellm_port }}
          protocol: tcp
      endpoints:
        - name: openai
          port-name: openai-api
          protocol: http
          type: subdomain
          scope: {{ $scope }}
    dynamic-config:
      path: /etc/litellm/config.yaml
      services: [vllm]
      script: |
        if [ "${#SERVICES_VLLM_OPENAI_API[@]}" -eq 0 ]; then
          cat <<'EOF'
        model_list: []
        EOF
        else
          cat <<'EOF'
        model_list:
        EOF
          for addr in "${SERVICES_VLLM_OPENAI_API[@]}"; do
            cat <<EOF
          - model_name: "{{ $model_name }}"
            litellm_params:
              model: "hosted_vllm/{{ $model_name }}"
              api_base: "http://${addr}/v1"
        EOF
          done
        fi
        cat <<'EOF'
        general_settings:
          master_key: "{{ $api_key }}"
        litellm_settings:
          callbacks: ["prometheus"]
          num_retries: 2
          # The autoscaler's scraper sends no credentials; without this the
          # scrape gets 401 and no scale trigger can ever fire.
          require_auth_for_metrics_endpoint: false
        EOF
    script: |
      #!/bin/bash
      # LiteLLM reads its config only at startup, while Fuzzball re-renders the
      # dynamic-config file in place as the pool scales; watch the file and
      # restart LiteLLM whenever the backend list changes.
      config=/etc/litellm/config.yaml
      start() {
        litellm --config "$config" --host 0.0.0.0 --port {{ $litellm_port }} &
        litellm_pid=$!
      }
      current() { md5sum "$config" | cut -d' ' -f1; }
      start
      last=$(current)
      while true; do
        sleep 5
        now=$(current)
        if [ "$now" != "$last" ]; then
          # Settle: the file is rewritten in place, so re-read once in case we
          # hashed a partial write.
          sleep 1
          now=$(current)
          last=$now
          kill "$litellm_pid" 2>/dev/null
          wait "$litellm_pid" 2>/dev/null
          start
        elif ! kill -0 "$litellm_pid" 2>/dev/null; then
          wait "$litellm_pid" 2>/dev/null
          start
        fi
      done
    readiness-probe:
      http-get:
        path: /health/readiness
        port: {{ $litellm_port }}
        scheme: HTTP
      initial-delay-seconds: 10
      period-seconds: 10
      timeout-seconds: 5
      failure-threshold: 30
      success-threshold: 1
    autoscaler:
      metrics:
        enabled: true
        # LiteLLM serves the Prometheus exporter at /metrics/ (the bare path
        # 307-redirects there); scrape the canonical path directly.
        path: /metrics/
        port: {{ $litellm_port }}
        interval: 15
      scale-up:
        triggers:
          # One trigger only: submit-time validation allows a target service to
          # be named by at most one trigger. Scale-policy queries are evaluated
          # against the owning replica's own scraped series, so only
          # LiteLLM-visible signals can appear here: failed requests wake an
          # empty or failing pool, sustained request rate grows it under load.
          # Route filter: metrics scrapes and readiness probes are counted in
          # these counters too and would satisfy the rate threshold on their
          # own; only real API traffic may scale the pool.
          - metrics-query: >-
              ((sum(increase(litellm_proxy_failed_requests_metric_total{route=~"/v1/.*"}[1m])) or vector(0)) > bool 0)
              + ((sum(increase(litellm_proxy_total_requests_metric_total{route=~"/v1/.*"}[1m])) or vector(0)) >= bool {{ $scale_up_rpm }})
            cooldown-period: {{ $scale_up_cooldown }}
            services: [vllm]
  {{- end }}
