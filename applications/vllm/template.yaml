{{- /* Model id, accepting either a bare HuggingFace repo id or an hf:// URI. */}}
{{- $model := .ModelName | trim | trimPrefix "hf://" }}
{{- if not $model }}
  {{- fail "ModelName is required" }}
{{- end }}

{{- $proxy := .EnableProxy }}
{{- $scope := .ServiceScope | trim | lower }}
{{- $api_key := .ServerApiKey | trim }}
{{- if and (eq $scope "public") (not $api_key) }}
  {{- fail "ServerApiKey is required when ServiceScope is public" }}
{{- end }}

{{- $min_replicas := .MinReplicas }}
{{- $max_replicas := .MaxReplicas }}
{{- if lt $max_replicas 1 }}
  {{- fail "MaxReplicas must be at least 1" }}
{{- end }}
{{- if lt $max_replicas $min_replicas }}
  {{- fail "MaxReplicas must be greater than or equal to MinReplicas" }}
{{- end }}
{{- if and (not $proxy) (lt $min_replicas 1) }}
  {{- fail "MinReplicas must be at least 1 when EnableProxy is false: without an in-workflow proxy nothing observes requests against an idle pool, so the first replica cannot be scaled up on demand" }}
{{- end }}

{{- $gpu_vendor := .GPUVendor | trim | lower }}
{{- $vllm_image := "" }}
{{- if eq $gpu_vendor "nvidia" }}
  {{- $gpu_vendor = "nvidia.com" }}
  {{- $vllm_image = trim .VllmImage }}
{{- else if eq $gpu_vendor "amd" }}
  {{- $gpu_vendor = "amd.com" }}
  {{- $vllm_image = trim .VllmImageROCm }}
{{- else }}
  {{- fail "Currently supported GPU vendors: NVIDIA and AMD" }}
{{- end }}
{{- $gpu_model := trim .GPUModel }}
{{- $gpu_devices := .ServerGPUDevices }}

{{- $vllm_port := randInt 10000 24000 }}
{{- $proxy_port := randInt 24001 32000 }}

{{- $data_mount := "/data" }}
{{- $hf_cache := trim .HuggingfaceCache }}
{{- if not (or (eq $hf_cache $data_mount) (hasPrefix (printf "%s/" $data_mount) $hf_cache)) }}
  {{- fail (printf "HuggingfaceCache must be an absolute path under the mounted volume %s so the cache persists" $data_mount) }}
{{- end }}

{{- /*
  When the proxy fronts the pool the vLLM API key stays internal, so generate one
  if the caller did not supply a key. Without the proxy, callers talk to vLLM
  directly and can only authenticate with a key they know, so an empty
  ServerApiKey leaves vLLM unauthenticated behind the endpoint scope.
*/}}
{{- $vllm_key := $api_key }}
{{- if and $proxy (not $vllm_key) }}
  {{- $vllm_key = randInt 0 10000000 | printf "%08d" | b64enc }}
{{- end }}

{{- /*
  Replicas of an autoscaled service share a single DNS record of the form
  <service>.autoscaler.<workflow-id>.fuzzball that tracks the currently ready
  replicas. The workflow id is not known at render time, so the in-workflow
  short form is used. This name is stable across replica churn, including while
  the pool sits at zero replicas.
*/}}
{{- $pool_base := printf "http://vllm.autoscaler:%d/v1" $vllm_port }}

version: v4

volumes:
  data:
    reference: {{ trim .ModelVolume }}

services:
  vllm:
    image:
      uri: {{ $vllm_image }}
    mounts:
      {{ $data_mount }}:
        volume: data
    network:
      ports:
        - name: openai-api
          port: {{ $vllm_port }}
          protocol: tcp
{{- if not $proxy }}
      endpoints:
        - name: openai
          port-name: openai-api
          protocol: http
          type: subdomain
          scope: {{ $scope }}
{{- end }}
    resource:
      cpu:
        cores: {{ .ServerCores }}
      memory:
        size: {{ trim .ServerMemory }}
      devices:
        {{ $gpu_vendor }}/gpu: {{ $gpu_devices }}
{{- if $gpu_model }}
      annotations:
        {{ $gpu_vendor }}/gpu.model: "{{ $gpu_model }}"
{{- end }}
    env:
      - HF_HOME={{ $hf_cache }}
{{- if trim .HuggingFaceHubToken }}
      - HF_TOKEN={{ trim .HuggingFaceHubToken }}
{{- end }}
{{- if $vllm_key }}
      - VLLM_API_KEY={{ $vllm_key }}
{{- end }}
    autoscaler:
      replicas:
        min: {{ $min_replicas }}
        max: {{ $max_replicas }}
      metrics:
        enabled: true
        path: /metrics
        port: {{ $vllm_port }}
        interval: {{ .MetricsIntervalSeconds }}
{{- if not $proxy }}
      scale-up:
        triggers:
          # Queued requests on any replica grow the pool toward MaxReplicas.
          - metrics-query: 'max(vllm:num_requests_waiting) >= bool {{ .ScaleUpPendingRequests }}'
            cooldown-period: {{ .ScaleUpCooldownSeconds }}
{{- end }}
      scale-down:
        # Retire a replica only once no replica is serving a request, so
        # generations in flight (including streaming responses) run to
        # completion instead of being cut off.
        metrics-query: 'max(vllm:num_requests_running) == bool 0'
        cooldown-period: {{ .ScaleDownCooldownSeconds }}
{{- if not $proxy }}
    persist: true
{{- end }}
    script: |
      #!/bin/sh
      set -e
      mkdir -p "$HF_HOME"
      exec vllm serve "{{ $model }}" \
        --host 0.0.0.0 \
        --port {{ $vllm_port }} \
        --tensor-parallel-size {{ $gpu_devices }} \
        --max-model-len {{ .MaxContextSize }} \
        --gpu-memory-utilization {{ trim .GPUMemoryUtilization }} \
        --dtype {{ trim .DataType }} \
{{- if trim .ToolCallParser }}
        --tool-call-parser {{ trim .ToolCallParser }} \
        --enable-auto-tool-choice \
{{- end }}
{{- if trim .ReasoningParser }}
        --reasoning-parser {{ trim .ReasoningParser }} \
{{- end }}
        --max-num-batched-tokens {{ .MaxNumBatchedTokens }}
    readiness-probe:
      http-get:
        path: /health
        port: {{ $vllm_port }}
        scheme: http
      initial-delay-seconds: 60
      period-seconds: 30
      failure-threshold: 60
      success-threshold: 1

{{- if $proxy }}

  litellm:
    # No depends-on: the proxy must be reachable while the pool sits at zero
    # replicas, because it is the request against the proxy that wakes the pool.
    image:
      uri: {{ trim .LiteLLMImage }}
    persist: true
    network:
      ports:
        - name: openai-api
          port: {{ $proxy_port }}
          protocol: tcp
      endpoints:
        - name: openai
          port-name: openai-api
          protocol: http
          type: subdomain
          scope: {{ $scope }}
    resource:
      cpu:
        cores: {{ .ProxyCores }}
      memory:
        size: {{ trim .ProxyMemory }}
    env:
      - VLLM_API_KEY={{ $vllm_key }}
{{- if $api_key }}
      - LITELLM_MASTER_KEY={{ $api_key }}
{{- end }}
    files:
      /etc/litellm/config.yaml: |
        model_list:
          - model_name: {{ $model }}
            litellm_params:
              model: openai/{{ $model }}
              api_base: {{ $pool_base }}
              api_key: os.environ/VLLM_API_KEY
        litellm_settings:
          callbacks: ["prometheus"]
          # The autoscaler scrapes /metrics without credentials.
          require_auth_for_metrics_endpoint: false
          num_retries: {{ .ProxyRetries }}
          request_timeout: {{ .ProxyRequestTimeoutSeconds }}
    autoscaler:
      # A cross-service scaling source: it owns no replicas of its own and only
      # drives the vllm pool.
      metrics:
        enabled: true
        path: /metrics
        port: {{ $proxy_port }}
        interval: {{ .MetricsIntervalSeconds }}
      scale-up:
        triggers:
          # Any request arriving at the proxy wakes the first replica, which is
          # the only signal available while the pool is idle at zero.
          - metrics-query: 'sum(rate(litellm_proxy_total_requests_metric_total[1m])) > bool 0'
            cooldown-period: {{ .ActivationCooldownSeconds }}
            services: [vllm]
          # Once replicas are up, their own queue depth grows the pool.
          - metrics-query: 'max(vllm:num_requests_waiting) >= bool {{ .ScaleUpPendingRequests }}'
            cooldown-period: {{ .ScaleUpCooldownSeconds }}
            services: [vllm]
    script: |
      #!/bin/sh
      exec litellm \
        --config /etc/litellm/config.yaml \
        --host 0.0.0.0 \
        --port {{ $proxy_port }}
    readiness-probe:
      http-get:
        path: /health/liveliness
        port: {{ $proxy_port }}
        scheme: http
      initial-delay-seconds: 15
      period-seconds: 15
      failure-threshold: 20
      success-threshold: 1
{{- end }}
