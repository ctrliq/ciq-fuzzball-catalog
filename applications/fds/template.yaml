{{- $filename := base .InputFileSource | trim }}
{{- $datavol := trim .DataVolume }}
{{- if hasPrefix "volume://" (lower $datavol) }}
  {{- fail "DataVolume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" $datavol)) (contains ".." $datavol) (eq $datavol ".") (gt (len $datavol) 255) }}
  {{- fail "DataVolume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}

version: v4
volumes:
  vol_1:
    ingress:
      - source:
          uri: {{.InputFileSource}}
        destination:
          uri: file://{{ .WorkingDirectory | trim | trimPrefix "/data" | trimPrefix "/" }}/{{ $filename }}
    {{- if eq (lower $datavol) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $datavol }}"
    {{- end }}

defaults:
  job:
    mounts:
      /data:
        volume: vol_1

jobs:
  fds:
    cwd: /data
    name: fds
    image:
      uri: docker://openbcl/fds
    policy:
      timeout:
        execute: {{.Timeout}}
    script: |
      #!/bin/sh
      mkdir -p {{ .WorkingDirectory }} && cd {{ .WorkingDirectory }} || exit 1
      mpiexec -n {{.Cores}} fds {{ $filename }}
    resource:
      cpu:
        cores: {{.Cores}}
        affinity: SOCKET
      memory:
        size: {{.Memory}}
