values:
  - name: "ServiceScope"
    display_name: >-
      Who can reach the gateway endpoint. Callers additionally need a LiteLLM virtual key.
    string_value: user
    options_input:
      options: [user, group, organization]
    display_category: "Access"

  - name: "MasterKeySecret"
    display_name: >-
      Fuzzball secret holding the LiteLLM master key, as secret://user/<name>. Must be a
      user-scoped secret of type value whose content starts with sk-. Left empty, a master
      key is generated at every workflow start and embedded in the workflow definition.
    secret_value:
      reference: ""
    display_category: "Access"

  - name: "Volume"
    display_name: >-
      Volume holding the gateway database (virtual keys, budgets, spend history):
      'ephemeral' (default; all of it is lost when the workflow stops) or the name of an
      empty persistent volume you own, to keep the gateway state across restarts. Only one
      gateway at a time should use a given volume -- nothing enforces it, and a second one
      breaks the first. Mounted at /var/lib/postgresql/data
    string_value: ephemeral
    display_category: "Storage"

  - name: "DiscoveryApiValue"
    display_name: >-
      Value of the ciq.com/api endpoint annotation the gateway looks for. Endpoints without
      it are ignored. Do not set this to openai-gateway: that is the value gateways use
      to advertise themselves to clients, and no gateway endpoint carries the
      ciq.com/model annotation a registration also needs, so this gateway would discover
      nothing at all.
    string_value: openai
    display_category: "Discovery"

  - name: "RefreshInterval"
    display_name: >-
      Seconds between endpoint discovery passes. Must stay well below the drain-period of
      the pools being served, so a retiring replica leaves the gateway before it stops.
    uint_value: 25
    display_category: "Discovery"

  - name: "TokenLifetime"
    display_name: >-
      Seconds an endpoint access token is minted for. The gateway re-mints at half the
      granted lifetime, so it also sets how long discovered models keep serving through a
      Fuzzball API outage. The server caps grants at the gateway's own token lifetime, at
      most 7 days.
    uint_value: 14400
    display_category: "Discovery"

  - name: "ColdStartRetries"
    display_name: >-
      Retries LiteLLM makes against a model whose pool is scaling up from zero. Each retry
      backs off, so this is what turns a cold start into a successful first request rather
      than an error.
    uint_value: 8
    display_category: "Discovery"

  - name: "GatewayCores"
    display_name: "Cores for the gateway service."
    uint_value: 2
    display_category: "Resources"

  - name: "GatewayMemory"
    display_name: "Memory for the gateway service."
    string_value: 3GiB
    display_category: "Resources"

  - name: "DatabaseCores"
    display_name: "Cores for the database service."
    uint_value: 1
    display_category: "Resources"

  - name: "DatabaseMemory"
    display_name: "Memory for the database service."
    string_value: 1GiB
    display_category: "Resources"

  - name: "GatewayImage"
    display_name: >-
      LiteLLM container image, with an explicit tag or digest. It must be a litellm-database
      build of v1.97.0 or later: earlier releases ignore the x-litellm-api-key header the
      gateway endpoint depends on. Moving to a different LiteLLM release requires a fresh
      database.
    string_value: "docker://ghcr.io/berriai/litellm-database:v1.97.0"
    display_category: "Container Versions"

  - name: "DatabaseImage"
    display_name: >-
      PostgreSQL container image, with an explicit tag or digest. It must be the official
      postgres image or a mirror of it: the database service relies on its
      docker-entrypoint.sh and POSTGRES_* initialization.
    string_value: "docker://postgres:16.15"
    display_category: "Container Versions"

  - name: "CurlImage"
    display_name: "Image used by the short-lived job that prints how to reach the gateway."
    string_value: "docker://curlimages/curl:8.17.0"
    display_category: "Container Versions"

  - name: "ImageSecret"
    display_name: >-
      Fuzzball image secret (secret://<scope>/<name>, type image with username/password and
      trusted-domains) for pulling from a private registry. It is sent with all three images,
      so when it is set they must all come from one registry, and that registry must be one of
      the secret's trusted domains. Leave empty for registries that allow anonymous pulls.
    secret_value:
      reference: ""
    display_category: "Container Versions"
