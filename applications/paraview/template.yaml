{{- $datavol := trim .DataVolume }}
{{- $homevol := trim .HomeVolume }}
{{- $ingressurl := trim .IngressURL | trimPrefix "file:///" }}
{{- $ingresspath := trim .IngressPath }}
{{- $s3_secret := trim .S3Secret }}
{{- if hasPrefix "volume://" (lower $datavol) }}
  {{- fail "DataVolume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if and $datavol (or (not (regexMatch "^[A-Za-z0-9._-]+$" $datavol)) (contains ".." $datavol) (eq $datavol ".") (gt (len $datavol) 255)) }}
  {{- fail "DataVolume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
{{- if hasPrefix "volume://" (lower $homevol) }}
  {{- fail "HomeVolume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if and $homevol (or (not (regexMatch "^[A-Za-z0-9._-]+$" $homevol)) (contains ".." $homevol) (eq $homevol ".") (gt (len $homevol) 255)) }}
  {{- fail "HomeVolume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
{{- if and $ingressurl (not $datavol) }}
  {{- fail "IngressURL requires DataVolume to be set" }}
{{- end }}
{{- if and $ingressurl (not $ingresspath) }}
  {{- fail "IngressPath is required when IngressURL is set" }}
{{- end }}
{{- if and (hasPrefix "s3://" $ingressurl) (not $s3_secret) }}
  {{- fail "S3Secret is required when IngressURL uses an s3:// prefix" }}
{{- end }}

{{- $datamount := "/data" }}
{{- $home := "/tmp/fbhome" }}
{{- if $homevol }}
  {{- if (trim .HomeDir) }}
    {{- if not (hasPrefix "/" (trim .HomeDir)) }}
      {{- fail (printf "HomeDir must be an absolute path starting with '/', got %q" (trim .HomeDir)) }}
    {{- end }}
    {{- $home = trim .HomeDir }}
  {{- else }}
    {{- fail "HomeDir is required when specifying HomeVolume" }}
  {{- end }}
{{- end }}
{{- $port := randInt 10000 32000 }}


version: v4

{{- if (or $datavol $homevol) }}
volumes:
  {{- if $datavol }}
  data:
    {{- if eq (lower $datavol) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $datavol }}"
    {{- end }}
    {{- if $ingressurl }}
    ingress:
      - source:
          uri: {{ $ingressurl }}
          {{- if $s3_secret }}
          secret: {{ $s3_secret }}
          {{- end }}
        destination:
          uri: file://{{ $ingresspath }}
    {{- end }}
  {{- end }}
  {{- if $homevol }}
  home:
    {{- if eq (lower $homevol) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $homevol }}"
    {{- end }}
  {{- end }}
{{- end }}

services:
  paraview:
{{- if (or $datavol $homevol) }}
    mounts:
  {{- if $datavol }}
      {{ $datamount }}:
        volume: data
  {{- end }}
  {{- if $homevol }}
      {{ $home }}:
        volume: home
  {{- end }}
{{- end }}
    persist: true
    network:
      ports:
        - name: vnc-port
          protocol: tcp
          port: {{ $port }}
      endpoints:
        - name: paraview
          port-name: vnc-port
          protocol: http
          type: subdomain
          scope: user
    readiness-probe:
      http-get:
        path: /
        port: {{ $port }}
        scheme: HTTP
      initial-delay-seconds: 10
    env:
      - HOME={{ $home }}
    image:
      uri: {{ .Container }}
    script: |
      #!/bin/sh
      echo "Starting ParaView desktop"
      /usr/local/bin/start-vncserver.sh {{ $port }}
    resource:
      cpu:
        cores: {{ .Cores }}
      memory:
        size: {{ .Memory }}
      {{- if gt (.GPUs | int) 0 }}
      devices:
        nvidia.com/gpu: {{ .GPUs }}
      {{- end }}
      exclusive: {{ .Exclusive }}
