version: v4
jobs:
  helloworld:
    image:
      uri: "{{.ContainerUri}}"
    policy:
      retry:
        attempts: 1
      timeout:
        execute: "{{.Timeout}}"
    command:
      - /bin/sh
      - '-c'
      - {{.Script}}
    resource:
      cpu:
        cores: {{.Cores}}
        affinity: NUMA
      memory:
        size: {{.Memory}}
