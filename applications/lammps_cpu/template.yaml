{{- $scratchvol := trim .ScratchVolume }}
{{- $datavol := trim .DataVolume }}
{{- if hasPrefix "volume://" (lower $scratchvol) }}
  {{- fail "ScratchVolume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" $scratchvol)) (contains ".." $scratchvol) (eq $scratchvol ".") (gt (len $scratchvol) 255) }}
  {{- fail "ScratchVolume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
{{- if hasPrefix "volume://" (lower $datavol) }}
  {{- fail "DataVolume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if and .StageoutScript (or (not (regexMatch "^[A-Za-z0-9._-]+$" $datavol)) (contains ".." $datavol) (eq $datavol ".") (gt (len $datavol) 255)) }}
  {{- fail "DataVolume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
version: v4
volumes:
  scratch:
    {{- if eq (lower $scratchvol) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $scratchvol }}"
    {{- end }}
    ingress:
      - destination:
          uri: file://stagein.sh
        source:
          uri: {{ .ExperimentUrl }}/{{ .StageinScript }}
{{- if .StageoutScript }}
      - destination:
          uri: file://stageout.sh
        source:
          uri: {{ .ExperimentUrl }}/{{ .StageoutScript }}
  data:
    {{- if eq (lower $datavol) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $datavol }}"
    {{- end }}
{{- end }}

defaults:
  job:
    mounts:
      /scratch:
        volume: scratch

jobs:
  stagein:
    command:
      - /bin/sh
      - stagein.sh
      - {{ .RunName }}
    cwd: /scratch
    image:
      uri: docker://alpine:latest
    name: stagein
    resource:
      cpu:
        cores: 1
      memory:
        size: 512MIB

  run-lammps:
    command:
      - /bin/sh
      - -c
      - lmp_mpi {{.LammpsOptions}} -in input.lammps
    cwd: /scratch/{{.RunName}}
    image:
      uri: {{.LammpsContainerUri}}
    multinode:
      implementation: {{.MpiFlavor}}
      nodes: {{.Nodes}}
    name: run-lammps
    policy:
      timeout:
        execute: {{.Timeout}}
    depends-on:
      - name: stagein
        status: FINISHED
    resource:
      cpu:
        affinity: NUMA
        cores: {{.Cores}}
      memory:
        size: {{.Memory}}
{{- if .StageoutScript }}
  stageout:
    command:
      - /bin/sh
      - stageout.sh
      - {{.RunName}}
      - {{.OutputPath}}
    cwd: /scratch
    image:
      uri: docker://alpine:latest
    mounts:
      /scratch:
        volume: scratch
      /data:
        volume: data
    name: stageout
    depends-on:
      - name: run-lammps
        status: FINISHED
    resource:
      cpu:
        cores: 1
      memory:
        size: 512MIB
{{- end }}
