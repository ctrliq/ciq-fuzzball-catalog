        --trust-remote-code \
        --kv-cache-dtype fp8 \
        --block-size 256 \
        --enable-expert-parallel \
        --tensor-parallel-size 8 \
{{- else if or (and (eq $hw "h100") (eq $strategy "single_node_dep"))
      (and (eq $hw "h200") (eq $strategy "single_node_dep")) }}
        --trust-remote-code \
        --kv-cache-dtype fp8 \
        --block-size 256 \
        --enable-expert-parallel \
        --data-parallel-size 4 \
        --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE", "custom_ops":["all"]}' \
{{- else if or (and (eq $hw "b200") (eq $strategy "single_node_tp"))
