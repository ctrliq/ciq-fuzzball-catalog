        scheme: http
      initial-delay-seconds: 60
      period-seconds: 30
      failure-threshold: {{ .ReadinessFailureThreshold }}
      success-threshold: 1

{{- if $proxy }}

  litellm:
    # No depends-on: the proxy must answer while the pool sits at zero
    # replicas, because that request is what wakes the pool.
    image:
      uri: {{ trim .LiteLLMImage }}
    persist: true
    network:
      ports:
        - name: openai-api
          port: {{ $proxy_port }}
          protocol: tcp
      endpoints:
        - name: openai
          port-name: openai-api
          protocol: http
          type: subdomain
          scope: {{ $scope }}
    resource:
      cpu:
        cores: {{ .ProxyCores }}
      memory:
        size: {{ trim .ProxyMemory }}
    env:
      - VLLM_API_KEY={{ $vllm_key }}
{{- if $api_key }}
      - LITELLM_MASTER_KEY={{ $api_key }}
{{- end }}
    files:
      /etc/litellm/config.yaml: |
        model_list:
          - model_name: deepseek-ai/DeepSeek-V4-Flash
            litellm_params:
              model: openai/deepseek-ai/DeepSeek-V4-Flash
              api_base: {{ $pool_base }}
              api_key: os.environ/VLLM_API_KEY
        litellm_settings:
          callbacks: ["prometheus"]
          # The autoscaler scrapes /metrics without credentials.
          require_auth_for_metrics_endpoint: false
          num_retries: {{ .ProxyRetries }}
          request_timeout: {{ .ProxyRequestTimeoutSeconds }}
    autoscaler:
      # A cross-service scaling source: it owns no replicas and only
      # drives the vllm pool.
      metrics:
        enabled: true
        path: /metrics
        port: {{ $proxy_port }}
        interval: {{ .MetricsIntervalSeconds }}
      scale-up:
        triggers:
          # Any request arriving at the proxy wakes the first replica, the
          # only signal available while the pool is idle at zero.
          - metrics-query: 'sum(rate(litellm_proxy_total_requests_metric_total[1m])) > bool 0'
            cooldown-period: {{ .ActivationCooldownSeconds }}
            services: [vllm]
          # Once replicas are up, their own queue depth grows the pool.
          - metrics-query: 'max(vllm:num_requests_waiting) >= bool {{ .ScaleUpPendingRequests }}'
            cooldown-period: {{ .ScaleUpCooldownSeconds }}
            services: [vllm]
    script: |
      #!/bin/sh
      exec litellm \
        --config /etc/litellm/config.yaml \
        --host 0.0.0.0 \
        --port {{ $proxy_port }}
    readiness-probe:
      http-get:
        path: /health/liveliness
        port: {{ $proxy_port }}
        scheme: http
      initial-delay-seconds: 15
      period-seconds: 15
      failure-threshold: 20
      success-threshold: 1
{{- end }}
