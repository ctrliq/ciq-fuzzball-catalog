{{- $pool_base := printf "http://vllm.autoscaler:%d/v1" $vllm_port }}

version: v4

volumes:
  data:
    reference: {{ trim .ModelVolume }}

services:
  vllm:
    image:
      uri: {{ $image }}
    mounts:
      {{ $data_mount }}:
        volume: data
    network:
      ports:
        - name: openai-api
          port: {{ $vllm_port }}
          protocol: tcp
{{- if not $proxy }}
      endpoints:
        - name: openai
          port-name: openai-api
          protocol: http
          type: subdomain
          scope: {{ $scope }}
{{- end }}
    resource:
      cpu:
        cores: {{ .ServerCores }}
      memory:
        size: {{ trim .ServerMemory }}
      devices:
        {{ $vendor }}/gpu: {{ $gpus }}
{{- if $gpu_model }}
      annotations:
        {{ $vendor }}/gpu.model: "{{ $gpu_model }}"
{{- end }}
    env:
      - HF_HOME={{ $hf_cache }}
{{- if trim .HuggingFaceHubToken }}
      - HF_TOKEN={{ trim .HuggingFaceHubToken }}
{{- end }}
{{- if $vllm_key }}
      - VLLM_API_KEY={{ $vllm_key }}
{{- end }}
{{- /* Environment pinned by the recipe for this configuration. */}}
{{- if or (eq $hw "mi325x") (eq $hw "mi355x") }}
