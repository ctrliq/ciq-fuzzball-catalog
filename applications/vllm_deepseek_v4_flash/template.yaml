{{- else if or (and (eq $hw "b200") (eq $strategy "single_node_tep") (eq $variant "default"))
      (and (eq $hw "b200") (eq $strategy "single_node_tep") (eq $variant "dspark"))
      (and (eq $hw "b200") (eq $strategy "single_node_tep") (eq $variant "fp8"))
      (and (eq $hw "b300") (eq $strategy "single_node_tep") (eq $variant "default"))
      (and (eq $hw "b300") (eq $strategy "single_node_tep") (eq $variant "dspark"))
      (and (eq $hw "b300") (eq $strategy "single_node_tep") (eq $variant "fp8")) }}
        --trust-remote-code \
