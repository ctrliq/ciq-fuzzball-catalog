{{- $ver := .AnsysVersion }}
{{- $ansys_version_number := printf "v%s%s" (substr 2 4 $ver) (substr 5 6 $ver) }}
{{- $ansys_root := printf "%s/%s" .AnsysInstallDir $ansys_version_number }}
{{- $datamount := "/data" }}
{{- /* noVNC web port this image's start-vncserver.sh serves on. Fixed for this image. */}}
{{- $novnc_port := 6080 }}
version: v4

volumes:
  data:
    reference: {{.Volume}}

services:
  xfce4:
    persist: true
    image:
      uri: {{.AnsysCfxDesktopContainerURI}}
      secret: {{.AnsysCfxDesktopContainerOciSecret}}
    network:
      ports:
        - name: novnc
          protocol: tcp
          port: {{ $novnc_port }}
      endpoints:

        - name: vnc
          port-name: novnc
          protocol: http
          type: subdomain
          scope: {{.EndpointScope}}
    readiness-probe:
      http-get:
        path: /
        port: {{ $novnc_port }}
        scheme: HTTP
      initial-delay-seconds: 15
    env:
      - HOME=/tmp/home
      - ANSYSLMD_LICENSE_FILE={{.AnsyslmdLicenseFile}}
    mounts:
      {{ $datamount }}: data
    script: |
      #!/bin/sh
      export PATH={{$ansys_root}}/Framework/bin/Linux64:$PATH
      echo "Starting CFX virtual desktop (noVNC on :{{ $novnc_port }})..."
      /usr/local/bin/start-vncserver.sh
    resource:
      cpu:
        cores: {{.CfxDesktopCores}}
        affinity: NUMA
      memory:
        size: {{.CfxDesktopMemory}}
    policy:
      timeout:
        execute: {{.Timeout}}