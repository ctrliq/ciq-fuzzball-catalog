{{- $datamount := "/data" }}
{{- $ngc_secret := trim .NgcApiKeySecret }}
{{- if not $ngc_secret }}
  {{- fail "NgcApiKeySecret is required" }}
{{- end }}
{{- $oci_secret := trim .NgcOciSecret }}
{{- if not $oci_secret }}
  {{- fail "NgcOciSecret is required" }}
{{- end }}
{{- /* Each image reference needs an explicit tag or digest, and a tag
       cannot be empty: a reference ending in ':' renders a uri YAML reads as a
       mapping. Fuzzball parses references with go-containerregistry, which
       wants a lowercase repository path of 2 to 255 characters after any
       registry host, and a tag of at most 128. A first path segment names a registry host only when
       it holds a dot or a port or is localhost; otherwise the image is on
       Docker Hub. */}}
{{- $openWebUIImage := trim .OpenWebUIImage }}
{{- $stubImage := trim .StubImage }}
{{- range $img := list (list "OpenWebUIImage" $openWebUIImage "docker://registry:5000/open-webui/open-webui:v0.7.2") (list "StubImage" $stubImage "docker://registry:5000/library/python:3.12-slim") }}
  {{- $name := index $img 0 }}
  {{- $ref := index $img 1 }}
  {{- $example := index $img 2 }}
  {{- if not (regexMatch "^(docker|oras)://((\\[[0-9A-Fa-f:]+\\]|[A-Za-z0-9._-]+)(:[0-9]+)?/)?[a-z0-9._-]*(/[a-z0-9._-]*)*(:[A-Za-z0-9._-]{1,128}|@sha256:[a-f0-9]{64})$" $ref) }}
    {{- fail (printf "%s needs an explicit tag or digest and a lowercase repository path, and may name a ported registry, e.g. %s" $name $example) }}
  {{- end }}
  {{- $path := regexReplaceAll "^[a-z]+://" $ref "" }}
  {{- $first := regexReplaceAll "/.*$" $path "" }}
  {{- $repository := regexReplaceAll "(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$" $path "" }}
  {{- if contains "/" $path }}
    {{- if or (contains "." $first) (contains ":" $first) (eq $first "localhost") }}
      {{- $repository = regexReplaceAll "^[^/]*/" $repository "" }}
    {{- else if not (regexMatch "^[a-z0-9._-]*$" $first) }}
      {{- fail (printf "%s needs a lowercase repository path, e.g. %s" $name $example) }}
    {{- end }}
  {{- end }}
  {{- if or (lt (len $repository) 2) (gt (len $repository) 255) }}
    {{- fail (printf "%s needs a repository name of 2 to 255 characters, e.g. %s" $name $example) }}
  {{- end }}
{{- end }}
{{- $imageSecret := trim .ImageSecret }}
{{- if and $imageSecret (not (regexMatch "^secret://(user|group|account|organization|cluster)/[A-Za-z0-9._-]+$" $imageSecret)) }}
  {{- fail "ImageSecret must be a secret reference, e.g. secret://organization/registry-mirror" }}
{{- end }}
{{- /* Fuzzball checks an image secret's trusted domains against the host of
       one image's URI, exactly as written with any port removed, yet sends
       its credentials with every pull that uses the secret. So with a secret
       set, every image it goes with must name its registry host, and all of
       them the same one. */}}
{{- if $imageSecret }}
  {{- $pulled := list (list "OpenWebUIImage" $openWebUIImage) (list "StubImage" $stubImage) }}
  {{- /* The NIM image is pulled with NgcOciSecret. When that is the same
         secret, Fuzzball checks one trusted-domains list for all three. */}}
  {{- if eq $imageSecret $oci_secret }}
    {{- $pulled = append $pulled (list "NimImageUri" (trim .NimImageUri)) }}
  {{- end }}
  {{- $hosts := list }}
  {{- range $img := $pulled }}
    {{- $path := regexReplaceAll "^[a-z]+://" (index $img 1) "" }}
    {{- $first := regexReplaceAll "/.*$" $path "" }}
    {{- if not (and (contains "/" $path) (or (contains "." $first) (contains ":" $first) (eq $first "localhost"))) }}
      {{- fail (printf "ImageSecret is set, so %s must name its registry host, e.g. docker://docker.io/<namespace>/<name>:<tag> for Docker Hub, where official images use the namespace library (got %s)" (index $img 0) (index $img 1)) }}
    {{- end }}
    {{- $hosts = append $hosts (regexReplaceAll ":[0-9]+$" $first "") }}
  {{- end }}
  {{- if gt (len (uniq $hosts)) 1 }}
    {{- fail (printf "ImageSecret is sent with OpenWebUIImage and StubImage, and NimImageUri too when NgcOciSecret is the same secret, so they must name one registry host (got %s); the host is compared exactly as written, so docker.io and index.docker.io differ" (join ", " (uniq $hosts))) }}
  {{- end }}
{{- end }}
{{- $hf_token := trim .HuggingFaceTokenSecret }}
{{- if not $hf_token }}
  {{- fail "HuggingFaceTokenSecret is required — accept the model EULA on Hugging Face before running this workflow" }}
{{- end }}

{{- $model_name := trim .ModelName }}
{{- $model_id := base $model_name }}
{{- $nim_port :=  randInt 10000 16000 }}
{{- $stub_port := randInt 16001 22000 }}
{{- $ui_port :=   randInt 22001 32000 }}

version: v4

volumes:
  cache:
    reference: {{ .CacheVolume }}

services:
  nim:
    image:
      uri: {{ .NimImageUri }}
      secret: {{ $oci_secret }}
    env:
      - NGC_API_KEY={{ $ngc_secret }}
      - NIM_HTTP_API_PORT={{ $nim_port }}
      - NIM_CACHE_PATH={{ trim .NimCachePath }}
      - NIM_IGNORE_MODEL_DOWNLOAD_FAIL=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - RUN_GUARDRAILS_ON_CPU=true
      {{- if .VaeCpuOffload }}
      - VAE_CPU_OFFLOAD=true
      {{- end }}
      {{- if .DitLayerwiseOffload }}
      - DIT_LAYERWISE_OFFLOAD=true
      {{- end }}
      {{- if .TextEncoderCpuOffload }}
      - TEXT_ENCODER_CPU_OFFLOAD=true
      {{- end }}
      - HF_TOKEN={{ $hf_token }}
    mounts:
      {{ $datamount }}:
        volume: cache
    script: |
      #!/bin/sh
      mkdir -p "$NIM_CACHE_PATH"
      nvidia-smi
      start_server
    resource:
      cpu:
        cores: {{ .Cores }}
        affinity: NUMA
      memory:
        size: {{ .Memory }}
      devices:
        nvidia.com/gpu: {{ .GPUs }}
      {{- if trim .GPUModel }}
      annotations:
        nvidia.com/gpu.model: "{{ trim .GPUModel }}"
      {{- end }}
    network:
      host: true
      ports:
        - name: http
          port: {{ $nim_port }}
          protocol: tcp
    readiness-probe:
      http-get:
        path: /v1/health/ready
        port: {{ $nim_port }}
        scheme: HTTP
      initial-delay-seconds: 60
      period-seconds: 30
      timeout-seconds: 10
      failure-threshold: 60
    persist: true

  nim-stub:
    image:
      uri: {{ $stubImage }}
      {{- if $imageSecret }}
      secret: {{ $imageSecret }}
      {{- end }}
    script: |
      #!/usr/bin/env python3
      import http.server, json, time, urllib.request, urllib.error, sys

      NIM = "http://nim.svc:{{ $nim_port }}"
      MODELS = json.dumps({"object": "list", "data": [{"id": "{{ $model_id }}", "object": "model", "created": 0, "owned_by": "nvidia"}]}).encode()

      class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.end_headers()
              self.wfile.write(MODELS)

          def do_POST(self):
              try:
                  raw = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  body = json.loads(raw)
              except (json.JSONDecodeError, ValueError) as e:
                  self.send_response(400)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(json.dumps({"error": f"invalid JSON body: {e}"}).encode())
                  return
              if "images" in self.path:
                  body["response_format"] = "b64_json"
                  body["model"] = "{{ $model_name }}"
                  auth = self.headers.get("Authorization", "")
                  prompt = body.get('prompt', '')
                  print(f"[stub] proxying {self.path} prompt_length={len(prompt)}", flush=True)
                  req = urllib.request.Request(
                      NIM + self.path,
                      data=json.dumps(body).encode(),
                      headers={"Content-Type": "application/json", "Authorization": auth},
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=300) as r:
                          data = r.read()
                      print(f"[stub] NIM responded OK, {len(data)} bytes", flush=True)
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(data)
                  except urllib.error.HTTPError as e:
                      err_body = e.read()
                      print(f"[stub] NIM HTTP error {e.code}: {err_body[:500]}", file=sys.stderr, flush=True)
                      self.send_response(e.code)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(err_body)
                  except Exception as e:
                      print(f"[stub] proxy error: {e}", file=sys.stderr, flush=True)
                      self.send_response(502)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"error": str(e)}).encode())
              else:
                  import re
                  messages = body.get("messages", [])
                  all_content = " ".join(m.get("content", "") for m in messages)
                  last_user = next((m["content"] for m in reversed(messages) if m.get("role") == "user"), "")
                  if '"prompt": "Your detailed description here."' in all_content:
                      matches = re.findall(r'USER: (.+?)</chat_history>', all_content, re.DOTALL)
                      user_prompt = matches[-1].strip() if matches else last_user
                      content = json.dumps({"prompt": user_prompt})
                  elif '"follow_ups"' in all_content:
                      content = json.dumps({"follow_ups": []})
                  elif '"title": "your concise title here"' in all_content:
                      content = json.dumps({"title": "Image Generation"})
                  elif '"tags": ["tag1"' in all_content:
                      content = json.dumps({"tags": ["General"]})
                  else:
                      content = last_user
                  print(f"[stub] chat completion generated, content_length={len(content)}", flush=True)
                  resp = json.dumps({
                      "id": "chatcmpl-stub",
                      "object": "chat.completion",
                      "created": int(time.time()),
                      "model": "{{ $model_id }}",
                      "choices": [{"index": 0, "message": {"role": "assistant", "content": content}, "finish_reason": "stop"}],
                      "usage": {"prompt_tokens": 10, "completion_tokens": 10, "total_tokens": 20},
                  }).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(resp)

          def log_message(self, fmt, *a):
              print(f"[stub] {fmt % a}", flush=True)

      http.server.ThreadingHTTPServer(("0.0.0.0", {{ $stub_port }}), H).serve_forever()
    resource:
      cpu:
        cores: 1
        affinity: NUMA
      memory:
        size: 256MiB
    depends-on:
      - name: nim
        status: RUNNING
        description: stub proxies to NIM so NIM must be ready first
    network:
      host: true
      ports:
        - name: http
          port: {{ $stub_port }}
          protocol: tcp
    readiness-probe:
      http-get:
        path: /v1/models
        port: {{ $stub_port }}
        scheme: HTTP
      initial-delay-seconds: 5
      period-seconds: 5
      timeout-seconds: 3
      failure-threshold: 10
    persist: true

  open-webui:
    image:
      uri: {{ $openWebUIImage }}
      {{- if $imageSecret }}
      secret: {{ $imageSecret }}
      {{- end }}
    env:
      - IMAGE_GENERATION_ENGINE=openai
      - IMAGES_OPENAI_API_BASE_URL=http://nim-stub.svc:{{ $stub_port }}/v1
      - IMAGES_OPENAI_API_KEY={{ $ngc_secret }}
      - ENABLE_IMAGE_GENERATION=True
      - IMAGE_GENERATION_MODEL={{ $model_name }}
      - WEBUI_AUTH=False
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://nim-stub.svc:{{ $stub_port }}/v1
      - OPENAI_API_KEY={{ $ngc_secret }}
      - PORT={{ $ui_port }}
    depends-on:
      - name: nim-stub
        status: RUNNING
        description: stub must be ready before Open WebUI starts
    script: |
      #!/bin/sh
      set -e
      exec bash /app/backend/start.sh
    resource:
      cpu:
        cores: 2
        affinity: NUMA
      memory:
        size: 4GiB
    network:
      ports:
        - name: http
          port: {{ $ui_port }}
          protocol: tcp
      endpoints:
        - name: ui
          port-name: http
          protocol: http
          type: subdomain
          scope: {{ .ServiceScope }}
    readiness-probe:
      http-get:
        path: /health
        port: {{ $ui_port }}
        scheme: HTTP
      initial-delay-seconds: 15
      period-seconds: 10
      timeout-seconds: 5
      failure-threshold: 12
    persist: true
