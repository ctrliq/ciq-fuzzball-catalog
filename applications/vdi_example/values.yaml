values:
  - name: "Container"
    display_name: Desktop container to use. Has to be compatible with this application
    string_value: oras://docker.io/adere2/vdi-vgl:1.0-test
    display_category: "Container"
  - name: "Cores"
    display_name: "How many CPU cores to allocate."
    uint_value: 2
    display_category: "Resources"
  - name: "Memory"
    display_name: "How much memory to allocate."
    string_value: "4GiB"
    display_category: "Resources"
  - name: "Exclusive"
    display_name: "Disallow other jobs from using the same node/instance."
    bool_value: true
    display_category: "Scheduling"
  - name: "DataVolume"
    display_name: "Volume with your data directories. Defaults to an ephemeral volume."
    string_value: "volume://user/ephemeral"
    display_category: "Storage"
  - name: "HomeVolume"
    display_name: "[optional] Volume housing your home directory. Mounted at /home"
    string_value: ""
    display_category: "Storage"
  - name: "HomeDir"
    display_name: "Path to the homedir (absolute). Required if HomeVolume is used"
    string_value: ""
    display_category: "Storage"