{{- $datavol := trim .DataVolume }}
{{- $homevol := trim .HomeVolume }}
{{- if and $datavol (not (hasPrefix "volume://" $datavol)) }}
  {{- fail (printf "DataVolume must start with 'volume://', got %q" $datavol) }}
{{- end }}
{{- if and $homevol (not (hasPrefix "volume://" $homevol)) }}
  {{- fail (printf "HomeVolume must start with 'volume://', got %q" $homevol) }}
{{- end }}

{{- $datamount := "/data" }}
{{- $home := "/tmp/fbhome" }}
{{- if $homevol }}
  {{- if (trim .HomeDir) }}
    {{- if not (hasPrefix "/" (trim .HomeDir)) }}
      {{- fail (printf "HomeDir must be an absolute path starting with '/', got %q" (trim .HomeDir)) }}
    {{- end }}
    {{- $home = trim .HomeDir }}
  {{- else }}
    {{- fail "HomeDir is required when specifying HomeVolume" }}
  {{- end }}
{{- end }}
{{- $port := randInt 10000 32000 }}

version: v4

{{- if (or $datavol $homevol) }}
volumes:
  {{- if $datavol }}
  data:
    reference: {{ $datavol }}
  {{- end }}
  {{- if $homevol }}
  home:
    reference: {{ $homevol }}
  {{- end }}
{{- end }}

services:
  vnc:
{{- if (or $datavol $homevol) }}
    mounts:
  {{- if $datavol }}
      {{ $datamount }}:
        volume: data
  {{- end }}
  {{- if $homevol }}
      {{ $home }}:
        volume: home
  {{- end }}
{{- end }}
    persist: true
    network:
      ports:
        - name: vnc-port
          protocol: tcp
          port: {{ $port }}
      endpoints:
        - name: vnc
          port-name: vnc-port
          protocol: http
          type: subdomain
          scope: user
    readiness-probe:
      http-get:
        path: /
        port: {{ $port }}
        scheme: HTTP
      initial-delay-seconds: 10
    image:
      uri: {{ .Container }}
    script: |
      #!/bin/sh
      set -eu

      mkdir -p /tmp/vnc
      chmod 700 /tmp/vnc

      export HOME="{{ $home }}"
      export XAUTHORITY=/tmp/vnc/.Xauthority

      mkdir -p "${HOME}"
      cd "${HOME}"

      echo "Starting GPU-accelerated desktop and VNC"

      exec /usr/local/bin/start-vncserver.sh {{ $port }}
    resource:
      cpu:
        cores: {{ .Cores }}
      memory:
        size: {{ .Memory }}
      devices:
        nvidia.com/gpu: 1
      exclusive: {{ .Exclusive }}