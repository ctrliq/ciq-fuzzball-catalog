{{- $datavol := trim .DataVolume }}
{{- $homevol := trim .HomeVolume }}
{{- if hasPrefix "volume://" (lower $datavol) }}
  {{- fail "DataVolume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if and $datavol (or (not (regexMatch "^[A-Za-z0-9._-]+$" $datavol)) (contains ".." $datavol) (eq $datavol ".") (gt (len $datavol) 255)) }}
  {{- fail "DataVolume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
{{- if hasPrefix "volume://" (lower $homevol) }}
  {{- fail "HomeVolume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if and $homevol (or (not (regexMatch "^[A-Za-z0-9._-]+$" $homevol)) (contains ".." $homevol) (eq $homevol ".") (gt (len $homevol) 255)) }}
  {{- fail "HomeVolume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}

{{- $datamount := "/data" }}
{{- $home := "/tmp/fbhome" }}
{{- if $homevol }}
  {{- if (trim .HomeDir) }}
    {{- if not (hasPrefix "/" (trim .HomeDir)) }}
      {{- fail (printf "HomeDir must be an absolute path starting with '/', got %q" (trim .HomeDir)) }}
    {{- end }}
    {{- $home = trim .HomeDir }}
  {{- else }}
    {{- fail "HomeDir is required when specifying HomeVolume" }}
  {{- end }}
{{- end }}
{{- $port := randInt 10000 32000 }}

version: v4

{{- if (or $datavol $homevol) }}
volumes:
  {{- if $datavol }}
  data:
    {{- if eq (lower $datavol) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $datavol }}"
    {{- end }}
  {{- end }}
  {{- if $homevol }}
  home:
    {{- if eq (lower $homevol) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $homevol }}"
    {{- end }}
  {{- end }}
{{- end }}

services:
  vnc:
{{- if (or $datavol $homevol) }}
    mounts:
  {{- if $datavol }}
      {{ $datamount }}:
        volume: data
  {{- end }}
  {{- if $homevol }}
      {{ $home }}:
        volume: home
  {{- end }}
{{- end }}
    persist: true
    network:
      ports:
        - name: vnc-port
          protocol: tcp
          port: {{ $port }}
      endpoints:
        - name: vnc
          port-name: vnc-port
          protocol: http
          type: subdomain
          scope: user
    readiness-probe:
      http-get:
        path: /
        port: {{ $port }}
        scheme: HTTP
      initial-delay-seconds: 10
    image:
      uri: {{ .Container }}
    script: |
      #!/bin/sh
      set -eu

      mkdir -p /tmp/vnc
      chmod 700 /tmp/vnc

      export HOME="{{ $home }}"
      export XAUTHORITY=/tmp/vnc/.Xauthority

      mkdir -p "${HOME}"
      cd "${HOME}"

      echo "Starting {{ if gt (.GPUs | int) 0 }}GPU-accelerated {{ end }}desktop and VNC"

      exec /usr/local/bin/start-vncserver.sh {{ $port }}
    resource:
      cpu:
        cores: {{ .Cores }}
      memory:
        size: {{ .Memory }}
      {{- if gt (.GPUs | int) 0 }}
      devices:
        nvidia.com/gpu: {{ .GPUs }}
      {{- end }}
      exclusive: {{ .Exclusive }}