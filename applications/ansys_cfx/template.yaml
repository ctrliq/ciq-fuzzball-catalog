{{- $volume := trim .Volume }}
{{- if hasPrefix "volume://" (lower $volume) }}
  {{- fail "Volume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" $volume)) (contains ".." $volume) (eq $volume ".") (gt (len $volume) 255) }}
  {{- fail "Volume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
{{- $ver := .AnsysVersion }}
{{- $ansys_version_number := printf "v%s%s" (substr 2 4 $ver) (substr 5 6 $ver) }}
{{- $datamount := "/data" }}
version: v4

volumes:
  data:
    {{- if eq (lower $volume) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $volume }}"
    {{- end }}

defaults:
  job:
    mounts:
      {{ $datamount }}: data

jobs:
  cfx-static-mixer:
    image:
      uri: {{.AnsysCfxContainerURI}}
      secret: {{.AnsysCfxContainerOciSecret}}
    env:
      - ANSYSLMD_LICENSE_FILE={{.AnsyslmdLicenseFile}}
    cwd: {{ $datamount }}
    script: |
      #!/bin/sh
      set -e

      export PATH={{.AnsysInstallDir}}/{{$ansys_version_number}}/CFX/bin:$PATH

      WORKDIR="{{ $datamount }}/ansys-cfx-static-mixer-example-$FB_WORKFLOW_ID"
      mkdir -p "$WORKDIR"
      cd "$WORKDIR"

      cfx5solve -eg StaticMixer -par-dist "$(hostname)*{{.CfxCores}}"

      LATEST_CFX_LOG_FILE=$(ls -1t StaticMixer_*.out 2>/dev/null | head -n 1)

      if [ -n "$LATEST_CFX_LOG_FILE" ]; then
        cat $LATEST_CFX_LOG_FILE
      else
        echo "No CFX log files found."
      fi
    resource:
      cpu:
        cores: {{.CfxCores}}
        affinity: NUMA
      memory:
        size: {{.CfxMemory}}
    policy:
      timeout:
        execute: 30m
