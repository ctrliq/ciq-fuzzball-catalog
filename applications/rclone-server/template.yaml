{{- $root := "/fuzzball" }}
{{- /* Each Volumes entry is <name>[:/path]: the name of a persistent volume, or
       the word ephemeral for a scratch volume that ends with the workflow. */}}
{{- $volumes := list }}
{{- range $raw := splitList "," .Volumes }}
  {{- $volume := trim $raw }}
  {{- if hasPrefix "volume://" $volume }}
    {{- fail (printf "Volumes entry %q uses the old volume:// form; give the volume's name instead, e.g. my-data or my-data:/custom/path (or ephemeral for a scratch volume)" $volume) }}
  {{- end }}
  {{- if ne $volume "" }}
    {{- $parts := splitList ":" $volume }}
    {{- if gt (len $parts) 2 }}
      {{- fail (printf "Volumes entry %q must be <name> or <name>:/path" $volume) }}
    {{- end }}
    {{- if not (regexMatch "^[A-Za-z0-9._-]+$" (index $parts 0)) }}
      {{- fail (printf "Volumes entry %q must start with a volume name (letters, digits, '.', '_' or '-') or ephemeral" $volume) }}
    {{- end }}
    {{- $volumes = append $volumes $volume }}
  {{- end }}
{{- end }}
{{- if eq (len $volumes) 0 }}
  {{-  fail "At least one volume has to be specified in the Volumes field." }}
{{- end }}
{{- $username := trim .Username }}
{{- $password := trim .Password }}
{{- $protocol := trim .Protocol }}

version: v4
volumes:
{{- range $i, $v := $volumes }}
  {{- $name := index (splitList ":" $v) 0 }}
  {{- if eq (lower $name) "ephemeral" }}
  vol-{{ $i }}: {}
  {{- else }}
  vol-{{ $i }}:
    name: "{{ $name }}"
  {{- end }}
{{- end }}
jobs:
  {{ $protocol }}:
    image:
      uri: {{ .Container }}
    mounts:
{{- range $i, $v := $volumes }}
  {{- $parts := splitList ":" $v }}
  {{- if eq (len $parts) 2 }}
      {{ $root }}/{{ index $parts 1 | trimPrefix "/" }}:
        volume: vol-{{ $i }}
  {{- else }}
      {{ $root }}/{{ index $parts 0 }}:
        volume: vol-{{ $i }}
  {{- end }}
{{- end }}

    cwd: {{ $root }}
{{- if (and $username $password) }}
    env:
      - RCLONE_USER={{ $username }}
      - RCLONE_PASS={{ $password }}
{{- else }}
  {{- fail "Username and password are required" }}
{{- end }}
    script: |
      #!/bin/sh
      cat <<__EOF__
      Access to the {{ .Protocol }} server requires port-forwarding via the CLI:
        # fuzzball workflow port-forward ${FB_WORKFLOW_ID} {{ .Protocol }} {{ .Port }}:{{ .Port }}
      In your client program of choice use 'localhost' as the host and {{ .Port }} as the port
      --------------------------------------------------------------------------------------------
      __EOF__
{{- if eq $protocol "sftp" }}
      rclone serve sftp \
        --addr localhost:{{ .Port }} \
        --cache-dir "$(mktemp -d)" \
        --log-level INFO \
        {{ $root }}
{{- else if eq $protocol "webdav" }}
      rclone serve webdav \
        --addr localhost:{{ .Port }} \
        --cache-dir "$(mktemp -d)" \
        --log-level INFO \
        {{ $root }}
{{- else }}
  {{- fail "only sftp and webdav protocols are supported" }}
{{- end }}
    resource:
      cpu:
        cores: 2
      memory:
        size: 6GiB
    policy:
      timeout:
        execute: {{ .Timeout }}
