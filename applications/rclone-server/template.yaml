{{- $root := "/fuzzball" }}
{{- if contains "volume://" .Volumes }}
  {{- fail "Volumes no longer takes volume:// URIs -- use persistent volume names, e.g. `home` or `home:/custom/path`" }}
{{- end }}
{{- $volumes := list }}
{{- range $raw := splitList "," .Volumes }}
  {{- $entry := trim $raw }}
  {{- if ne $entry "" }}
    {{- $parts := splitList ":" $entry }}
    {{- if gt (len $parts) 2 }}
      {{- fail (printf "Invalid volume entry %q -- expected <volume-name>[:<mount-path>]" $entry) }}
    {{- end }}
    {{- $name := index $parts 0 | trim }}
    {{- if not (regexMatch "^[A-Za-z0-9._-]+$" $name) }}
      {{- fail (printf "Invalid volume name %q in Volumes" $name) }}
    {{- end }}
    {{- $path := $name }}
    {{- if eq (len $parts) 2 }}
      {{- $path = index $parts 1 | trim | trimAll "/" }}
    {{- end }}
    {{- if eq $path "" }}
      {{- fail (printf "Empty mount path in volume entry %q" $entry) }}
    {{- end }}
    {{- $volumes = append $volumes (dict "name" $name "path" (printf "%s/%s" $root $path)) }}
  {{- end }}
{{- end }}
{{- if eq (len $volumes) 0 }}
  {{- fail "At least one volume has to be specified in the Volumes field." }}
{{- end }}
{{- $username := trim .Username }}
{{- $password := trim .Password }}
{{- $protocol := trim .Protocol }}

version: v4
volumes:
{{- range $i, $v := $volumes }}
  vol-{{ $i }}:
    name: "{{ $v.name }}"
{{- end }}
jobs:
  {{ $protocol }}:
    image:
      uri: {{ .Container }}
    mounts:
{{- range $i, $v := $volumes }}
      {{ $v.path }}: vol-{{ $i }}
{{- end }}

    cwd: {{ $root }}
{{- if (and $username $password) }}
    env:
      - RCLONE_USER={{ $username }}
      - RCLONE_PASS={{ $password }}
{{- else }}
  {{- fail "Username and password are required" }}
{{- end }}
    script: |
      #!/bin/sh
      cat <<__EOF__
      Access to the {{ .Protocol }} server requires port-forwarding via the CLI:
        # fuzzball workflow port-forward ${FB_WORKFLOW_ID} {{ .Protocol }} {{ .Port }}:{{ .Port }}
      In your client program of choice use 'localhost' as the host and {{ .Port }} as the port
      --------------------------------------------------------------------------------------------
      __EOF__
{{- if eq $protocol "sftp" }}
      rclone serve sftp \
        --addr localhost:{{ .Port }} \
        --cache-dir "$(mktemp -d)" \
        --log-level INFO \
        {{ $root }}
{{- else if eq $protocol "webdav" }}
      rclone serve webdav \
        --addr localhost:{{ .Port }} \
        --cache-dir "$(mktemp -d)" \
        --log-level INFO \
        {{ $root }}
{{- else }}
  {{- fail "only sftp and webdav protocols are supported" }}
{{- end }}
    resource:
      cpu:
        cores: 2
      memory:
        size: 6GiB
    policy:
      timeout:
        execute: {{ .Timeout }}
