values:
  - name: Container
    display_name: RClone container to use
    string_value: docker://rclone/rclone:1.70.3
    display_category: Container

  - name: Volumes
    display_name: |
      Comma separated list of volumes to serve. Give each persistent volume by its
      name, such as `my-data`, or use `ephemeral` for a scratch volume that is
      discarded when the workflow ends. A volume is served as `/<name>` unless you
      give it a path, like this: `my-data:/custom/path`. The leading slash is
      optional. The default serves an empty scratch volume as `/data`.
    string_value: ephemeral:data
    display_category: Storage

  - name: Protocol
    display_name: |
      Protocol to serve data with. Currently webdav and sftp are supported
    string_value: sftp
    display_category: Protocol
  - name: Port
    display_name: Server Port to serve the selected protocol on
    uint_value: 8080
    display_category: Network
  - name: Username
    display_name: Login username (environment secret)
    string_value: secret://user/RCLONE_USER
    display_category: Authentication
  - name: Password
    display_name: Login password (environment secret)
    string_value: secret://user/RCLONE_PASS
    display_category: Authentication

  - name: Timeout
    display_name: Execution timeout
    string_value: 2h
    display_category: General
