{{- $volume := trim .Volume }}
{{- if hasPrefix "volume://" (lower $volume) }}
  {{- fail "Volume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" $volume)) (contains ".." $volume) (eq $volume ".") (gt (len $volume) 255) }}
  {{- fail "Volume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
{{- $ver := .AnsysVersion }}
{{- $ansys_version_number := printf "v%s%s" (substr 2 4 $ver) (substr 5 6 $ver) }}
{{- $datamount := "/data" }}
version: v4

volumes:
  data:
    {{- if eq (lower $volume) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $volume }}"
    {{- end }}

defaults:
  job:
    mounts:
      {{ $datamount }}: data

jobs:
  xfce4:
    image:
      uri: {{.AnsysMechanicalDesktopContainerURI}}
      secret: {{.AnsysMechanicalDesktopContainerOciSecret}}
    env:
      - HOME=/tmp/home
      - ANSYSLMD_LICENSE_FILE={{.AnsyslmdLicenseFile}}
    script: |
      #!/bin/sh
      export PATH={{.AnsysInstallDir}}/{{$ansys_version_number}}/Framework/bin/Linux64:$PATH

      echo
      echo "Accessing the virtual desktop requires port-forwarding via the CLI:"
      echo
      echo "# fuzzball workflow port-forward ${FB_WORKFLOW_ID} xfce4 6080:6080"
      echo
      echo Then navigate to http://localhost:6080
      echo
      /usr/local/bin/start-vncserver.sh
    resource:
      cpu:
        cores: {{.MechanicalDesktopCores}}
        affinity: NUMA
      memory:
        size: {{.MechanicalDesktopMemory}}
    policy:
      timeout:
        execute: {{.Timeout}}
