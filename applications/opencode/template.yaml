{{- /* Every value below reaches a container env entry or the service script, so
       each is matched against what it is allowed to contain rather than checked
       for a few forbidden characters: a newline forges env entries, and '#', '$'
       or a backtick changes what the script runs. */}}

{{- /* Left empty, the endpoint is discovered at run time. */}}
{{- $endpoint := trimSuffix "/v1" (trimSuffix "/" (trim .Endpoint)) }}
{{- if and $endpoint (not (regexMatch "^https?://[A-Za-z0-9._-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$" $endpoint)) }}
  {{- fail "Endpoint must be an http(s) URL, e.g. https://endpoint-<id>.endpoints.<cluster domain>" }}
{{- end }}

{{- $gateway_api := trim .GatewayApiValue }}
{{- if not (regexMatch "^[A-Za-z0-9._/-]+$" $gateway_api) }}
  {{- fail "GatewayApiValue may contain only letters, digits, and . _ / -" }}
{{- end }}

{{- $model := trim .Model }}
{{- if and $model (not (regexMatch "^[A-Za-z0-9._:/-]+$" $model)) }}
  {{- fail "Model must name the model as the endpoint serves it, e.g. openai/gpt-oss-20b" }}
{{- end }}

{{- $context_size := int .MaxContextSize }}
{{- if lt $context_size 1024 }}
  {{- fail "MaxContextSize must be at least 1024" }}
{{- end }}
{{- $output_limit := int .OutputLimit }}
{{- if lt $output_limit 256 }}
  {{- fail "OutputLimit must be at least 256" }}
{{- end }}

{{- $auth := lower (trim .EndpointAuth) }}
{{- if not (has $auth (list "fuzzball-token" "api-key")) }}
  {{- fail "EndpointAuth must be one of: fuzzball-token, api-key" }}
{{- end }}

{{- /* The platform accepts only user-scoped value secrets in env entries. */}}
{{- $api_key_secret := trim .ApiKeySecret }}
{{- if and $api_key_secret (not (regexMatch "^secret://user/[A-Za-z0-9._-]+$" $api_key_secret)) }}
  {{- fail "ApiKeySecret must be a user-scoped secret reference, e.g. secret://user/litellm-key" }}
{{- end }}
{{- $api_key := trim .ApiKey }}
{{- if and $api_key (not (regexMatch "^[A-Za-z0-9._~+/=-]+$" $api_key)) }}
  {{- fail "ApiKey may contain only letters, digits and . _ ~ + / = -" }}
{{- end }}
{{- if and (eq $auth "api-key") (not (or $api_key_secret $api_key)) }}
  {{- fail "EndpointAuth=api-key needs ApiKeySecret or ApiKey" }}
{{- end }}
{{- /* Discovery reads the endpoints API, which an api-key run has no identity for. */}}
{{- if and (eq $auth "api-key") (not $endpoint) }}
  {{- fail "EndpointAuth=api-key needs an explicit Endpoint: only gateway discovery can find one" }}
{{- end }}

{{- $token_lifetime := int .TokenLifetime }}
{{- if lt $token_lifetime 300 }}
  {{- fail "TokenLifetime must be at least 300 seconds" }}
{{- end }}

{{- $scope := lower (trim .ServiceScope) }}
{{- if not (has $scope (list "user" "group" "organization" "public")) }}
  {{- fail "ServiceScope must be one of: user, group, organization, public" }}
{{- end }}

{{- $volume := trim .Volume }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $volume) }}
  {{- fail "Volume must be 'ephemeral' or the name of a persistent volume" }}
{{- end }}

{{- $memory := trim .Memory }}
{{- if not (regexMatch "^[0-9]+(\\.[0-9]+)?[KMGT]i?B$" $memory) }}
  {{- fail "Memory must be a size such as 8GiB" }}
{{- end }}
{{- $image := trim .Image }}
{{- if not (regexMatch "^(docker|oras)://[A-Za-z0-9._@:/-]+$" $image) }}
  {{- fail "Image must be a docker:// or oras:// container reference" }}
{{- end }}
{{- $helper_image := trim .HelperImage }}
{{- if not (regexMatch "^(docker|oras)://[A-Za-z0-9._@:/-]+$" $helper_image) }}
  {{- fail "HelperImage must be a docker:// or oras:// container reference" }}
{{- end }}

{{- $mint := eq $auth "fuzzball-token" }}

{{- $password := printf "%016x%016x" (randInt 0 9223372036854775807) (randInt 0 9223372036854775807) }}
{{- /* The server rejects every route but its icons once a password is set, and
       the readiness probe sends no credentials, so it authenticates through the
       query parameter the server checks ahead of the Authorization header. A
       probe that cannot pass aborts the whole workflow. */}}
{{- $auth_query := printf "opencode:%s" $password | b64enc }}

{{- $port := randInt 24001 32000 }}
{{- $trust_store := "/run/fuzzball-substrate/trusted-certs/root-ca.crt" }}
{{- $endpoint_dir := "/data/.fuzzball" }}
{{- $endpoint_file := printf "%s/endpoints.tsv" $endpoint_dir }}

version: v4

volumes:
  data:
    {{- if eq (lower $volume) "ephemeral" }}
    use: ephemeral
    {{- else }}
    use: persistent
    name: "{{ $volume }}"
    {{- end }}

jobs:
  discover-endpoint:
    image:
      uri: {{ $helper_image }}
    mounts:
      /data:
        volume: data
    env:
      {{- if $endpoint }}
      - FIXED_ENDPOINT={{ $endpoint }}
      {{- end }}
      - GATEWAY_API_VALUE={{ $gateway_api }}
      - ENDPOINT_FILE={{ $endpoint_file }}
      {{- if $mint }}
      - NEED_ENDPOINT_ID=1
      {{- end }}
    script: |
      #!/bin/sh
      set -e
      mkdir -p {{ $endpoint_dir }}

      # The endpoints API may be private-CA; add the cluster root to the public ones.
      bundle=/tmp/ca-bundle.pem
      cat /etc/ssl/certs/ca-certificates.crt > "${bundle}"
      if [ -f {{ $trust_store }} ]; then
        cat {{ $trust_store }} >> "${bundle}"
      fi
      SSL_CERT_FILE="${bundle}"
      export SSL_CERT_FILE

      cat > /tmp/discover.py <<'PYEOF'
      import json, os, sys, urllib.error, urllib.parse, urllib.request

      API = (os.environ.get("FB_OPENAPI_URL") or "").rstrip("/")
      TOKEN = os.environ.get("FB_TOKEN", "")
      OWN = os.environ.get("FB_WORKFLOW_ID", "")
      FIXED = os.environ.get("FIXED_ENDPOINT", "").rstrip("/")
      WANT = os.environ["GATEWAY_API_VALUE"]
      NEED_ID = os.environ.get("NEED_ENDPOINT_ID") == "1"
      OUT = os.environ["ENDPOINT_FILE"]
      ANNOTATION = "ciq.com/api"


      def fail(msg):
          sys.stderr.write("FATAL: " + msg + "\n")
          raise SystemExit(1)


      def call(url):
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + TOKEN})
          with urllib.request.urlopen(req, timeout=30) as resp:
              raw = resp.read().decode("utf-8")
          return json.loads(raw) if raw else {}


      def endpoints():
          # Every page or none: a truncated walk is indistinguishable from the
          # gateway having disappeared, and would pick an arbitrary one instead.
          rows = []
          page = ""
          for _ in range(100):
              url = API + "/v4/endpoints?pageSize=500"
              if page:
                  url = url + "&pageToken=" + urllib.parse.quote(page, safe="")
              body = call(url)
              rows.extend(body.get("endpoints") or [])
              page = body.get("pageToken") or ""
              if not page:
                  return rows
          fail("endpoint listing did not terminate after 100 pages")


      def resolve():
          # Every visible gateway, not one: several models running at once is the
          # normal case, and each becomes a provider the client can switch between.
          if FIXED and not NEED_ID:
              return [(FIXED, "")]
          if not (API and TOKEN):
              fail("no workflow API token was injected, so the endpoints API cannot be "
                   "read; set Endpoint with EndpointAuth=api-key instead")
          try:
              rows = endpoints()
          except urllib.error.HTTPError as err:
              fail("the endpoints API returned HTTP %d" % err.code)
          except Exception as err:
              fail("could not read the endpoints API: %s" % err)
          if FIXED:
              for row in rows:
                  if (row.get("url") or "").rstrip("/") == FIXED:
                      if not row.get("id"):
                          fail("the endpoint at " + FIXED + " has no id to mint against")
                      return [(FIXED, row["id"])]
              fail(FIXED + " is not an endpoint this workflow can reach; set "
                   "EndpointAuth=api-key to treat it as an external API")
          found = [row for row in rows
                   if (row.get("annotations") or {}).get(ANNOTATION) == WANT
                   and row.get("workflowId") != OWN
                   and row.get("url")]
          if not found:
              fail("no endpoint annotated " + ANNOTATION + "=" + WANT + " is visible to "
                   "this workflow; start a model workflow, or set Endpoint explicitly")
          resolved = []
          for row in found:
              if NEED_ID and not row.get("id"):
                  fail("the endpoint at " + (row.get("url") or "?") +
                       " has no id to mint against")
              resolved.append(((row.get("url") or "").rstrip("/"), row.get("id") or ""))
          # Sorted so the provider order a client sees does not depend on the
          # order the API happened to return.
          return sorted(set(resolved))


      found = resolve()
      with open(OUT, "w") as handle:
          for url, endpoint_id in found:
              handle.write("%s\t%s\n" % (endpoint_id, url))
      for url, _ in found:
          print("endpoint: " + url)
      PYEOF
      exec python3 /tmp/discover.py
    resource:
      cpu:
        cores: 1
      memory:
        size: 256MB
    policy:
      timeout:
        execute: 5m

  show-server:
    image:
      uri: {{ $helper_image }}
    mounts:
      /data:
        volume: data
    depends-on:
      - name: opencode
        status: RUNNING
        description: "Print connection details once the server is running"
    script: |
      #!/bin/sh
      first_id=$(head -n 1 {{ $endpoint_file }} | cut -f1)
      first_url=$(head -n 1 {{ $endpoint_file }} | cut -f2)
      echo "Get the server URL with:"
      echo "   fuzzball workflow endpoints list"
      echo ""
      echo "The server enforces this password on every request:"
      echo "   {{ $password }}"
      echo ""
      echo "It travels in the Authorization header, which the endpoint proxy"
      echo "consumes at every scope but public, so through the endpoint URL send"
      echo "it as a query parameter instead:"
      echo "   <server url>/api/session?auth_token={{ $auth_query }}"
      echo ""
      {{- if eq $scope "public" }}
      echo "This endpoint is public, so the password is the only barrier. A"
      echo "browser prompts for it (user 'opencode'), and a local client attaches:"
      echo "   opencode attach <server url> -p {{ $password }}"
      {{- else }}
      echo "Requests also need a Fuzzball credential in the Authorization header:"
      echo "   fuzzball workflow endpoints generate-token <endpoint id>"
      echo ""
      echo "The bundled web application cannot be used at this scope: its own"
      echo "requests carry no query parameter and the proxy has taken the header."
      echo "Use ServiceScope=public for the web application or 'opencode attach'."
      {{- end }}
      echo ""
      echo "Models: the server registered every model the endpoint listed when it"
      {{- if $model }}
      echo "started, with fuzzball/{{ $model }} as the default. Switch with /models in"
      {{- else }}
      echo "started, the first of them as the default. Switch with /models in"
      {{- end }}
      echo "the client. The opencode service log names them, one provider per"
      echo "endpoint it found. A model an endpoint gains later needs a restart of"
      echo "this workflow. What the first endpoint serves right now:"
      {{- if $mint }}
      echo "   fuzzball workflow endpoints generate-token ${first_id}"
      echo "   curl -H \"Authorization: Bearer <that token>\" \\"
      {{- if or $api_key_secret $api_key }}
      echo "        -H \"x-litellm-api-key: <your model API key>\" \\"
      {{- end }}
      echo "        ${first_url}/v1/models"
      {{- else }}
      echo "   curl -H \"Authorization: Bearer <your model API key>\" ${first_url}/v1/models"
      {{- end }}
    resource:
      cpu:
        cores: 1
      memory:
        size: 128MB
    policy:
      timeout:
        execute: 10m

services:
  opencode:
    image:
      uri: {{ $image }}
    depends-on:
      - name: discover-endpoint
        status: FINISHED
        description: "Resolve the model endpoint before the server configures itself"
    mounts:
      /data:
        volume: data
    env:
      # The image runs as a different uid under Fuzzball, so every writable path
      # OpenCode uses is redirected onto the volume. HOME is the volume root
      # rather than a directory beside the workspace: the web application's
      # project browser is rooted at HOME, and a workspace outside that tree
      # cannot be opened at all.
      - HOME=/data
      - XDG_CONFIG_HOME=/data/.config
      - XDG_DATA_HOME=/data/.local/share
      - XDG_CACHE_HOME=/data/.cache
      - XDG_STATE_HOME=/data/.local/state
      - OPENCODE_CONFIG=/data/.config/opencode.json
      # Set at every scope: a plain service also binds its port on the node it
      # runs on, where no endpoint proxy stands in front of it.
      - OPENCODE_SERVER_PASSWORD={{ $password }}
      {{- if $api_key_secret }}
      - MODEL_API_KEY={{ $api_key_secret }}
      {{- else if $api_key }}
      - MODEL_API_KEY={{ $api_key }}
      {{- end }}
    script: |
      #!/bin/sh
      set -e
      mkdir -p /data/workspace /data/.config

      if [ ! -s {{ $endpoint_file }} ]; then
        echo "FATAL: discover-endpoint wrote no endpoints" >&2
        exit 1
      fi
      endpoint_count=$(wc -l < {{ $endpoint_file }})

      # Both TLS stacks here need the cluster CA added to the public roots, not
      # substituted for them: this endpoint may be private-CA while the model
      # endpoint or a provider is public. The image's own bundle is read-only to
      # this uid, so the merged copy lives in /tmp. busybox wget reads
      # SSL_CERT_FILE; the Bun runtime reads NODE_EXTRA_CA_CERTS and ignores
      # SSL_CERT_DIR.
      bundle=/tmp/ca-bundle.pem
      cat /etc/ssl/certs/ca-certificates.crt > "${bundle}"
      if [ -f {{ $trust_store }} ]; then
        cat {{ $trust_store }} >> "${bundle}"
      fi
      SSL_CERT_FILE="${bundle}"
      NODE_EXTRA_CA_CERTS="${bundle}"
      export SSL_CERT_FILE NODE_EXTRA_CA_CERTS
      {{- if $mint }}
      if [ -z "${FB_TOKEN}" ]; then
        echo "FATAL: no workflow API token was injected, so no endpoint token can be" >&2
        echo "minted. Use EndpointAuth=api-key with a key for the endpoint." >&2
        exit 1
      fi
      {{- end }}

      # One provider per discovered gateway: each has its own base URL and
      # credential, so they cannot be collapsed. A gateway that fails here is
      # skipped rather than fatal, since the others are still usable.
      umask 077
      resolved=/tmp/providers.tsv
      : > "${resolved}"
      index=0
      while IFS="$(printf '\t')" read -r endpoint_id endpoint_url; do
        [ -n "${endpoint_url}" ] || continue
        index=$((index + 1))
        if [ "${endpoint_count}" -eq 1 ]; then
          provider="fuzzball"
        else
          provider="fuzzball-${index}"
        fi
        {{- if $mint }}

        if [ -z "${endpoint_id}" ]; then
          echo "WARNING: ${endpoint_url} has no endpoint id to mint against; skipping it" >&2
          continue
        fi
        minted=$(wget -nv -O - \
          --header="Authorization: Bearer ${FB_TOKEN}" \
          --header="Content-Type: application/json" \
          --post-data="{\"expirationSeconds\": {{ $token_lifetime }}}" \
          "${FB_OPENAPI_URL%/}/v4/endpoints/${endpoint_id}/token" 2> /tmp/mint.err) || {
          echo "WARNING: could not mint an access token for ${endpoint_id}; skipping it" >&2
          cat /tmp/mint.err >&2
          continue
        }
        credential=$(echo "${minted}" | tr -d ' \n' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        if [ -z "${credential}" ]; then
          echo "WARNING: no token in the mint response for ${endpoint_id}; skipping it" >&2
          continue
        fi
        {{- else }}

        credential="${MODEL_API_KEY}"
        {{- end }}

        # The endpoint decides which models exist: every model it lists is
        # registered and Model only picks the default. Asking now also surfaces a
        # rejected credential here rather than at the user's first prompt, since
        # the readiness probe never reaches the model endpoint.
        listed=""
        if body=$(wget -nv -O - \
          --header="Authorization: Bearer ${credential}" \
        {{- if and $mint (or $api_key_secret $api_key) }}
          --header="x-litellm-api-key: ${MODEL_API_KEY}" \
        {{- end }}
          "${endpoint_url}/v1/models" 2> /tmp/probe.err); then
          # Only ids that sit next to "object":"model" are models: vLLM's cards
          # also carry permission entries with ids of their own.
          listed=$(printf '%s' "${body}" | tr -d '\n\r\t' \
            | grep -o '"id" *: *"[^"]*" *, *"object" *: *"model"' \
            | sed -e 's/^"id" *: *"//' -e 's/" *, *"object".*$//' || true)
          if [ -z "${listed}" ]; then
            echo "WARNING: ${endpoint_url} answered /v1/models but listed no models" >&2
          fi
        elif grep -q "40[13]" /tmp/probe.err; then
          echo "WARNING: ${endpoint_url} rejected these credentials; skipping it" >&2
          cat /tmp/probe.err >&2
          continue
        else
          echo "WARNING: ${endpoint_url} did not answer /v1/models" >&2
          cat /tmp/probe.err >&2
        fi

        models=""
        for id in ${listed}; do
          case "${id}" in
            *[!A-Za-z0-9._:/-]*)
              echo "WARNING: ignoring a model id with unexpected characters: ${id}" >&2
              continue
              ;;
          esac
          case " ${models} " in
            *" ${id} "*) continue ;;
          esac
          models="${models}${models:+ }${id}"
        done
        printf '%s\t%s\t%s\t%s\n' "${provider}" "${endpoint_url}" "${credential}" "${models}" >> "${resolved}"
      done < {{ $endpoint_file }}
      {{- if $mint }}
      # The agent runs arbitrary shell: leave it no workflow API credential.
      unset FB_TOKEN FB_OPENAPI_URL
      {{- end }}

      if [ ! -s "${resolved}" ]; then
        echo "FATAL: none of the discovered endpoints could be reached" >&2
        exit 1
      fi

      # Model names the default. Whichever provider serves it wins; if none
      # lists it, it is registered on the first provider anyway, since an
      # endpoint may serve a model it does not advertise.
      default_model="{{ $model }}"
      default_provider=""
      first_provider=$(head -n 1 "${resolved}" | cut -f1)
      while IFS="$(printf '\t')" read -r provider url credential models; do
        for id in ${models}; do
          if [ -z "${default_model}" ]; then
            default_model="${id}"
            default_provider="${provider}"
          elif [ "${id}" = "${default_model}" ] && [ -z "${default_provider}" ]; then
            default_provider="${provider}"
          fi
        done
      done < "${resolved}"
      if [ -z "${default_model}" ]; then
        echo "FATAL: no endpoint listed a model and Model is empty; set Model to a name an endpoint serves" >&2
        exit 1
      fi
      [ -n "${default_provider}" ] || default_provider="${first_provider}"

      providers_json=""
      while IFS="$(printf '\t')" read -r provider url credential models; do
        if [ "${provider}" = "${default_provider}" ]; then
          case " ${models} " in
            *" ${default_model} "*) ;;
            *) models="${models}${models:+ }${default_model}" ;;
          esac
        fi
        echo "Models registered from ${url} as ${provider}: ${models}"
        models_json=""
        for id in ${models}; do
          entry="\"${id}\": { \"name\": \"${id} on Fuzzball\", \"limit\": { \"context\": {{ $context_size }}, \"output\": {{ $output_limit }} } }"
          models_json="${models_json}${models_json:+, }${entry}"
        done
        headers=""
      {{- if and $mint (or $api_key_secret $api_key) }}
        headers=",\"headers\": { \"x-litellm-api-key\": \"${MODEL_API_KEY}\" }"
      {{- end }}
        entry="\"${provider}\": { \"npm\": \"@ai-sdk/openai-compatible\", \"name\": \"Fuzzball (${url})\", \"options\": { \"baseURL\": \"${url}/v1\", \"apiKey\": \"${credential}\"${headers} }, \"models\": { ${models_json} } }"
        providers_json="${providers_json}${providers_json:+, }${entry}"
      done < "${resolved}"
      rm -f "${resolved}"
      echo "Default model: ${default_provider}/${default_model}"

      cat > /data/.config/opencode.json <<EOF
      {
        "\$schema": "https://opencode.ai/config.json",
        "provider": { ${providers_json} },
        "model": "${default_provider}/${default_model}"
      }
      EOF

      cd /data/workspace
      exec opencode serve --hostname 0.0.0.0 --port {{ $port }} --print-logs
    network:
      ports:
        - name: http
          port: {{ $port }}
          protocol: tcp
      endpoints:
        - name: server
          port-name: http
          protocol: http
          type: subdomain
          scope: {{ $scope }}
    readiness-probe:
      http-get:
        # Names a real route because the icon allowlist aside, every path needs
        # the credential; the query parameter carries it, as the probe sends no
        # headers of its own. The endpoint URL exists before this passes, so it
        # refuses connections for the first cycles, and failure-threshold x
        # period-seconds is a hard deadline: exceeding it aborts the workflow.
        path: /global/health?auth_token={{ $auth_query }}
        port: {{ $port }}
        scheme: HTTP
      initial-delay-seconds: 10
      period-seconds: 10
      timeout-seconds: 5
      failure-threshold: 30
      success-threshold: 1
    resource:
      cpu:
        cores: {{ .Cores }}
      memory:
        size: {{ $memory }}
    persist: true
