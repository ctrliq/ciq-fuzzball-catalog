values:
  - name: "CESMContainer"
    display_name: "CESM container image (CESM + CIME)"
    string_value: "docker://escomp/cesm-lab-2.2"
    display_category: "Container"
  - name: "AnimationContainer"
    display_name: "Animation container image (xarray, cartopy, ffmpeg)"
    string_value: "docker://pangeo/pangeo-notebook:2026.04.29"
    display_category: "Container"
  - name: "CaseName"
    display_name: "Case name (used for directory and file prefixes)"
    string_value: "f2000.workshop.001"
    display_category: "Case"
  - name: "Compset"
    display_name: "CESM component set (e.g. F2000climo, FHIST, B1850, QPC6)"
    string_value: "F2000climo"
    display_category: "Case"
  - name: "Resolution"
    display_name: "Grid resolution (e.g. f19_g17, f09_g17, T42_T42)"
    string_value: "f19_g17"
    display_category: "Case"
  - name: "StopOption"
    display_name: "Run length units (ndays, nmonths, nyears, nsteps)"
    string_value: "nmonths"
    display_category: "Case"
  - name: "StopN"
    display_name: "Number of run length units to simulate"
    uint_value: 1
    display_category: "Case"
  - name: "UseInlineAnimationScript"
    display_name: "Use the built-in animation script (uncheck to supply your own URL)"
    bool_value: true
    display_category: "Animation"
  - name: "AnimationScriptURL"
    display_name: "URL to a custom animate_cesm.py (only used if inline script is disabled)"
    string_value: ""
    display_category: "Animation"
  - name: "VolumeReference"
    display_name: "Workspace volume reference. Defaults to ephemeral; supply a persistent volume to cache inputdata between runs."
    string_value: "volume://user/ephemeral"
    display_category: "Storage"
  - name: "VideoDestination"
    display_name: "S3 URI for the MP4 (e.g. s3://my-bucket/cesm/output.mp4); leave blank to skip MP4 upload AND visualize job"
    string_value: ""
    display_category: "Storage"
  - name: "VideoOutputName"
    display_name: "Filename for the MP4 produced inside the volume"
    string_value: "cesm_animation.mp4"
    display_category: "Storage"
  - name: "GifDestination"
    display_name: "S3 URI for the GIF (optional)"
    string_value: ""
    display_category: "Storage"
  - name: "GifOutputName"
    display_name: "Filename for the GIF produced inside the volume"
    string_value: "cesm_animation.gif"
    display_category: "Storage"
  - name: "S3Secret"
    display_name: "Secret reference for S3 credentials (e.g. secret://user/s3_secret)"
    string_value: ""
    display_category: "Storage"
  - name: "PrefetchCores"
    display_name: "Cores for the prefetch (build + inputdata download) job"
    uint_value: 8
    display_category: "Resources"
  - name: "PrefetchMemory"
    display_name: "Memory for the prefetch job"
    string_value: "8GB"
    display_category: "Resources"
  - name: "PrefetchTimeout"
    display_name: "Timeout for the prefetch job (first run downloads 5-15 GB)"
    string_value: "2h0m0s"
    display_category: "Timeouts"
  - name: "SimCores"
    display_name: "Cores (= MPI ranks) for the main CESM simulation"
    uint_value: 12
    display_category: "Resources"
  - name: "SimMemory"
    display_name: "Memory for the main CESM simulation"
    string_value: "24GB"
    display_category: "Resources"
  - name: "SimTimeout"
    display_name: "Timeout for the main CESM simulation"
    string_value: "6h0m0s"
    display_category: "Timeouts"
  - name: "AnimationCores"
    display_name: "Cores for the visualization job"
    uint_value: 2
    display_category: "Resources"
  - name: "AnimationMemory"
    display_name: "Memory for the visualization job"
    string_value: "6GB"
    display_category: "Resources"
  - name: "AnimationTimeout"
    display_name: "Timeout for the visualization job"
    string_value: "30m0s"
    display_category: "Timeouts"