version: v4
jobs:
  mpi-hello-world:
    env:
      - PATH=/usr/lib64/{{.MpiFlavor}}/bin:/usr/local/bin:/usr/bin:/bin
    image:
      uri: oras://docker.io/anderbubble/{{.MpiFlavor}}-hello-world.sif
    script: |
      #!/bin/sh
      mpi_hello_world
    resource:
      cpu:
        cores: {{.Cores}}
        affinity: NUMA
      memory:
        size: 1GB
    multinode:
      nodes: {{.Nodes}}
      implementation: {{.MpiFlavor}}
