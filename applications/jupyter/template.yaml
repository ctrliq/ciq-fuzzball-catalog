{{- $mount := "/data" }}
{{- $port := (randInt 10000 30000) }}
{{- $volume := trim .DataVolume }}
{{- if hasPrefix "volume://" (lower $volume) }}
  {{- fail "DataVolume no longer takes a volume:// URI -- use 'ephemeral' or the name of a persistent volume" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" $volume)) (contains ".." $volume) (eq $volume ".") (gt (len $volume) 255) }}
  {{- fail "DataVolume must be 'ephemeral' or the name of a persistent volume (up to 255 letters, digits, '.', '_' or '-')" }}
{{- end }}
{{- $container_type := default "r" (trim .Type) }}

version: v4

volumes:
  data:
    {{- if eq (lower $volume) "ephemeral" }}
    use: ephemeral
    {{- else }}
    name: "{{ $volume }}"
    {{- end }}

services:
  jupyter:
    persist: true
    network:
      ports:
        - name: web
          port: {{ $port }}
          protocol: tcp
      endpoints:
        - name: jupyter
          type: path
          port-name: web
          protocol: http
          scope: {{ .ServiceScope }}
    readiness-probe:
      exec:
        command:
          - /bin/sh
          - '-c'
          - jupyter server list &> /dev/null
      period-seconds: 5
      timeout-seconds: 5
      initial-delay-seconds: 10
    image:
      uri: docker://quay.io/jupyter/{{ $container_type }}-notebook:2026-06-05
    resource:
      cpu:
        cores: {{ .Cores }}
      memory:
        size: {{ .Memory }}
      {{- if gt (.GPUs | int) 0 }}
      devices:
        nvidia.com/gpu: {{ .GPUs }}
      {{- end }}
      exclusive: {{ .Exclusive }}
    mounts:
      {{ $mount }}:
        volume: data
    env:
      - NB_USER=jovyan
      - HOME=/home/jovyan
    script: |
      #!/bin/bash
      set -e
      mkdir -p "${HOME}/.jupyter"
      cat <<__EOF__ > "${HOME}/.jupyter/jupyter_server_config.py"
      c = get_config()
      c.ServerApp.ip = "0.0.0.0"
      c.ServerApp.port = {{ $port }}
      c.ServerApp.open_browser = False
      c.IdentityProvider.token = ""
      c.PasswordIdentityProvider.password_required = False
      c.ServerApp.root_dir = "{{ $mount }}"
      c.ServerApp.allow_credentials = False
      c.ServerApp.default_url = '/lab'
      c.ServerApp.base_url = "${FB_ENDPOINT_PATH_JUPYTER}"
      c.Application.log_level = "INFO"
      __EOF__

      /opt/conda/bin/jupyter server
