{{- /* Every value below reaches a container env entry or the service script, so
       each is matched against what it is allowed to contain rather than checked
       for a few forbidden characters: a newline forges env entries, and '#', '$'
       or a backtick changes what the script runs. */}}

{{- $endpoint := trimSuffix "/" (trim .Endpoint) }}
{{- if and $endpoint (not (regexMatch "^https?://[A-Za-z0-9._-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$" $endpoint)) }}
  {{- fail "Endpoint must be an http(s) URL, e.g. https://endpoint-<id>.endpoints.<cluster domain>" }}
{{- end }}

{{- $gateway_api := trim .GatewayApiValue }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $gateway_api) }}
  {{- fail "GatewayApiValue may contain only letters, digits, '.', '_' and '-'" }}
{{- end }}

{{- $model := trim .Model }}
{{- if and $model (not (regexMatch "^[A-Za-z0-9._:/-]+$" $model)) }}
  {{- fail "Model must name the model as the gateway serves it, e.g. openai/gpt-oss-20b" }}
{{- end }}

{{- $context_size := int .MaxContextSize }}
{{- if lt $context_size 1024 }}
  {{- fail "MaxContextSize must be at least 1024" }}
{{- end }}

{{- $auth := lower (trim .EndpointAuth) }}
{{- if not (has $auth (list "fuzzball-token" "api-key")) }}
  {{- fail "EndpointAuth must be one of: fuzzball-token, api-key" }}
{{- end }}

{{- $api_key_secret := trim .ApiKeySecret }}
{{- if and $api_key_secret (not (regexMatch "^secret://[A-Za-z0-9._/-]+$" $api_key_secret)) }}
  {{- fail "ApiKeySecret must be a secret:// reference, e.g. secret://user/litellm-key" }}
{{- end }}
{{- $api_key := trim .ApiKey }}
{{- if and $api_key (not (regexMatch "^[A-Za-z0-9._-]+$" $api_key)) }}
  {{- fail "ApiKey may contain only letters, digits, '.', '_' and '-'" }}
{{- end }}
{{- if and (eq $auth "api-key") (not (or $api_key_secret $api_key)) }}
  {{- fail "EndpointAuth=api-key needs ApiKeySecret or ApiKey" }}
{{- end }}

{{- /* Discovery needs the endpoints API, which needs this workflow's own
       identity. An explicit third-party Endpoint is the only case where the
       agent can attach without it. */}}
{{- if and (eq $auth "api-key") (not $endpoint) }}
  {{- fail "EndpointAuth=api-key needs an explicit Endpoint: gateway discovery mints its own credentials" }}
{{- end }}

{{- $token_lifetime := int .TokenLifetime }}
{{- if lt $token_lifetime 300 }}
  {{- fail "TokenLifetime must be at least 300 seconds" }}
{{- end }}
{{- $attach_interval := int .AttachInterval }}
{{- if lt $attach_interval 10 }}
  {{- fail "AttachInterval must be at least 10 seconds" }}
{{- end }}

{{- $scope := lower (trim .ServiceScope) }}
{{- if not (has $scope (list "user" "group" "organization")) }}
  {{- fail "ServiceScope must be one of: user, group, organization" }}
{{- end }}

{{- $volume := trim .Volume }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $volume) }}
  {{- fail "Volume must be 'ephemeral' or the name of a persistent volume" }}
{{- end }}

{{- $memory := trim .Memory }}
{{- if not (regexMatch "^[0-9]+(\\.[0-9]+)?[KMGT]i?B$" $memory) }}
  {{- fail "Memory must be a size such as 8GiB" }}
{{- end }}
{{- $image := trim .Image }}
{{- if not (regexMatch "^(docker|oras)://[A-Za-z0-9._@:/-]+$" $image) }}
  {{- fail "Image must be a docker:// or oras:// container reference" }}
{{- end }}
{{- $curl_image := trim .CurlImage }}
{{- if not (regexMatch "^(docker|oras)://[A-Za-z0-9._@:/-]+$" $curl_image) }}
  {{- fail "CurlImage must be a docker:// or oras:// container reference" }}
{{- end }}

{{- $mint := eq $auth "fuzzball-token" }}
{{- /* A LiteLLM gateway always enforces a key, and its own is the only thing
       this workflow cannot work out for itself. Caught here rather than as a
       401 several minutes into startup. */}}
{{- if and $mint (not (or $api_key_secret $api_key)) }}
  {{- fail "A gateway key is required: set ApiKeySecret (preferred) or ApiKey" }}
{{- end }}

{{- /* Both credentials are generated at submit time and live in the rendered
       definition; the show-agent job prints them. slim-sprig has no
       randAlphaNum, so they are built as hex from 63-bit randInt draws. */}}
{{- $dashboard_password := printf "%016x%016x" (randInt 0 9223372036854775807) (randInt 0 9223372036854775807) }}
{{- $dashboard_secret := printf "%016x%016x" (randInt 0 9223372036854775807) (randInt 0 9223372036854775807) }}
{{- $api_server_key := printf "sk-%016x%016x" (randInt 0 9223372036854775807) (randInt 0 9223372036854775807) }}

{{- $dashboard_port := randInt 24001 28000 }}
{{- $api_port := randInt 28001 32000 }}

{{- /* How long the first attach keeps retrying before the service gives up.
       A gateway whose model pool is still starting is the common case, and it
       resolves in well under this. */}}
{{- $bootstrap_window := 300 }}

{{- $data := "/opt/data" }}
{{- $runtime := "/tmp/fuzzball" }}
{{- $credential := "/tmp/fuzzball/credential.json" }}
{{- $ca_bundle := "/tmp/fuzzball/ca-bundle.pem" }}
{{- $trust_store := "/run/fuzzball-substrate/trusted-certs" }}

version: v4

volumes:
  data:
    {{- if eq (lower $volume) "ephemeral" }}
    use: ephemeral
    {{- else }}
    use: persistent
    name: "{{ $volume }}"
    {{- end }}

jobs:
  show-agent:
    image:
      uri: {{ $curl_image }}
    depends-on:
      - name: hermes
        status: RUNNING
        description: "Print connection details once the agent is running"
    script: |
      #!/bin/sh
      echo "Get the dashboard and API URLs with:"
      echo "   fuzzball workflow endpoints list"
      echo ""
      echo "Dashboard sign-in (also in the definition: fuzzball workflow get <workflow id>):"
      echo "   username: hermes"
      echo "   password: {{ $dashboard_password }}"
      echo ""
      echo "API key for the agent's own OpenAI-compatible API:"
      echo "   {{ $api_server_key }}"
      {{- if .ExposeApiServer }}
      echo ""
      echo "Point an OpenAI client at the api endpoint with that key as the bearer"
      echo "token, or connect Hermes Desktop to it by setting its Gateway URL to"
      echo "the dashboard endpoint URL."
      {{- else }}
      echo ""
      echo "ExposeApiServer is off, so no endpoint fronts that API -- but it still"
      echo "listens on this node's port {{ $api_port }}, and the key above is what"
      echo "protects it."
      {{- end }}
      echo ""
      echo "The endpoint scope is {{ $scope }}, so requests through either endpoint URL"
      echo "also need a Fuzzball credential in the Authorization header:"
      echo "   fuzzball workflow endpoints generate-token <endpoint id>"
      echo ""
      echo "That header is consumed by the endpoint proxy, so a non-browser client"
      echo "outside the cluster network cannot send both credentials at once."
      echo ""
      echo "Watch the agent attach to its gateway with:"
      echo "   fuzzball workflow log <workflow id> hermes"
      echo "A pass logs ATTACHED with the gateway and model it settled on."
      echo ""
      echo "The agent runs until the workflow is cancelled."
    resource:
      cpu:
        cores: 1
      memory:
        size: 128MB
    policy:
      timeout:
        execute: 10m

services:
  hermes:
    image:
      uri: {{ $image }}
    mounts:
      {{ $data }}:
        volume: data
    env:
      # Everything Hermes writes -- config, sessions, memories, learned skills --
      # belongs on the volume; the installed tree under /opt/hermes is immutable.
      # The image already sets this, but the attach pass derives config.yaml's
      # location from it, so it is pinned here rather than assumed.
      - HERMES_HOME={{ $data }}
      # The image expects to run as its own baked user, whose home and caches
      # are outside the volume and unwritable to the uid Fuzzball actually
      # provides. Every writable path is redirected onto the volume instead.
      - HOME={{ $data }}/home
      - XDG_CONFIG_HOME={{ $data }}/.config
      - XDG_DATA_HOME={{ $data }}/.local/share
      - XDG_CACHE_HOME={{ $data }}/.cache
      - XDG_STATE_HOME={{ $data }}/.local/state
      # Read by the dashboard process itself, unlike HERMES_DASHBOARD and its
      # HOST/PORT companions, which only the image's s6 service definition reads.
      # A non-loopback bind fails closed without one of these providers, and the
      # endpoint scope cannot stand in for it: the service also listens on its
      # node's port, with no proxy in front of it.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=hermes
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD={{ $dashboard_password }}
      # Without a fixed signing key every restart invalidates dashboard sessions.
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET={{ $dashboard_secret }}
      # Always on, whatever ExposeApiServer says: a bound port with an unprinted
      # key would be a credential nobody can rotate. ExposeApiServer decides only
      # whether an endpoint is published in front of it.
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT={{ $api_port }}
      - API_SERVER_KEY={{ $api_server_key }}
      {{- if $endpoint }}
      - GATEWAY_ENDPOINT={{ $endpoint }}
      {{- end }}
      - GATEWAY_API_VALUE={{ $gateway_api }}
      {{- if $model }}
      - GATEWAY_MODEL={{ $model }}
      {{- end }}
      - GATEWAY_CONTEXT={{ $context_size }}
      - GATEWAY_MINT={{ $mint }}
      - TOKEN_LIFETIME={{ $token_lifetime }}
      - ATTACH_INTERVAL={{ $attach_interval }}
      - BOOTSTRAP_WINDOW={{ $bootstrap_window }}
      - FB_RUNTIME={{ $runtime }}
      {{- if $api_key_secret }}
      - MODEL_API_KEY={{ $api_key_secret }}
      {{- else if $api_key }}
      - MODEL_API_KEY={{ $api_key }}
      {{- end }}
    script: |
      #!/bin/bash
      set -e

      # Before the mkdir: the minted credential lives under $runtime.
      umask 077
      mkdir -p {{ $runtime }}

      # The state tree the image's own bootstrap would have created. That
      # bootstrap is skipped entirely here (see the exec at the end of this
      # script), and it is almost all chown repair for the case where the
      # container starts as root and drops to another user -- which is not what
      # happens under Fuzzball, where one uid owns the whole run.
      for dir in "" /home /.config /.cache /.local/share /.local/state \
                 /cron /sessions /logs /logs/gateways /hooks /memories /skills \
                 /skins /plans /workspace /profiles /pairing /platforms/pairing \
                 /lazy-packages; do
        mkdir -p "{{ $data }}${dir}"
      done
      # Hermes tightens this itself on every start; create it so the gateway
      # does not have to seed a file on a volume it may not be able to write.
      [ -e {{ $data }}/.env ] || : > {{ $data }}/.env

      # Fuzzball bind-mounts the cluster CA and sets SSL_CERT_DIR, but OpenSSL's
      # directory lookup needs hash-named entries, so Python misses it. Merge the
      # mounted certificates with the bundled public roots: reaching the Fuzzball
      # API and reaching a public model provider both have to keep working.
      if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
        cp /etc/ssl/certs/ca-certificates.crt {{ $ca_bundle }}
      elif [ -f /etc/ssl/cert.pem ]; then
        cp /etc/ssl/cert.pem {{ $ca_bundle }}
      else
        echo "FATAL: no system CA bundle found in the agent image" >&2
        exit 1
      fi
      for cert in {{ $trust_store }}/*.crt; do
        [ -f "${cert}" ] || continue
        cat "${cert}" >> {{ $ca_bundle }}
        echo >> {{ $ca_bundle }}
      done
      export SSL_CERT_FILE={{ $ca_bundle }}

      # The bundled interpreter, not the distribution one: it is the only one
      # with the YAML support the attach pass needs to edit config.yaml in place.
      HERMES_PY=/opt/hermes/.venv/bin/python
      HERMES_BIN=/opt/hermes/.venv/bin/hermes
      for required in "${HERMES_PY}" "${HERMES_BIN}"; do
        if [ ! -x "${required}" ]; then
          echo "FATAL: ${required} is missing; this is not the expected Hermes image" >&2
          exit 1
        fi
      done

      cat > {{ $runtime }}/attach.py <<'PYEOF'
      # Keeps Hermes pointed at a live gateway with a credential that has not
      # expired. Hermes itself holds no Fuzzball identity, so this pass owns
      # both halves: it discovers which endpoint is the gateway, and it keeps
      # the credential file fresh for the provider's key_cmd to read.
      import datetime, json, os, ssl, sys, time, urllib.error, urllib.request

      import yaml

      API = (os.environ.get("FB_OPENAPI_URL") or "").rstrip("/")
      OWN_WORKFLOW = os.environ.get("FB_WORKFLOW_ID", "")
      FIXED = os.environ.get("GATEWAY_ENDPOINT", "").rstrip("/")
      WANT_API = os.environ["GATEWAY_API_VALUE"]
      WANT_MODEL = os.environ.get("GATEWAY_MODEL", "")
      CONTEXT = int(os.environ["GATEWAY_CONTEXT"])
      MINT = os.environ["GATEWAY_MINT"] == "true"
      TTL = int(os.environ["TOKEN_LIFETIME"])
      INTERVAL = int(os.environ["ATTACH_INTERVAL"])
      BOOTSTRAP = int(os.environ["BOOTSTRAP_WINDOW"])
      LLM_KEY = os.environ.get("MODEL_API_KEY", "")
      RUNTIME = os.environ["FB_RUNTIME"]
      # Hermes resolves config.yaml from HERMES_HOME and offers no override, so
      # this is derived rather than passed in: a path handed over separately
      # would go stale the moment HERMES_HOME moved, and nothing would say so.
      CONFIG = os.path.join(os.environ["HERMES_HOME"], "config.yaml")
      CREDENTIAL = os.path.join(RUNTIME, "credential.json")
      WORKFLOW_TOKEN = os.path.join(RUNTIME, "workflow-token.json")
      CA = os.environ.get("SSL_CERT_FILE") or None
      API_ANNOTATION = "ciq.com/api"
      PROVIDER = "fuzzball"
      RENEW_AFTER = 4 * 24 * 3600

      CTX = ssl.create_default_context(cafile=CA)

      def load_workflow_token():
          # The injected token expires after seven days and this pass restarts
          # itself on any crash. Holding the renewal only in memory would mean a
          # restart silently reverting to the original token and the agent going
          # dead on day seven with nothing in the log to say why.
          try:
              with open(WORKFLOW_TOKEN) as handle:
                  saved = json.load(handle)
              token = saved["token"]
              renew_at = float(saved["renew_at"])
          except (OSError, ValueError, KeyError, TypeError):
              return os.environ.get("FB_TOKEN", ""), time.time() + RENEW_AFTER
          return token, renew_at

      def save_workflow_token(token, renew_at):
          write_json(WORKFLOW_TOKEN, dict(token=token, renew_at=renew_at))

      def write_json(path, body):
          tmp = path + ".new"
          with open(tmp, "w") as handle:
              json.dump(body, handle)
          os.replace(tmp, path)

      TOKEN, RENEW_AT = load_workflow_token()
      TOKEN = [TOKEN]

      def call(url, token, method="GET", body=None, headers=None):
          payload = json.dumps(body).encode() if body is not None else None
          request = urllib.request.Request(url, method=method, data=payload)
          if token:
              request.add_header("Authorization", "Bearer " + token)
          request.add_header("Content-Type", "application/json")
          for name, value in (headers or {}).items():
              request.add_header(name, value)
          try:
              with urllib.request.urlopen(request, context=CTX, timeout=30) as response:
                  raw = response.read()
          except urllib.error.HTTPError as err:
              # A rejected credential and an unreachable service both arrive as
              # exceptions; without the status in the message the log cannot
              # tell a permanent 401 from a blip worth waiting out.
              detail = err.read().decode("utf-8", "replace").strip()[:200]
              raise RuntimeError("HTTP %d from %s: %s" % (err.code, url, detail)) from None
          # An empty body is a valid HTTP response and a broken API response;
          # every caller here dereferences the result, so it is normalised once.
          return json.loads(raw) if raw else {}

      def list_endpoints():
          # Every page, or none of them. A truncated walk looks exactly like the
          # gateway having disappeared, and acting on it would detach a working
          # agent, so a failure here propagates and the caller keeps what it has.
          rows = []
          page_token = ""
          while True:
              url = API + "/v4/endpoints?pageSize=500"
              if page_token:
                  url = url + "&pageToken=" + page_token
              page = call(url, TOKEN[0])
              rows.extend(page.get("endpoints") or [])
              page_token = page.get("pageToken") or ""
              if not page_token:
                  return rows

      def endpoint_id_of(row):
          # Only the external-API case may go without one. A Fuzzball endpoint
          # with no id would otherwise skip minting and still be written into
          # config.yaml with a key_cmd pointing at a file nobody wrote.
          found = row.get("id")
          if not found:
              raise RuntimeError(
                  "the endpoint at " + (row.get("url") or "?") + " has no id to mint against")
          return found

      def find_gateway():
          # Returns (base url, endpoint id). The id is None only for an endpoint
          # this cluster does not own, where nothing is minted.
          if FIXED and not MINT:
              return FIXED, None
          rows = list_endpoints()
          if FIXED:
              for row in rows:
                  if (row.get("url") or "").rstrip("/") == FIXED:
                      return FIXED, endpoint_id_of(row)
              raise LookupError(
                  "Endpoint " + FIXED + " is not an endpoint this workflow can reach; "
                  "set EndpointAuth=api-key to treat it as an external API")
          found = []
          for row in rows:
              if (row.get("annotations") or {}).get(API_ANNOTATION) != WANT_API:
                  continue
              # An agent fronting itself is a loop, not a gateway.
              if row.get("workflowId") == OWN_WORKFLOW:
                  continue
              if row.get("url"):
                  found.append(row)
          if not found:
              raise LookupError(
                  "no endpoint annotated " + API_ANNOTATION + "=" + WANT_API + " is visible "
                  "to this workflow; start the litellm entry, or set Endpoint explicitly")
          if len(found) > 1:
              urls = ", ".join(sorted((row.get("url") or "") for row in found))
              raise LookupError(
                  "several gateways are visible (" + urls + "); set Endpoint to choose one")
          return (found[0].get("url") or "").rstrip("/"), endpoint_id_of(found[0])

      def mint(endpoint_id):
          # Returns (token, expiry epoch). The server grants at most what is left
          # of this workflow's own token, which can be far less than TTL asks for.
          minted = call(API + "/v4/endpoints/" + endpoint_id + "/token", TOKEN[0],
                        method="POST", body=dict(expirationSeconds=TTL))
          token = minted.get("token")
          if not token:
              raise RuntimeError("no token in the mint response")
          stamp = minted.get("expiresAt")
          if isinstance(stamp, str):
              try:
                  parsed = datetime.datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  return token, parsed.timestamp()
              except ValueError:
                  pass
          return token, time.time() + TTL

      def renew_workflow_token(state):
          fresh = call(API + "/v4/workflows:refreshToken", TOKEN[0],
                       method="POST", body=dict())
          if not fresh.get("token"):
              raise RuntimeError("no token in the refreshToken response")
          TOKEN[0] = fresh["token"]
          state["renew_at"] = time.time() + RENEW_AFTER
          save_workflow_token(TOKEN[0], state["renew_at"])

      def write_credential(token, expires_at):
          # key_cmd reads this file and honours the absolute expiry, so Hermes
          # re-reads it exactly when the credential it holds goes stale.
          stamp = datetime.datetime.fromtimestamp(
              expires_at, datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          write_json(CREDENTIAL, dict(access_token=token, expiry=stamp))

      def gateway_models(base, token):
          # Never fall back from one credential to the other. Against a Fuzzball
          # endpoint the proxy consumes the bearer, so sending the gateway's key
          # there hands it to the proxy instead of to LiteLLM and fails opaquely.
          headers = dict()
          if MINT:
              if not token:
                  raise RuntimeError("no minted credential to list models with")
              if LLM_KEY:
                  headers["x-litellm-api-key"] = LLM_KEY
              bearer = token
          else:
              bearer = LLM_KEY
          listing = call(base + "/v1/models", bearer, headers=headers)
          return [row.get("id") for row in (listing.get("data") or []) if row.get("id")]

      def provider_entry(base):
          entry = dict(api=base + "/v1", transport="chat_completions",
                       context_length=CONTEXT, discover_models=True)
          if MINT:
              entry["key_cmd"] = "cat " + CREDENTIAL
              if LLM_KEY:
                  # The endpoint proxy eats the Authorization header, so the
                  # gateway's own key has to travel beside it, not in it.
                  entry["extra_headers"] = {"x-litellm-api-key": LLM_KEY}
          else:
              entry["api_key"] = LLM_KEY
          if CA:
              entry["ssl_ca_cert"] = CA
          return entry

      def load_config():
          try:
              with open(CONFIG) as handle:
                  config = yaml.safe_load(handle)
          except FileNotFoundError:
              return {}
          except yaml.YAMLError as err:
              # A half-written or hand-broken config would otherwise be fatal on
              # every start of a persistent volume, with no way out but deleting
              # the file by hand.
              spoiled = CONFIG + ".unreadable"
              os.replace(CONFIG, spoiled)
              print("CONFIG-UNREADABLE moved to", spoiled, repr(err), flush=True)
              return {}
          return config if isinstance(config, dict) else {}

      def pick_model(served, current):
          # Prefer whatever is already selected, so a user's choice survives the
          # next pass; otherwise sort, because /v1/models order shifts as the
          # gateway re-registers models and the first entry is not stable.
          if current and current in served:
              return current
          return sorted(served)[0]

      def write_config(base, model):
          config = load_config()
          # 'providers:' or 'model:' written with no value parses to None, and a
          # hand-written 'model: gpt-4' to a string; setdefault would hand either
          # straight back and the merge would fail on every restart.
          providers = config.get("providers")
          if not isinstance(providers, dict):
              providers = {}
          selected = config.get("model")
          if not isinstance(selected, dict):
              selected = {}

          first_attach = PROVIDER not in providers
          entry = provider_entry(base)
          if model:
              entry["default_model"] = model
          before = (providers.get(PROVIDER), dict(selected))

          providers[PROVIDER] = entry
          # Only while nothing has been chosen, or on the very first attach.
          # Past that the active model belongs to whoever picked it, and
          # rewriting it every pass would undo a dashboard selection within
          # the minute.
          if model and (first_attach or selected.get("provider") in (None, "", "auto")):
              selected["provider"] = "custom:" + PROVIDER
              selected["default"] = model
          after = (providers.get(PROVIDER), dict(selected))

          config["providers"] = providers
          config["model"] = selected
          if before == after:
              return False

          # safe_dump does not preserve comments, so anything hand-written in
          # config.yaml survives in value but not in form.
          tmp = CONFIG + ".new"
          with open(tmp, "w") as handle:
              yaml.safe_dump(config, handle, default_flow_style=False, sort_keys=False)
          os.replace(tmp, CONFIG)
          return True

      def load_state():
          # Re-derived from disk on every process start rather than carried in
          # memory. This pass restarts itself on any crash, and a state dict only
          # one process generation ever sees is exactly how a restart turns into
          # a fresh mint on every interval, or silently loses a renewed token.
          state = dict(base=None, model=None, token=None, renew_at=RENEW_AT,
                       remint_at=0.0)
          entry = (load_config().get("providers") or {}).get(PROVIDER)
          if isinstance(entry, dict) and isinstance(entry.get("api"), str):
              if entry["api"].endswith("/v1"):
                  state["base"] = entry["api"][:-len("/v1")]
              if isinstance(entry.get("default_model"), str):
                  state["model"] = entry["default_model"]
          try:
              with open(CREDENTIAL) as handle:
                  saved = json.load(handle)
              expiry = datetime.datetime.fromisoformat(
                  saved["expiry"].replace("Z", "+00:00")).timestamp()
              state["token"] = saved["access_token"]
              state["remint_at"] = time.time() + (expiry - time.time()) / 2
          except (OSError, ValueError, KeyError, TypeError, AttributeError):
              # No usable credential on disk, so whatever the config says the
              # base is, it has to be minted for again before it can be used.
              # Only when minting: an api-key provider has no credential file to
              # find, and forgetting the base there just logs a spurious move.
              if MINT:
                  state["base"] = None
          return state

      def attach(state):
          if MINT and time.time() >= state["renew_at"]:
              try:
                  renew_workflow_token(state)
                  print("TOKEN-RENEWED", flush=True)
              except Exception as err:
                  # The old token stays valid until its original expiry, so a
                  # failed renewal must not take the rest of the pass with it.
                  # Hourly, not every interval: this is days ahead of the need.
                  state["renew_at"] = time.time() + 3600
                  print("TOKEN-RENEWAL-FAILED", repr(err), flush=True)

          base, endpoint_id = find_gateway()
          moved = base != state["base"]
          if MINT and endpoint_id and (moved or time.time() >= state["remint_at"]):
              token, expires_at = mint(endpoint_id)
              write_credential(token, expires_at)
              state["token"] = token
              # Halfway to the granted expiry, and never sooner than a minute:
              # a grant that is already short, or clock skew, would otherwise
              # put the next mint in the past and mint on every pass.
              state["remint_at"] = max(time.time() + (expires_at - time.time()) / 2,
                                       time.time() + 60)
              # Recorded on the mint, not at the end of the pass: a failure
              # further down must not read as a moved gateway next time and
              # mint all over again.
              state["base"] = base
              print("MINTED", base, flush=True)

          model = WANT_MODEL
          if not model:
              served = gateway_models(base, state["token"])
              if not served:
                  raise LookupError(
                      "the gateway at " + base + " serves no models yet; start a model "
                      "workflow it can discover, or set Model explicitly")
              model = pick_model(served, state["model"])

          if write_config(base, model) or moved:
              print("ATTACHED", base, model, flush=True)
          state["base"] = base
          state["model"] = model
          return state

      def main():
          if MINT and not (API and TOKEN[0]):
              sys.exit("FATAL: no workflow API identity was injected, so no gateway can be "
                       "discovered and no token minted. Set Endpoint and EndpointAuth=api-key.")
          state = load_state()
          once = "--once" in sys.argv
          deadline = time.time() + BOOTSTRAP
          while True:
              try:
                  attach(state)
                  if once:
                      return
              except Exception as err:
                  # A gateway whose model pool is still starting is the ordinary
                  # case, not a misconfiguration, so the first pass keeps trying
                  # for a while before giving up on the service entirely.
                  if once and time.time() >= deadline:
                      sys.exit("FATAL: could not attach within %ds: %r" % (BOOTSTRAP, err))
                  print("ATTACH-FAILED", repr(err), flush=True)
              time.sleep(min(INTERVAL, 10) if once else INTERVAL)

      main()
      PYEOF

      # Fail the service rather than start an agent with no model behind it: an
      # unattached Hermes answers the dashboard and then errors on every prompt.
      if ! "${HERMES_PY}" {{ $runtime }}/attach.py --once; then
        echo "FATAL: could not attach to a gateway; see the error above." >&2
        exit 1
      fi

      # Neither loop is supervised by s6, which only manages services declared
      # in the image, so both restart themselves.
      (
        while true; do
          "${HERMES_PY}" {{ $runtime }}/attach.py || \
            echo "ATTACH-CRASHED restarting in 15s" >&2
          sleep 15
        done
      ) &

      # Started here rather than with HERMES_DASHBOARD=1, which is read only by
      # the image's s6 service definition. That definition runs only when the
      # entrypoint is PID 1, which nothing guarantees here; off that path the
      # dashboard would fall back to its own defaults of 127.0.0.1:9119 -- a
      # bind and a port nothing publishes -- and the readiness probe would fail
      # for ten minutes and take the service down with it.
      (
        while true; do
          "${HERMES_BIN}" dashboard --host 0.0.0.0 --port {{ $dashboard_port }} --no-open || \
            echo "DASHBOARD-EXITED restarting in 10s" >&2
          sleep 10
        done
      ) &

      # The dashboard guards the Host and WebSocket Origin headers against the
      # address it believes it is served at, and behind the endpoint proxy that
      # is not the address it binds. Left unset, sign-in fails on the guard.
      if [ -n "${FB_ENDPOINT_URL_DASHBOARD}" ]; then
        export HERMES_DASHBOARD_PUBLIC_URL="${FB_ENDPOINT_URL_DASHBOARD}"
      fi

      # The CLI directly, not the image's entrypoint. Both that dispatcher and
      # the main-wrapper it calls refuse to start under any uid that is neither
      # root nor the image's own baked user, and Fuzzball provides neither --
      # every other entry in this catalog says so in as many words. What those
      # wrappers do beyond the refusal is set up s6 supervision and repair file
      # ownership after a privilege drop, and neither applies when one uid owns
      # the whole run and this script has already seeded the state tree.
      exec "${HERMES_BIN}" gateway run
    network:
      ports:
        - name: dashboard
          port: {{ $dashboard_port }}
          protocol: tcp
        # Declared whether or not an endpoint fronts it: the API server binds
        # this port on the node either way, and a port the definition does not
        # mention is one nobody thinks to protect.
        - name: api
          port: {{ $api_port }}
          protocol: tcp
      endpoints:
        - name: dashboard
          port-name: dashboard
          protocol: http
          type: subdomain
          scope: {{ $scope }}
        {{- if .ExposeApiServer }}
        - name: api
          port-name: api
          protocol: http
          type: subdomain
          scope: {{ $scope }}
        {{- end }}
    readiness-probe:
      # A TCP check rather than the dashboard's own: every HTTP route behind the
      # auth gate answers 401 or redirects to the sign-in page, and the API
      # server's /health wants its key.
      tcp-socket:
        port: {{ $dashboard_port }}
      initial-delay-seconds: 20
      period-seconds: 10
      timeout-seconds: 5
      failure-threshold: 60
      success-threshold: 1
    resource:
      cpu:
        cores: {{ .Cores }}
      memory:
        size: {{ $memory }}
    persist: true
