          if all(r['strain_energy_J'] is not None for r in results):
              se_best   = se_vals.index(min(se_vals))
              comp_best = comp_vals.index(min(comp_vals))
              rec_eff = (
                  "<li><strong>Most efficient (lowest strain energy):</strong> "
