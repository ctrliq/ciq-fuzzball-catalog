          + '<style>' + css + '</style></head><body>'
          + '<div class=hdr><h1>FEA Material Sweep Report</h1>'
          + '<p>' + str(len(results)) + ' materials analyzed in parallel | Load: '
          + '{:,.0f}'.format(APPLIED_FORCE_N) + ' N</p></div>'

          # Material properties section
