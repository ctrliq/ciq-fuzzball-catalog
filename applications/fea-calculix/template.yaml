          '.it th{background:#34495e;font-size:.8em;padding:5px 8px}'
          '.it td{padding:5px 8px;font-size:.8em}'
          ".best{font-weight:bold;color:#27ae60}"
          'ul li{margin-bottom:7px;list-style:none}'
