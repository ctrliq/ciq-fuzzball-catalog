          + '</span> (' + '{:,.0f}'.format(dens[li]) + ' kg/m3)</li>'
          + "<li><strong>Best specific stiffness (E/ρ):</strong> <span class='best'>" + names[si] + '</span></li>'
          + "<li><strong>Best strength-to-weight:</strong> <span class='best'>" + names[wi] + '</span></li>'
