          + '<div class=card><h3>Yield Strength</h3><p class=sub>Max stress before permanent deformation</p><img src=yield.png></div>'
          + '<div class=card><h3>Density</h3><p class=sub>Mass per unit volume</p><img src=density.png></div>'
          + "<div class=card><h3>Poisson's Ratio</h3><p class=sub>Lateral strain under axial load</p><img src=poisson.png></div>"
          + '</div><div class=grid>'
