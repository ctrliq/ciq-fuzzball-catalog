      with open('/data/report/index.html', 'w') as f:
          f.write(html)
      print('Report written to /data/report/index.html')
      PYEOF
    resource:
      cpu:
        cores: 1
      memory:
        size: 2GiB
    policy:
      timeout:
        execute: 15m

services:

  # ════════════════════════════════════════════════════════════
  # SERVE
  # No depends-on — services start immediately.
  # Wait loop holds until report is ready, then starts server.
  # Readiness probe ensures endpoint only activates when live.
  # ════════════════════════════════════════════════════════════
  serve:
    image:
      uri: "docker://python:3.12-slim"
    persist: true
    mounts:
      data:
        location: "/data"
    script: |
      #!/bin/sh
      echo "Waiting for report..."
      while [ ! -f /data/report/index.html ]; do
        sleep 3
      done
      echo "Report found. Starting server on port 8080..."
      exec python3 -m http.server 8080 --directory /data/report
    network:
      ports:
        - name: http
          port: 8080
          protocol: tcp
      endpoints:
        - name: report
          port-name: http
          protocol: http
          type: subdomain
          scope: user
    readiness-probe:
      http-get:
        path: /
        port: 8080
      initial-delay-seconds: 5
      period-seconds: 5
      failure-threshold: 60
      success-threshold: 1
    resource:
      cpu:
        cores: 1
      memory:
        size: 1GiB
    policy:
      timeout:
        execute: 2h
