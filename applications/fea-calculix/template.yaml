      def fos_color(f):
          if f is None: return '#888'
          if f >= 2.0:  return '#27ae60'
          if f >= 1.5:  return '#E67E22'
          return '#E74C3C'

      def badge(txt):
          if txt.startswith('CRITICAL'): return "<span class='badge br'>" + txt + '</span>'
          if txt.startswith('WARNING'):  return "<span class='badge bo'>" + txt + '</span>'
          if txt.startswith('CAUTION'):  return "<span class='badge by'>" + txt + '</span>'
          return "<span class='badge bg'>" + txt + '</span>'

      def fmt_or_na(val, fmt):
